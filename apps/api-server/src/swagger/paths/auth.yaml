# Authentication Endpoints

# WO-O4O-LEGACY-PASSWORD-AUTH-RETIREMENT-V1:
#   /auth/login · /auth/register · /auth/forgot-password · /auth/reset-password 는 은퇴했다.
#   로그인·가입은 /auth/google/login · /auth/google/signup 이다.

/auth/refresh:
  post:
    tags:
      - Auth
    summary: 토큰 갱신
    description: 리프레시 토큰을 사용하여 새로운 액세스 토큰을 발급받습니다
    operationId: refreshToken
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - refreshToken
            properties:
              refreshToken:
                type: string
                description: 리프레시 토큰
    responses:
      '200':
        description: 토큰 갱신 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    token:
                      type: string
                      description: 새로운 액세스 토큰
                    refreshToken:
                      type: string
                      description: 새로운 리프레시 토큰
      '401':
        description: 유효하지 않은 리프레시 토큰
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/logout:
  post:
    tags:
      - Auth
    summary: 로그아웃
    description: 현재 세션을 종료하고 토큰을 무효화합니다
    operationId: logout
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 로그아웃 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: 로그아웃되었습니다

/auth/verify-email:
  post:
    tags:
      - Auth
    summary: 이메일 인증
    description: 이메일 인증 토큰을 검증합니다
    operationId: verifyEmail
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - token
            properties:
              token:
                type: string
                description: 이메일 인증 토큰
    responses:
      '200':
        description: 이메일 인증 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: 이메일이 성공적으로 인증되었습니다
      '400':
        description: 유효하지 않거나 만료된 토큰
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/auth/me:
  get:
    tags:
      - Auth
    summary: 현재 사용자 정보 조회
    description: 인증된 사용자의 정보를 반환합니다
    operationId: getCurrentUser
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 사용자 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/User'
      '401':
        description: 인증 필요
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'