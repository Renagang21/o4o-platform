<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link id="o4o-service-icon" rel="icon" type="image/svg+xml" href="%BASE_URL%brand/admin/favicon.svg" />
    <link id="o4o-service-ico" rel="icon" sizes="16x16 32x32 48x48" href="%BASE_URL%brand/admin/favicon.ico" />
    <link id="o4o-service-touch" rel="apple-touch-icon" href="%BASE_URL%brand/admin/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>O4O Admin Dashboard v0.5.9</title>
    <!-- DNS prefetch for API -->
    <link rel="dns-prefetch" href="https://api.neture.co.kr" />
    <link rel="preconnect" href="https://api.neture.co.kr" crossorigin />
    <style>
      /* Critical CSS for initial loading spinner */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
      }
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
