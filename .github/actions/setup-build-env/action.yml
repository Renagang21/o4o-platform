name: 'Setup Build Environment'
description: 'Setup Node.js, pnpm, install dependencies, and build packages'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22.18.0'
  pnpm-version:
    # 저장소 기준은 package.json 의 volta.pnpm (10.25.0) 이다.
    # 과거 기본값 '9' 는 로컬과 메이저가 달라 CI 전용 재현 문제의 원인이 됐다.
    # pnpm v10 의 build script 차단 정책은 package.json 의
    # pnpm.onlyBuiltDependencies 로 이미 처리되어 있다.
    description: 'pnpm version'
    required: false
    default: '10.25.0'
  build-packages:
    description: 'Whether to build shared packages'
    required: false
    default: 'true'
  strict-lockfile:
    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1
    # 기본값 'false' 는 기존 동작(frozen 실패 시 no-frozen 으로 재시도)을 그대로 둔다.
    # 이 fallback 은 배포 경로를 지키기 위해 존재하지만(deploy-api.yml 의
    # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH 회피 주석 참조), 검증 경로에서는
    # lockfile drift 를 조용히 흡수해 결함을 가린다.
    # 따라서 CI Pipeline 만 'true' 로 opt-in 해 lockfile drift 를 실패로 만든다.
    description: 'Fail (instead of falling back to --no-frozen-lockfile) when the lockfile is out of sync'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        if [ "${{ inputs.strict-lockfile }}" = "true" ]; then
          # 검증 경로: lockfile drift 는 결함이므로 실패시킨다.
          pnpm install --frozen-lockfile
        else
          # 배포 경로: 기존 동작 유지 (frozen 실패 시 no-frozen 으로 재시도)
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
        fi

    - name: Build shared packages
      if: ${{ inputs.build-packages == 'true' }}
      shell: bash
      run: |
        echo "🔨 Building shared packages..."
        pnpm run build:packages
        echo "✅ All packages built successfully"
