name: 'Setup Build Environment'
description: 'Setup Node.js, pnpm, install dependencies, and build packages'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22.23.4'
  pnpm-version:
    # 저장소 기준은 package.json 의 volta.pnpm (10.25.0) 이다.
    # 과거 기본값 '9' 는 로컬과 메이저가 달라 CI 전용 재현 문제의 원인이 됐다.
    # pnpm v10 의 build script 차단 정책은 package.json 의
    # pnpm.onlyBuiltDependencies 로 이미 처리되어 있다.
    description: 'pnpm version'
    required: false
    default: '10.25.0'
  build-packages:
    description: 'Whether to build shared packages'
    required: false
    default: 'true'
  strict-lockfile:
    # Deprecated compatibility input. Every caller now uses a frozen lockfile;
    # deployment must fail rather than silently resolve a different dependency tree.
    description: 'Compatibility input; installation is always frozen'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile --verify-store-integrity=true

    - name: Build shared packages
      if: ${{ inputs.build-packages == 'true' }}
      shell: bash
      run: |
        echo "🔨 Building shared packages..."
        pnpm run build:packages
        echo "O4O_PACKAGES_PREBUILT=1" >> "$GITHUB_ENV"
        echo "✅ All packages built successfully"
