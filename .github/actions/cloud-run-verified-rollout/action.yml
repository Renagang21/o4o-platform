name: Cloud Run verified rollout
description: >-
  WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4.
  phase=plan: 배포 전 traffic(pin/latest · 이전 revision) 기록.
  phase=finish: traffic 0% 로 배포된 새 revision 을 tag URL 로 직접 smoke → PASS 일 때만 전환(방식 보존).
  smoke 실패 = 전환 없음 = 기존 serving revision 유지 (DEPLOY_FAILED_BEFORE_TRAFFIC_SWITCH).
  호출 job 은 `gcloud run deploy ... --no-traffic --tag=sha-<sha12>` 로 배포해야 하며 GCP 인증이 끝나 있어야 한다.

inputs:
  phase:
    description: "'plan' (배포 전) | 'finish' (배포 후 smoke → switch)"
    required: true
  service:
    description: Cloud Run 서비스 이름
    required: true
  paths:
    description: "smoke 경로 (쉼표 구분). '/' 는 HTML 이어야 PASS"
    required: false
    default: '/'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'

    - name: Record traffic before deploy
      if: inputs.phase == 'plan'
      shell: bash
      run: node scripts/ci/cloud-run-rollout.mjs plan --service "${{ inputs.service }}" --out "$RUNNER_TEMP/rollout-plan-${{ inputs.service }}.json"

    - name: Smoke new revision (tag URL, traffic 0%)
      if: inputs.phase == 'finish'
      shell: bash
      run: node scripts/ci/cloud-run-rollout.mjs smoke --service "${{ inputs.service }}" --tag "sha-${GITHUB_SHA:0:12}" --paths "${{ inputs.paths }}" --attempts 3

    - name: Switch traffic to verified revision
      if: inputs.phase == 'finish'
      shell: bash
      run: node scripts/ci/cloud-run-rollout.mjs switch --service "${{ inputs.service }}" --tag "sha-${GITHUB_SHA:0:12}" --plan "$RUNNER_TEMP/rollout-plan-${{ inputs.service }}.json"
