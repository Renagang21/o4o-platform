name: Deploy Web Services (Cloud Run)

# Deploy web services to Cloud Run on push to main
# H9-0: Docker(Container) 배포 방식으로 전환
# 변경된 웹서버만 배포됨

concurrency:
  # 서비스 단위 1개 rollout — 서비스마다 독립 group. 진행 중 run 은 끝까지, 대기 run 은 더 새 것으로 대체.
  #   (service=all 수동 실행은 개별 서비스 run 과 같은 group 이 아니다 — 동시에 쓰지 않는다)
  group: deploy-web-${{ inputs.service || 'all' }}
  cancel-in-progress: false

on:
  # WO-O4O-CICD-DEPLOY-FREEZE-CUTOVER-V1: push trigger 은퇴. 자동 배포는 `deploy-auto.yml`(main CI 성공 → 위험 판정 →
  #   LEVEL_2 만 이 workflow 를 `deploy/auto-<sha>` 태그 ref 로 dispatch) 이 유일한 진입점이다. 사람은 통제 배포(LEVEL_3 ·
  #   첫 rollout)만 이 workflow 를 직접 dispatch 한다. 게이트는 `DEPLOY_FREEZE` 하나 — 정확히 'false' 일 때만 배포.
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (all, neture, k-cosmetics, kpa-society, pharmacy-hub, lecture, store, kpa-branch, signage-player, hospital-pharmacy)'
        required: false
        default: 'all'
      # WO-O4O-WEB-SERVICES-CD-DEPENDENCY-AFFECTED-DEPLOY-GATE-V1 §24 — 판정 재현 전용.
      # 둘 다 주면 service 입력 대신 그 범위를 detector 로 판정한다
      # (API CD gate 와 동일한 선례). 비워두면 기존 수동 배포 동작 그대로다.
      base_sha:
        description: '(optional) 판정 재현 base SHA'
        required: false
      head_sha:
        description: '(optional) 판정 재현 head SHA'
        required: false
      # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4 — 기본 legacy = 종전 동작 그대로.
      rollout_mode:
        description: "'verified'(기본 · 0% 배포 → 검증 → 전환 → 실패 시 복귀) | 'legacy'(종전 — 새 revision 즉시 서빙/pin 유지)"
        required: false
        default: 'verified'
  # WO-O4O-CICD-UNIFIED-DELIVERY-PIPELINE-V1 — Unified Delivery(`delivery.yml` · `promote.yml`)의 자동 · 승인 진입점.
  #   서비스 1개 = 호출 1개(matrix). 태그 · dispatch 없음. target SHA = 호출자의 `github.sha`(호출자가 target == github.sha ==
  #   main HEAD 를 강제) — 아래 build · deploy · verified rollout step 은 dispatch 경로와 같은 줄을 그대로 쓴다.
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      rollout_mode:
        type: string
        required: false
        default: 'verified'
      base_sha:
        type: string
        required: false
        default: ''
      head_sha:
        type: string
        required: false
        default: ''
      dry_run:
        description: "'true' = 배선 검증 — detect 까지만 (ci-gate · build · deploy 0)"
        type: string
        required: false
        default: 'false'

env:
  PROJECT_ID: netureyoutube
  REGION: asia-northeast3
  # WO-O4O-CLOUD-RUN-RUNTIME-SA-LEAST-PRIVILEGE-V1 — Cloud Run runtime identity (default compute SA · roles/editor 사용 종료).
  #   github-actions SA 는 이 SA 에 대해서만 actAs 할 수 있다(SA 리소스 단위 iam.serviceAccountUser). 권한: CHECK-O4O-CLOUD-RUN-RUNTIME-SA-LEAST-PRIVILEGE-V1
  RUNTIME_SA: o4o-runtime@netureyoutube.iam.gserviceaccount.com
  # Default API URL (neture uses this)
  VITE_API_BASE_URL: https://api.neture.co.kr
  # Service-specific API URLs (same-origin for cookie auth)
  VITE_API_URL_KPA_SOCIETY: https://api.neture.co.kr
  VITE_API_URL_K_COSMETICS: https://api.neture.co.kr
  VITE_KPA_URL: https://kpa-society-web-3e3aws7zqa-du.a.run.app
  # WO-O4O-DOMAIN-SSOT-CANONICALIZATION-V1: per-service canonical URL injected as build-arg.
  # Values mirror apps/api-server/src/config/service-catalog.ts O4O_SERVICES[].domain.
  VITE_SERVICE_URL_NETURE: https://neture.co.kr
  # WO-O4O-SERVICE-CATALOG-CANONICAL-DOMAIN-AND-PH-JOIN-CLEANUP-V1: catalog canonical 정렬(옛 호스트는 수용 전용).
  VITE_SERVICE_URL_KPA_SOCIETY: https://pharmacy.neture.co.kr
  VITE_SERVICE_URL_K_COSMETICS: https://retail.neture.co.kr
  # WO-PHARMACY-HUB-DEPLOY-BOOTSTRAP-AND-MEMBERSHIP-E2E-V1
  VITE_API_URL_PHARMACY_HUB: https://api.neture.co.kr
  VITE_SERVICE_URL_PHARMACY_HUB: https://pharmacyhub.co.kr
  VITE_API_URL_LECTURE: https://api.neture.co.kr
  VITE_SERVICE_URL_LECTURE: https://study.neture.co.kr
  VITE_API_URL_STORE: https://api.neture.co.kr
  VITE_SERVICE_URL_STORE: https://store.neture.co.kr
  # WO-O4O-UNIFIED-STORE-WORKSPACE-FOUNDATION-V1 §8-4: KPA·KCos·PH 매장 진입 → store.neture.co.kr handoff.
  # cutover 전환 = 이 한 줄을 'true' 로 (DNS·cert·Google origin 준비 후). 기본 'false' = 기존 매장 화면 유지.
  VITE_UNIFIED_STORE_HANDOFF: 'false'
  # WO-O4O-KPA-BRANCH-DEPLOY-AND-RUNTIME-SMOKE-V1
  # 분회 서비스는 단일 web service 하나만 운영한다 (분회별 Cloud Run 서비스 생성 금지).
  # 분회 tenant 는 URL segment(/{slug}) 또는 Host(branch_domains) 로만 해석된다.
  VITE_API_URL_KPA_BRANCH: https://api.neture.co.kr
  # WO-O4O-SIGNAGE-PLAYER-WEB-DEPLOYMENT-ADOPTION-AND-PRODUCTION-SMOKE-V1
  # Signage Player 는 익명 단말 런타임이다. public runtime config(API base) 만 주입한다.
  # secret / service account key / DB credential 은 절대 주입하지 않는다.
  VITE_API_URL_SIGNAGE_PLAYER: https://api.neture.co.kr
  # WO-O4O-HOSPITAL-PHARMACY-SERVICE-FOUNDATION-V1
  # 병원약국 전문 서비스. 원내 목록은 브라우저 localStorage 에만 저장(D2) — API base 만 주입한다.
  # DNS·인증서(hospital.neture.co.kr) 는 Foundation 범위 밖(사용자측 · signage-player·pharmacy-hub 선례).
  VITE_API_URL_HOSPITAL_PHARMACY: https://api.neture.co.kr
  VITE_SERVICE_URL_HOSPITAL_PHARMACY: https://neture.co.kr/hospital

jobs:
  freeze-notice:
    # WO-O4O-CICD-DEPLOY-FREEZE-CUTOVER-V1 — DEPLOY_FREEZE 가 'false' 가 아니면(부재 · 공백 · true · 오타 포함 = fail-closed)
    #   이 job 만 돌고 배포 job 은 전부 skip 된다. GitHub 식의 문자열 비교는 대소문자를 구분하지 않는다.
    if: vars.DEPLOY_FREEZE != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy freeze
        run: |
          {
            echo "## 🧊 Production deploy frozen — DEPLOY_FREEZE != 'false'"
            echo ""
            echo "이 워크플로의 배포 job 은 실행되지 않았습니다 (build · migration · Cloud Run deploy 0)."
            echo ""
            echo "- DEPLOY_FREEZE = '${{ vars.DEPLOY_FREEZE }}'  (정확히 'false' 일 때만 배포 · 부재/공백/오타 = freeze)"
            echo "- 정상 운영값은 false. 비상 · 정비 시에만 true — README \"배포\" 절."
            echo "- commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOY_FREEZE_ACTIVE=1 (DEPLOY_FREEZE='${{ vars.DEPLOY_FREEZE }}')"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      neture: ${{ steps.changes.outputs.neture }}
      k-cosmetics: ${{ steps.changes.outputs.k-cosmetics }}
      kpa-society: ${{ steps.changes.outputs.kpa-society }}
      pharmacy-hub: ${{ steps.changes.outputs.pharmacy-hub }}
      lecture: ${{ steps.changes.outputs.lecture }}
      store: ${{ steps.changes.outputs.store }}
      kpa-branch: ${{ steps.changes.outputs.kpa-branch }}
      signage-player: ${{ steps.changes.outputs.signage-player }}
      hospital-pharmacy: ${{ steps.changes.outputs.hospital-pharmacy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # WO-O4O-WEB-DEPLOY-DETECT-CHANGES-LAST-DEPLOYED-SHA-V1:
          # full history needed to diff github.event.before..github.sha (multi-commit push batch)
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # 판정 재현 모드 — base/head 를 명시하면 detector 를 그대로 돌린다 (§24).
          if [ -n "${{ inputs.base_sha }}" ] && [ -n "${{ inputs.head_sha }}" ]; then
            echo "replay mode: ${{ inputs.base_sha }}..${{ inputs.head_sha }}"
            BASE_SHA="${{ inputs.base_sha }}" HEAD_SHA="${{ inputs.head_sha }}"               node scripts/ci/detect-affected.mjs
            exit 0
          fi

          # 서비스 지정 실행 — workflow_dispatch(수동 · 기본 'all') 와 workflow_call(Unified Delivery · 서비스 1개).
          #   workflow_call 에서는 github.event_name 이 호출자 것(workflow_run · workflow_dispatch)이라 입력 유무로 가른다.
          if [ -n "${{ inputs.service }}" ]; then
            SERVICE="${{ inputs.service }}"
            if [ "$SERVICE" = "all" ]; then
              echo "neture=true" >> $GITHUB_OUTPUT
              echo "k-cosmetics=true" >> $GITHUB_OUTPUT
              echo "kpa-society=true" >> $GITHUB_OUTPUT
              echo "pharmacy-hub=true" >> $GITHUB_OUTPUT
              echo "lecture=true" >> $GITHUB_OUTPUT
              echo "store=true" >> $GITHUB_OUTPUT
              echo "kpa-branch=true" >> $GITHUB_OUTPUT
              echo "signage-player=true" >> $GITHUB_OUTPUT
              echo "hospital-pharmacy=true" >> $GITHUB_OUTPUT
            else
              echo "neture=$( [ "$SERVICE" = 'neture' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "k-cosmetics=$( [ "$SERVICE" = 'k-cosmetics' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "kpa-society=$( [ "$SERVICE" = 'kpa-society' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "pharmacy-hub=$( [ "$SERVICE" = 'pharmacy-hub' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "lecture=$( [ "$SERVICE" = 'lecture' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "store=$( [ "$SERVICE" = 'store' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "kpa-branch=$( [ "$SERVICE" = 'kpa-branch' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "signage-player=$( [ "$SERVICE" = 'signage-player' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
              echo "hospital-pharmacy=$( [ "$SERVICE" = 'hospital-pharmacy' ] && echo 'true' || echo 'false' )" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # WO-O4O-WEB-DEPLOY-DETECT-CHANGES-LAST-DEPLOYED-SHA-V1:
          # push events — compare the WHOLE pushed batch (event.before..github.sha) instead of
          # tip-only (HEAD~1 HEAD). tip-only skipped web deploys when a docs-only/other commit
          # became HEAD after the web-change commit in the same push.
          HEAD_SHA="${{ github.sha }}"
          BASE_SHA="${{ github.event.before }}"

          # fallback when before is unusable: all-zeros (new branch / first push / force push)
          # or not present locally → use HEAD~1; if even that is missing, the detector's own
          # safe fallback (base SHA 없음 → 전 서비스 true) takes over.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "event.before unusable ('${BASE_SHA}') — fallback to HEAD~1"
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          echo "event=push"
          echo "base_sha=${BASE_SHA:-<none>}"
          echo "head_sha=${HEAD_SHA}"

          # WO-O4O-WEB-SERVICES-CD-DEPENDENCY-AFFECTED-DEPLOY-GATE-V1 §6 · §7 · §15
          #
          # 이전 정책은 `packages/** 변경 → 9개 서비스 전부 재배포` 였다.
          # 실측상 `hospital-pharmacy-core` 한 package 변경으로 9개가 전부 배포됐고
          # 그중 8개는 그 package 를 dependency closure 안에 갖고 있지도 않았다.
          #
          # 판정은 Admin·Docs·API 와 같은 SSOT(`scripts/ci/detect-affected.mjs`) 다.
          # workspace dependency graph 의 transitive closure 만 쓴다 —
          # package 이름 allowlist/denylist 는 어느 쪽에도 없다.
          #
          # output key 는 기존과 동일하다 — detector 가 그 이름 그대로 써넣는다.
          BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" node scripts/ci/detect-affected.mjs

  # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 1 — CI success gate (enforced)
  #   CI Pipeline 이 target SHA 에서 green 이 아니면 어떤 web 서비스도 배포하지 않는다.
  #   게이트가 열려 있고 배포 대상 서비스가 하나라도 있을 때만 돈다(평상시 러너 시간 0).
  ci-gate:
    name: CI gate (target SHA must be green)
    needs: detect-changes
    # dry_run(배선 검증 · workflow_call 전용) 이면 게이트를 열지 않는다 → deploy-* 도 needs 로 skip.
    # WO-O4O-PUBLIC-COLLABORATOR-PRODUCTION-BOUNDARY-AND-MAIN-PROTECTION-V1 — 수동 실행(직접 dispatch · promote 경유)은 저장소 소유자만.
    #   collaborator 가 dispatch 하면 게이트를 열지 않는다(→ 배포 job 전부 skip). 자동 경로(workflow_run)는 그대로.
    if: >-
      vars.DEPLOY_FREEZE == 'false' && inputs.dry_run != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.triggering_actor == github.repository_owner) &&
      contains(toJSON(needs.detect-changes.outputs), '"true"')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Require green CI for target SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/ci-gate.mjs --target "${{ github.sha }}" --wait-seconds 1800 --enforce

  deploy-neture:
    needs: [detect-changes, ci-gate]
    # WO-O4O-LECTURE-INDEPENDENT-SERVICE-SEPARATION-V1 §19 (2026-09-23 INCIDENT)
    #   DEPLOY GATE (fail-closed): `DEPLOY_FREEZE` 가 정확히 'false' 일 때만 배포한다.
    #   변수가 없거나 비어 있으면 Actions 가 빈 문자열을 돌려주므로 **freeze 가 기본값**이다.
    if: vars.DEPLOY_FREEZE == 'false' && needs.detect-changes.outputs.neture == 'true'
    runs-on: ubuntu-latest
    # `environment: production` — 배포 ref 경계다(WO-O4O-PUBLIC-COLLABORATOR-PRODUCTION-BOUNDARY-AND-MAIN-PROTECTION-V1).
    #   GitHub `production` Environment 는 배포 ref 를 `main` branch · `deploy/*` tag 로 제한하고, production credential 은
    #   environment secret 으로 둔다 — 그 밖의 ref(collaborator branch · PR)에서는 이 job 이 시작되지 않는다. required reviewer 는
    #   없다(대기 없이 실행). 배포 게이트는 그대로 이 job `if:` 의 `DEPLOY_FREEZE`(정확히 'false' 일 때만 · 부재/공백/오타 = freeze)
    #   와 ci-gate(수동 실행 = 소유자만)다.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # WO-O4O-DEPLOY-JOB-BOOTSTRAP-SLIMMING-V1: 배포 빌드와 무관한 운영 데이터 매니페스트
          # (apps/api-server/src/scripts/data, ≈1.25GB)를 받지 않는다. sparse 지정 시 blob:none 부분 fetch.
          sparse-checkout: |
            /*
            !/apps/api-server/src/scripts/data/
          sparse-checkout-cone-mode: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          # runner 에 설치된 gcloud 를 쓴다 (매 job ≈20s SDK 다운로드 생략)
          skip_install: true

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push Docker image
        run: |
          echo "Building neture-web Docker image..."
          IMAGE_TAG="${{ github.sha }}"

          # Build from repo root with Dockerfile path (for workspace packages)
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} \
            --build-arg VITE_SERVICE_URL=${{ env.VITE_SERVICE_URL_NETURE }} \
            -f services/web-neture/Dockerfile \
            -t gcr.io/${{ env.PROJECT_ID }}/neture-web:${IMAGE_TAG} \
            -t gcr.io/${{ env.PROJECT_ID }}/neture-web:latest \
            .

          docker push gcr.io/${{ env.PROJECT_ID }}/neture-web:${IMAGE_TAG}
          docker push gcr.io/${{ env.PROJECT_ID }}/neture-web:latest

      # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4 — verified 모드에서만 배포 전 traffic 기록
      - name: Record traffic before deploy (verified rollout)
        if: inputs.rollout_mode == 'verified'
        uses: ./.github/actions/cloud-run-verified-rollout
        with:
          phase: plan
          service: neture-web

      - name: Deploy to Cloud Run
        run: |
          # verified 모드: 새 revision 은 traffic 0% · 전용 tag 주소 (전환은 다음 step 이 smoke 뒤에 한다)
          ROLLOUT_ARGS=()
          if [ "${{ inputs.rollout_mode }}" = "verified" ]; then ROLLOUT_ARGS=(--no-traffic "--tag=sha-${GITHUB_SHA:0:12}"); fi

          echo "Deploying neture-web to Cloud Run..."

          gcloud run deploy neture-web \
            --image=gcr.io/${{ env.PROJECT_ID }}/neture-web:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 "${ROLLOUT_ARGS[@]}" --update-labels="o4o-commit-sha=${{ github.sha }}"

          echo "neture-web deployed successfully!"

      # verified 모드: 새 revision 을 tag URL 로 직접 smoke → PASS 일 때만 전환. 실패 = 전환 없음 = 기존 revision 유지.
      #   전환 뒤 공개 URL + serving SHA 검증 → 실패(전환 실패 포함) 시 이전 revision 으로 자동 rollback
      #   (WO-O4O-CICD-WEB-VERIFIED-ROLLOUT-POST-SWITCH-VERIFY-ROLLBACK-V1 · 현재 neture 만).
      - name: Smoke new revision and switch traffic (verified rollout)
        if: inputs.rollout_mode == 'verified'
        uses: ./.github/actions/cloud-run-verified-rollout
        with:
          phase: finish
          service: neture-web
          paths: '/'
          verify-url: ${{ env.VITE_SERVICE_URL_NETURE }}

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe neture-web \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "Service URL: ${SERVICE_URL}"

          if curl -sf "${SERVICE_URL}" > /dev/null; then
            echo "neture-web is accessible!"
          else
            echo "neture-web may need a moment to start"
          fi

  deploy-k-cosmetics:
    needs: [detect-changes, ci-gate]
    # WO-O4O-LECTURE-INDEPENDENT-SERVICE-SEPARATION-V1 §19 (2026-09-23 INCIDENT)
    #   DEPLOY GATE (fail-closed): `DEPLOY_FREEZE` 가 정확히 'false' 일 때만 배포한다.
    #   변수가 없거나 비어 있으면 Actions 가 빈 문자열을 돌려주므로 **freeze 가 기본값**이다.
    if: vars.DEPLOY_FREEZE == 'false' && needs.detect-changes.outputs.k-cosmetics == 'true'
