name: Community phase 1 verification

on:
  push:
    branches:
      - work/commonization-community

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/commonization-community

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build common package prerequisites
        run: pnpm run build:packages

      - name: PharmacyHub typecheck
        run: pnpm --filter pharmacy-hub-web run type-check

      - name: PharmacyHub build
        run: pnpm --filter pharmacy-hub-web run build

      - name: KPA forum consumer regression build
        run: pnpm --filter @o4o/web-kpa-society run build

      - name: K-Cosmetics forum consumer regression build
        run: pnpm --filter @o4o/web-k-cosmetics run build

      - name: Neture forum consumer regression build
        run: pnpm --filter @o4o/web-neture run build

      - name: GlycoPharm minimal regression build
        run: pnpm --filter glycopharm-web run build

      - name: Remove one-shot verification workflow
        run: |
          rm .github/workflows/community-phase1-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/community-phase1-verify.yml
          git commit -m "chore(ci): remove one-shot community verifier"
          git push origin HEAD:work/commonization-community
