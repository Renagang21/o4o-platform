name: Deploy API Server (Cloud Run)

# Deploy API server to Cloud Run on push to main branch
# Phase R5: Cloud Run 단일 배포 체계
# Phase G1-2: Operational Mode (Cloud SQL 연결 필수)
# WO-O4O-API-DATABASE-READINESS-AND-COLD-START-TRAFFIC-GATE-FINAL-CLOSURE-V1:
#   API 는 DB 연결·라우트 등록이 끝난 뒤에만 HTTP port 를 연다(READY → listen). 프로덕션에서 GRACEFUL_STARTUP 은
#   코드가 무시하며(NODE_ENV=production 은 항상 fail-fast) 여기서도 더 이상 설정하지 않는다.
#   DB 연결 실패 = process exit 1 = TCP startup probe 미성공 = 새 revision 미승격 = 기존 revision 유지.
#
# Migration Architecture:
# - Uses TypeORM CLI with lightweight migration-config.js (NO entity imports)
# - Avoids bundling 60+ entities that cause tsup compilation failures
# - migration-config.ts → tsc → migration-config.js → TypeORM CLI
# - See: apps/api-server/src/database/migration-config.ts

concurrency:
  # 서비스 단위 1개 rollout — 진행 중 run 은 끝까지, 대기 run 은 더 새 것으로 대체 (WO-O4O-CICD-DEPLOY-FREEZE-CUTOVER-V1 §18)
  group: deploy-api-production
  cancel-in-progress: false

on:
  # WO-O4O-CICD-DEPLOY-FREEZE-CUTOVER-V1: push trigger 은퇴. 자동 배포는 `deploy-auto.yml`(main CI 성공 → 위험 판정 →
  #   LEVEL_2 만 이 workflow 를 `deploy/auto-<sha>` 태그 ref 로 dispatch) 이 유일한 진입점이다. 사람은 통제 배포(LEVEL_3 ·
  #   첫 rollout)만 이 workflow 를 직접 dispatch 한다. 게이트는 `DEPLOY_FREEZE` 하나 — 정확히 'false' 일 때만 배포.
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (판정과 무관하게 배포)'
        required: false
        default: 'false'
      # WO-O4O-API-CD-RUNTIME-AFFECTED-DEPLOY-GATE-V1 §15
      # workflow 를 고쳐 놓고 자기 자신을 검증할 수 없는 구조를 만들지 않는다.
      # base_sha/head_sha 를 주면 **과거 push 의 변경 집합으로 판정만 재현**하고
      # (force_deploy=true 가 아닌 한) production 배포는 하지 않는다.
      base_sha:
        description: '판정 재현용 base SHA (40자). 주면 배포 없이 판정만 재현한다'
        required: false
        default: ''
      head_sha:
        description: '판정 재현용 head SHA (40자)'
        required: false
        default: ''
      # WO-O4O-SERVICE-IDENTITY-AND-OPERATOR-SCOPE-V1 — 배포 2 전 경계 보정 (migration 만 실행하고 멈추는 경로)
      #
      #   이미지 push → migration Job 실행·성공 확인 → **여기서 끝**. API revision · traffic · one-off job 이미지는
      #   건드리지 않는다. 배포 게이트(`DEPLOY_FREEZE`)와 ci-gate 는 그대로 적용되고, 추가로 아래 세 조건을
      #   모두 요구한다(fail-closed):
      #     ① workflow_dispatch  ② ref = refs/tags/deploy/*  ③ expected_sha == 그 태그 커밋(40자)
      #   migration Job 은 방금 push 한 이미지의 **digest** 로 고정한다(같은 태그를 다른 빌드가 덮어써도 영향 없음).
      migrate_only:
        description: "'true' = 고정 태그 SHA 로 migration Job 만 실행하고 멈춘다 (API 배포 0 · DEPLOY_FREEZE 적용)"
        required: false
        default: 'false'
      expected_sha:
        description: 'migrate_only 전용 — 태그가 가리켜야 하는 커밋 SHA (40자). 다르면 실행하지 않는다'
        required: false
        default: ''
      # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4 — 선택형. 기본 legacy = 종전 동작 그대로.
      #   verified = 새 revision 을 traffic 0% 로 배포 → revision Ready 확인 → 전환 → LB /health/ready → 실패 시 이전 revision 복귀.
      #   API 는 ingress 가 LB 전용이라 tag URL HTTP smoke 가 불가하다 — control plane readiness 로 대신한다.
      rollout_mode:
        description: "'verified'(기본 · 0% 배포 → 검증 → 전환 → 실패 시 복귀) | 'legacy'(종전 — 새 revision 즉시 서빙/pin 유지)"
        required: false
        default: 'verified'
  # WO-O4O-CICD-UNIFIED-DELIVERY-PIPELINE-V1 — Unified Delivery(`delivery.yml` · `promote.yml`)의 자동 · 승인 진입점.
  #   태그 · dispatch 없이 호출된다. target SHA = 호출자의 `github.sha` — 호출자가 target == github.sha == main HEAD 를
  #   강제하므로 아래 build · migration · deploy · verify step 은 dispatch 경로와 **같은 줄**을 그대로 쓴다.
  #   migrate_only · expected_sha 는 수동(dispatch) 전용이라 여기서는 노출하지 않는다(호출 시 null → 일반 경로).
  workflow_call:
    inputs:
      rollout_mode:
        type: string
        required: false
        default: 'verified'
      force_deploy:
        type: string
        required: false
        default: 'false'
      base_sha:
        type: string
        required: false
        default: ''
      head_sha:
        type: string
        required: false
        default: ''
      dry_run:
        description: "'true' = 배선 검증 — detect 까지만 (ci-gate · build · migration · deploy 0)"
        type: string
        required: false
        default: 'false'

env:
  PROJECT_ID: netureyoutube
  REGION: asia-northeast3
  SERVICE_NAME: o4o-core-api
  REPOSITORY_NAME: o4o-api
  IMAGE_NAME: api-server
  # WO-O4O-CLOUD-RUN-INGRESS-LOAD-BALANCER-ONLY-V1:
  #   외부 진입점은 공식 LB 도메인 하나다. run.app 직접 URL 은 ingress 로 차단되므로
  #   외부 HTTP 검증은 반드시 이 주소를 쓴다.
  PUBLIC_API_URL: https://api.neture.co.kr

jobs:
  freeze-notice:
    # WO-O4O-CICD-DEPLOY-FREEZE-CUTOVER-V1 — DEPLOY_FREEZE 가 'false' 가 아니면(부재 · 공백 · true · 오타 포함 = fail-closed)
    #   이 job 만 돌고 배포 job 은 전부 skip 된다. GitHub 식의 문자열 비교는 대소문자를 구분하지 않는다.
    if: vars.DEPLOY_FREEZE != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Report deploy freeze
        run: |
          {
            echo "## 🧊 Production deploy frozen — DEPLOY_FREEZE != 'false'"
            echo ""
            echo "이 워크플로의 배포 job 은 실행되지 않았습니다 (build · migration · Cloud Run deploy 0)."
            echo ""
            echo "- DEPLOY_FREEZE = '${{ vars.DEPLOY_FREEZE }}'  (정확히 'false' 일 때만 배포 · 부재/공백/오타 = freeze)"
            echo "- 정상 운영값은 false. 비상 · 정비 시에만 true — README \"배포\" 절."
            echo "- commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOY_FREEZE_ACTIVE=1 (DEPLOY_FREEZE='${{ vars.DEPLOY_FREEZE }}')"

  # ===========================================================================
  # WO-O4O-API-CD-RUNTIME-AFFECTED-DEPLOY-GATE-V1
  #
  # 이 workflow 의 push trigger 는 `apps/api-server/**` · `packages/**` ·
  # `package.json` · `pnpm-lock.yaml` 전체다. 그래서 **production API runtime 이
  # 한 줄도 바뀌지 않는 변경**에서도 Docker build/push · Cloud Run migration Job ·
  # 새 revision · one-off job image 재고정이 전부 실행됐다.
  # (실측: 최근 성공 58회 중 17회 · 149.4분이 이 부류였다)
  #
  # trigger 자체를 좁히지 않는 이유(§12): workflow 가 아예 뜨지 않으면 판정 기록도
  # 상태 보고도 사라진다. 대신 **가벼운 detect 잡은 항상 돌고 heavy deploy 만
  # 조건부**로 둔다. 판정은 Admin·Docs 와 같은 SSOT(`scripts/ci/detect-affected.mjs`)다.
  #
  # 안전 방향은 한쪽뿐이다 — base SHA 이상 · force push · git diff 실패 ·
  # workspace graph 실패 · lockfile 비교 불가는 전부 `api_deploy_affected=true` 다.
  detect:
    name: Detect API deploy scope
    runs-on: ubuntu-latest
    outputs:
      api_deploy_affected: ${{ steps.scope.outputs.api_deploy_affected }}
      api_ci_affected: ${{ steps.scope.outputs.api_ci_affected }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
    - uses: actions/checkout@v6
      with:
        # push batch 전체(before..after)를 봐야 한다 — 마지막 commit 만 보면
        # 배치 앞쪽의 runtime 변경을 놓친다.
        fetch-depth: 0

    - name: Classify changed scope
      id: scope
      env:
        BASE_SHA: ${{ inputs.base_sha || github.event.before }}
        HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      run: node scripts/ci/detect-affected.mjs

    - name: Summary
      run: |
        {
          echo "### API 배포 영향 판정"
          echo ""
          echo "- \`api_deploy_affected\`: **${{ steps.scope.outputs.api_deploy_affected }}**"
          echo "- \`api_ci_affected\`: ${{ steps.scope.outputs.api_ci_affected }}"
          echo "- 사유: ${{ steps.scope.outputs.reason }}"
        } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 1 — CI success gate (enforced)
  #
  # 원칙 A: CI 가 green 이 아닌 commit 은 production 배포 대상이 될 수 없다.
  #   종전에는 배포 workflow 가 CI 결과를 기다리지 않았다 — 게이트가 열린 순간 CI 실패 commit 도 배포될 수 있었다.
  #   필수 CI = `CI Pipeline`(ci-pipeline.yml) 의 target SHA 최신 run. failure · cancelled · pending · 부재 · SHA 불일치 = 차단.
  #   push 직후에는 CI 가 아직 도는 중이므로 최대 30분 기다린다(그래도 pending 이면 차단).
  #   배포가 실제로 열릴 수 있을 때만 돈다 — 게이트가 닫힌 평상시에는 러너 시간을 쓰지 않는다.
  #   실패하면 이 job 이 red 가 되고 build-and-deploy 는 needs 로 skip 된다(= migration 0 · deploy 0).
  ci-gate:
    name: CI gate (target SHA must be green)
    needs: [detect]
    # dry_run(배선 검증 · workflow_call 전용) 이면 게이트를 열지 않는다 → build-and-deploy 도 needs 로 skip.
    # WO-O4O-PUBLIC-COLLABORATOR-PRODUCTION-BOUNDARY-AND-MAIN-PROTECTION-V1 — 수동 실행(직접 dispatch · promote 경유)은 저장소 소유자만.
    #   collaborator 가 dispatch 하면 게이트를 열지 않는다(→ 배포 job 전부 skip). 자동 경로(workflow_run)는 그대로.
    if: >-
      vars.DEPLOY_FREEZE == 'false' && inputs.dry_run != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.triggering_actor == github.repository_owner) &&
      (inputs.migrate_only == 'true' || needs.detect.outputs.api_deploy_affected == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: scripts/ci
    - uses: actions/setup-node@v4
      with:
        node-version: '22.18.0'
    - name: Require green CI for target SHA
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node scripts/ci/ci-gate.mjs --target "${{ github.sha }}" --wait-seconds 1800 --enforce

  build-and-deploy:
    runs-on: ubuntu-latest
    # `environment: production` — 배포 ref 경계다(WO-O4O-PUBLIC-COLLABORATOR-PRODUCTION-BOUNDARY-AND-MAIN-PROTECTION-V1).
    #   GitHub `production` Environment 는 배포 ref 를 `main` branch · `deploy/*` tag 로 제한하고, production credential 은
    #   environment secret 으로 둔다 — 그 밖의 ref(collaborator branch · PR)에서는 이 job 이 시작되지 않는다. required reviewer 는
    #   없다(대기 없이 실행). 배포 게이트는 그대로 이 job `if:` 의 `DEPLOY_FREEZE`(정확히 'false' 일 때만 · 부재/공백/오타 = freeze)
    #   와 ci-gate(수동 실행 = 소유자만)다.
    environment: production
    # ci-gate 가 skip(게이트 닫힘) 또는 실패(CI not green)면 이 job 도 skip 된다 (if 에 status 함수가 없으므로 암묵 success()).
    needs: [detect, ci-gate]
    # WO-O4O-API-CD-RUNTIME-AFFECTED-DEPLOY-GATE-V1 §11 · §13 · §15
    #
    #   1. `api_deploy_affected=false` → Docker build/push 0 · migration 0 ·
    #      Cloud Run revision 0 · one-off job image 갱신 0. 이 잡 전체가 skip 된다.
    #   2. `base_sha` 를 준 수동 실행은 **판정 재현 전용**이다 — force_deploy 없이는
    #      production 을 건드리지 않는다. (base_sha 없는 기존 수동 실행 동작은 그대로)
    # WO-O4O-LECTURE-INDEPENDENT-SERVICE-SEPARATION-V1 §19 (2026-09-23 INCIDENT)
    #
    #   DEPLOY GATE (fail-closed): 저장소 변수 `DEPLOY_FREEZE` 가 정확히 'false' 일 때만 배포한다.
    #   변수가 없거나 비어 있으면 Actions 가 빈 문자열을 돌려주므로 **freeze 가 기본값**이다.
    #   이 조건은 Docker build/push · migration Job 실행 · Cloud Run deploy 를 모두 포함하는
    #   이 잡 **전체**에 걸린다 — 보류 중에는 migration 도 실행되지 않는다.
    #   비상 정지는 코드 변경 없이 `gh variable set DEPLOY_FREEZE --body true` 로 한다 (정상 운영값 false).
    #
    #   MIGRATE-ONLY (WO-O4O-SERVICE-IDENTITY-AND-OPERATOR-SCOPE-V1): 두 번째 분기. detect 와 무관하게(freeze 는 적용)
    #   이 잡을 열되, 첫 step 이 태그 ref · SHA 일치를 검사하고 "Deploy to Cloud Run" 이후 step 은 전부 skip 한다.
    #   일반 경로(첫 분기)는 migrate_only 가 'true' 가 아닐 때만 — push 이벤트에서는 inputs 가 없어 항상 성립.
    if: >-
      vars.DEPLOY_FREEZE == 'false' &&
      ((github.event_name == 'workflow_dispatch' && inputs.migrate_only == 'true') ||
       (needs.detect.outputs.api_deploy_affected == 'true' &&
        inputs.migrate_only != 'true' &&
        (github.event_name != 'workflow_dispatch' ||
         inputs.base_sha == '' ||
         inputs.force_deploy == 'true')))

    permissions:
      contents: read
      id-token: write  # 현재 GCP 인증은 WIF 가 아니라 credentials_json(secrets.GCP_SA_KEY) — 이 권한을 요구하지 않는다

    steps:
    - name: Migrate-only preflight (tag ref · SHA 고정 검사)
      if: inputs.migrate_only == 'true'
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: |
        set -euo pipefail
        echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} expected=${EXPECTED_SHA}"
        case "${GITHUB_REF}" in
          refs/tags/deploy/*) ;;
          *) echo "❌ migrate_only 는 refs/tags/deploy/* 태그 ref 에서만 실행한다 (현재 ${GITHUB_REF})"; exit 1 ;;
        esac
        if ! printf '%s' "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "❌ expected_sha 는 40자 소문자 hex 여야 한다"; exit 1
        fi
        if [ "${EXPECTED_SHA}" != "${GITHUB_SHA}" ]; then
          echo "❌ 태그 커밋(${GITHUB_SHA}) ≠ expected_sha(${EXPECTED_SHA}) — 태그가 옮겨졌거나 다른 ref 다. 실행하지 않는다"; exit 1
        fi
        {
          echo "## 🧭 MIGRATE-ONLY — migration Job 만 실행하고 멈춘다"
          echo ""
          echo "- ref: \`${GITHUB_REF}\`"
          echo "- SHA: \`${GITHUB_SHA}\` (expected 일치)"
          echo "- API revision · traffic · one-off job 이미지: **변경 없음**"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # WO-O4O-DEPLOY-JOB-BOOTSTRAP-SLIMMING-V1: 운영 데이터 매니페스트
        # (apps/api-server/src/scripts/data, ≈1.25GB)는 tsc(tsconfig.build 가 src/scripts 제외) ·
        # tsup(entry 9개) · Docker 이미지 어디에도 쓰이지 않는다. sparse 지정 시 blob:none 부분 fetch.
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    # WO-O4O-CI-DEPLOY-API-SETUP-BUILD-ENV-ALIGN-V1:
    # 4-step pnpm/node/install/build:packages 흐름을 다른 workflow와 동일한
    # composite action으로 통일. unpinned pnpm + frozen-lockfile 단독 사용으로
    # CI를 차단하던 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH 회피.
    # WO-O4O-DEPLOY-API-PACKAGE-BUILD-SCOPE-V1
    # 과거에는 여기서 root `build:packages` 전체(프론트 패키지 포함, ≈100s)를 빌드한 뒤
    # 아래 step 이 하드코딩 목록 18개를 **다시** 빌드했다. 그 18개는 전부
    # `build:packages` 마지막의 `build:api-deps`(= `@o4o/api-server^...`)에 이미 포함돼 있었다.
    # 배포 이미지에 필요한 것은 api-server 의 workspace dependency closure 뿐이므로
    # 여기서는 설치만 하고, 아래 step 이 closure 만 한 번 빌드한다
    # (CI api-tests · scheduled full Jest 와 같은 방식).
    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: '22.18.0'
        build-packages: 'false'

    # closure 는 package.json 의 workspace 의존성 그래프에서 나온다 — 목록 하드코딩 금지(drift).
    # api-server 런타임 코드(테스트 제외)가 import 하는 @o4o 패키지는 전부 package.json 에 선언돼 있다.
    # --fail-if-no-match: filter 가 아무것도 고르지 못하면 조용히 통과하지 않고 실패한다.
    - name: Build API-specific packages
      run: |
        echo "🔨 Building @o4o/api-server workspace dependency closure..."
        pnpm --fail-if-no-match --filter '@o4o/api-server^...' run build
        echo "✅ API dependency closure built successfully"

    - name: Build API server (bundled with tsup)
      run: |
        cd apps/api-server

        # ============================================================
        # Build Strategy:
        # 1. First build with tsc (compiles migrations with decorators)
        # 2. Backup migrations folder
        # 3. Build with tsup (creates bundled main.js, may clean dist)
        # 4. Restore migrations from backup
        # ============================================================

        # Step 1: Build everything with tsc first (handles decorators properly)
        echo "🔨 Step 1: Building with tsc (includes migrations)..."
        pnpm run build

        # Step 2: Backup database folder before tsup cleans dist
        # Backup: migrations/*.js + migration-config.js (all compiled by tsc)
        echo "📦 Step 2: Backing up database folder (migrations + migration-config)..."
        mkdir -p /tmp/database-backup/migrations

        # Backup migration-config.js (required for TypeORM CLI)
        if [ -f "dist/database/migration-config.js" ]; then
          cp dist/database/migration-config.js /tmp/database-backup/
          cp dist/database/migration-config.js.map /tmp/database-backup/ 2>/dev/null || true
          echo "✅ migration-config.js backed up"
        else
          echo "⚠️ WARNING: migration-config.js not found!"
        fi

        # Backup migration files
        if [ -d "dist/database/migrations" ]; then
          cp -r dist/database/migrations/* /tmp/database-backup/migrations/ 2>/dev/null || true
          MIGRATION_COUNT=$(ls /tmp/database-backup/migrations/*.js 2>/dev/null | wc -l)
          echo "✅ Migrations backed up: ${MIGRATION_COUNT} files"
        else
          echo "⚠️ No migrations folder found"
        fi

        # Step 3: Build with tsup (creates bundled main.js)
        echo "🔨 Step 3: Building API server with tsup (bundled build)..."
        pnpm run build:api

        # Step 4: Restore database folder (migrations + migration-config)
        echo "📦 Step 4: Restoring database folder..."

        # Create database folder structure
        mkdir -p dist/database/migrations

        # Restore migration-config.js
        if [ -f "/tmp/database-backup/migration-config.js" ]; then
          cp /tmp/database-backup/migration-config.js dist/database/
          cp /tmp/database-backup/migration-config.js.map dist/database/ 2>/dev/null || true
          echo "✅ migration-config.js restored"
        else
          echo "❌ ERROR: migration-config.js not in backup!"
          exit 1
        fi

        # Restore migration files
        if [ -d "/tmp/database-backup/migrations" ]; then
          cp -r /tmp/database-backup/migrations/* dist/database/migrations/ 2>/dev/null || true
          RESTORED_COUNT=$(ls dist/database/migrations/*.js 2>/dev/null | wc -l)
          echo "✅ Migrations restored: ${RESTORED_COUNT} files"
        fi

        # List database folder contents
        echo "📋 dist/database/ contents:"
        ls -la dist/database/
        echo "📋 dist/database/migrations/ (first 10):"
        ls dist/database/migrations/*.js 2>/dev/null | head -10

        # Verify build output
        if [ ! -f "dist/main.js" ]; then
          echo "❌ Build failed: dist/main.js not found"
          exit 1
        fi

        if [ ! -f "dist/migrate.js" ]; then
          echo "❌ Build failed: dist/migrate.js not found"
          exit 1
        fi

        echo "✅ API server build complete"

        # Final verification
        echo "📋 Final verification:"
        echo "  - main.js (Service entry): $(du -h dist/main.js | cut -f1)"
        echo "  - migrate.js (Job entry): $(du -h dist/migrate.js | cut -f1)"
        echo "  - migration-config.js: $(du -h dist/database/migration-config.js | cut -f1)"
        FINAL_MIGRATION_COUNT=$(ls dist/database/migrations/*.js 2>/dev/null | wc -l)
        echo "  - migrations: ${FINAL_MIGRATION_COUNT} files"

        # Verify all required files exist
        if [ ! -f "dist/database/migration-config.js" ]; then
          echo "❌ ERROR: migration-config.js missing!"
          exit 1
        fi

        if [ "$FINAL_MIGRATION_COUNT" -eq 0 ]; then
          echo "❌ ERROR: No migration files in final build!"
          exit 1
        fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        # runner 에 설치된 gcloud 를 쓴다 (매 job ≈20s SDK 다운로드 생략)
        skip_install: true

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker image
      run: |
        cd apps/api-server

        # Verify tsup bundles exist (main.js for Service, migrate.js for Job)
        echo "📂 Checking bundled output:"
        ls -la dist/main.js dist/main.js.map || (echo "❌ main.js bundle not found!" && exit 1)
        ls -la dist/migrate.js dist/migrate.js.map || (echo "❌ migrate.js bundle not found!" && exit 1)
        echo "📦 main.js (Service): $(du -h dist/main.js | cut -f1)"
        echo "📦 migrate.js (Job): $(du -h dist/migrate.js | cut -f1)"

        # Copy mail-core email templates into build context so Dockerfile can include them
        echo "📧 Copying email templates into Docker build context..."
        cp -r ../../packages/mail-core/templates/email ./mail-templates
        echo "Templates: $(ls mail-templates | wc -l) files"

        IMAGE_TAG="${{ github.sha }}"
        FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
        LATEST_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:latest"
        CACHE_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:buildcache"

        # WO-O4O-API-DOCKER-BUILD-CACHE-AND-OWNERSHIP-V1
        #
        # GitHub-hosted runner 는 매번 빈 Docker 로 시작하므로 과거 `--no-cache` 는 실효가 없었고,
        # 매 배포가 production npm install(≈32s)과 node_modules 레이어 push 를 반복했다.
        # 여기서는 Artifact Registry 의 `:buildcache` 를 레이어 캐시로 쓴다.
        #
        # stale dist 재발 방지(9ef911fde 의 원 사고)는 그대로 유지된다:
        #   - Dockerfile 의 `RUN echo ${CACHEBUST}` 가 매 빌드 다른 값이라 그 뒤의 모든
        #     dist/assets/templates COPY 레이어는 캐시에서 재사용될 수 없다.
        #   - 캐시가 재사용할 수 있는 것은 CACHEBUST 앞(base image · npm install · node_modules)뿐이며
        #     그 키는 package.production.json 내용이다.
        # 캐시 ref 가 없거나 읽기 실패면 buildx 는 경고 후 캐시 없이 빌드한다(배포 실패 아님).
        echo "🐳 Building and pushing Docker image (buildx + registry cache)..."
        # migrate_only 실행은 배포되지 않는 빌드다 — `:latest` 를 옮기지 않는다.
        TAG_ARGS=(--tag "${FULL_IMAGE}")
        if [ "${{ inputs.migrate_only }}" != "true" ]; then
          TAG_ARGS+=(--tag "${LATEST_IMAGE}")
        fi
        docker buildx create --name o4o-api-builder --driver docker-container --use
        docker buildx build \
          --build-arg CACHEBUST=$(date +%s) \
          --platform linux/amd64 \
          --cache-from "type=registry,ref=${CACHE_IMAGE}" \
          --cache-to "type=registry,ref=${CACHE_IMAGE},mode=max,image-manifest=true,oci-mediatypes=true" \
          "${TAG_ARGS[@]}" \
          --file Dockerfile \
          --push \
          .

        # Verify the pushed image exists in Artifact Registry.
        # 이미지 내용(dist/main.js · migrate.js · migrations · ownership)은 Dockerfile 의 RUN 검사가
        # 빌드 단계에서 실패로 강제한다.
        echo "🔍 Verifying pushed image..."
        docker buildx imagetools inspect "${FULL_IMAGE}"

        # 방금 push 한 manifest digest — 같은 태그를 나중 빌드가 덮어써도 이 빌드를 가리킨다.
        IMAGE_DIGEST=$(docker buildx imagetools inspect "${FULL_IMAGE}" --format '{{json .Manifest}}' | jq -r '.digest')
        echo "📌 Image digest: ${IMAGE_DIGEST}"
        echo "- image: \`${FULL_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- digest: \`${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

        echo "✅ Image pushed: ${FULL_IMAGE}"
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
        echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> $GITHUB_ENV

    # ============================================================
    # WO-O4O-DATABASE-MIGRATION-OWNERSHIP-STARTUP-HEALTH-AND-LEGACY-DEPLOY-TOOLING-FINAL-CLOSURE-V1
    #
    # 운영 migration 의 단일 소유자 = 이 step 의 Cloud Run Job `o4o-api-migrations`.
    #
    # 순서 계약 (이 step 은 반드시 "Deploy to Cloud Run" **앞**에 있어야 한다):
    #   이미지 push → **migration job 실행·성공 확인** → API revision 배포·트래픽 전환
    #
    # 왜: 종전에는 deploy 가 먼저 실행돼 새 revision 이 migration 전에 트래픽을 받았고,
    #     job 이 실패해도 새 revision 은 이미 serving 중이었다. 그래서 API startup 이
    #     스스로 migration 을 돌리며 실패를 삼키는 우회 경로가 생겼다
    #     (30일 로그: 서비스 인스턴스가 17회 스키마 변경 · 실패 삼킴 3회 · Seed 직접 실행 45회).
    #     그 startup 경로는 제거했다(startup.service.ts). 이제 job 실패 = workflow 중단 =
    #     기존 serving revision 유지 이며, `continue-on-error` · `|| true` 를 두지 않는다.
    #
    # 같은 IMAGE_TAG 를 쓴다 — "Build and Push Docker image" 가 이미 push 했다.
    # ============================================================
    - name: Run database migrations
      run: |
        echo "🔄 Running database migrations..."

        FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
        # migrate_only: 태그가 아니라 방금 push 한 digest 로 Job 을 고정한다.
        if [ "${{ inputs.migrate_only }}" = "true" ]; then
          FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}@${{ env.IMAGE_DIGEST }}"
        fi
        echo "migration image: ${FULL_IMAGE}"

        # ============================================================
        # Migration Strategy: Use dedicated migrate.js entry point
        # ============================================================
        # - migrate.js is a standalone CLI that runs migrations and exits
        # - NO Express server, NO health endpoints, NO PORT listening
        # - Exit 0 on success, Exit 1 on failure
        # - This ensures Cloud Run Job terminates properly
        # ============================================================

        # Create or update the migration job with node migrate.js command
        # Use ^::^ delimiter syntax to avoid issues with special characters in passwords
        # This is more reliable than multiple --set-env-vars flags
        gcloud run jobs create o4o-api-migrations \
          --image="${FULL_IMAGE}" \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --task-timeout=300 \
          --max-retries=1 \
          --set-env-vars="^::^NODE_ENV=production::DB_HOST=/cloudsql/netureyoutube:asia-northeast3:o4o-platform-db::DB_PORT=5432::DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}::DB_NAME=${{ secrets.GCP_DB_NAME }}" \
          --set-secrets="DB_PASSWORD=o4o-db-password:latest" \
          --set-cloudsql-instances=netureyoutube:asia-northeast3:o4o-platform-db \
          --command="node" \
          --args="dist/migrate.js" \
          2>/dev/null || \
        gcloud run jobs update o4o-api-migrations \
          --image="${FULL_IMAGE}" \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --task-timeout=300 \
          --max-retries=1 \
          --set-env-vars="^::^NODE_ENV=production::DB_HOST=/cloudsql/netureyoutube:asia-northeast3:o4o-platform-db::DB_PORT=5432::DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}::DB_NAME=${{ secrets.GCP_DB_NAME }}" \
          --set-secrets="DB_PASSWORD=o4o-db-password:latest" \
          --set-cloudsql-instances=netureyoutube:asia-northeast3:o4o-platform-db \
          --command="node" \
          --args="dist/migrate.js"

        # Execute the migration job
        echo "🚀 Executing migration job..."
        gcloud run jobs execute o4o-api-migrations \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --wait

        echo "✅ Migrations completed successfully"

    # migrate_only 의 끝 — 운영 API 가 그대로인지 기록만 한다 (쓰기 없음).
    - name: Migrate-only stop (API traffic 불변 기록)
      if: inputs.migrate_only == 'true'
      run: |
        set -euo pipefail
        TRAFFIC=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} \
          --format="value(status.traffic)")
        EXEC=$(gcloud run jobs executions list --job o4o-api-migrations \
          --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --limit 1 \
          --format="value(metadata.name,status.succeededCount)")
        {
          echo ""
          echo "### ⏸ migration 후 정지"
          echo "- migration execution: \`${EXEC}\`"
          echo "- API traffic (변경 없음): \`${TRAFFIC}\`"
          echo "- 다음: 공식 CLI dry-run → 사용자 판단 → \`--apply\` · API 전환"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "migration execution: ${EXEC}"
        echo "API traffic: ${TRAFFIC}"

    # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 §22 — 정의되지 않은 optional env 를 빈 값으로 덮지 않는다.
    #   종전: `AI_DEFAULT_PROVIDER=${{ vars.AI_DEFAULT_PROVIDER }}` 등 4개가 저장소에 없어 매 배포마다 빈 값으로 설정됐다.
    #   이제: 값 있음 → 설정 · 없음 + 현재 Cloud Run 값 있음 → 유지 · 둘 다 없음 → 생략. 값을 만들거나 추측하지 않는다.
    #   (코드는 네 값 모두 `|| 기본값` / `?.trim()` 으로 읽는다 — 빈 값과 부재가 같은 동작이다.)
    - name: Resolve optional env (no empty overwrite)
      if: inputs.migrate_only != 'true'
      env:
        OPTENV_AI_DEFAULT_PROVIDER: ${{ vars.AI_DEFAULT_PROVIDER }}
        OPTENV_AI_DEFAULT_MODEL_OPENAI: ${{ vars.AI_DEFAULT_MODEL_OPENAI }}
        OPTENV_TOSS_PAYMENTS_CLIENT_KEY: ${{ secrets.TOSS_PAYMENTS_CLIENT_KEY }}
        OPTENV_TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
      run: |
        node scripts/ci/cloud-run-env.mjs optional \
          --service ${{ env.SERVICE_NAME }} \
          --names AI_DEFAULT_PROVIDER,AI_DEFAULT_MODEL_OPENAI,TOSS_PAYMENTS_CLIENT_KEY,TOSS_PAYMENTS_SECRET_KEY \
          --out "$RUNNER_TEMP/optional-env"

    # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4 — verified 모드에서만. 배포 전 traffic(pin/latest · 이전 revision)을 기록한다.
    - name: Record traffic before deploy (verified rollout)
      if: inputs.migrate_only != 'true' && inputs.rollout_mode == 'verified'
      run: node scripts/ci/cloud-run-rollout.mjs plan --service ${{ env.SERVICE_NAME }} --out "$RUNNER_TEMP/rollout-plan.json"

    - name: Deploy to Cloud Run
      if: inputs.migrate_only != 'true'
      run: |
        FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        # optional env — 앞 step 이 NUL 구분 flag 목록을 만든다(생략된 이름은 목록에 없다).
        OPTIONAL_ENV=()
        if [ -s "$RUNNER_TEMP/optional-env" ]; then mapfile -d '' OPTIONAL_ENV < "$RUNNER_TEMP/optional-env"; fi

        # verified 모드: 새 revision 은 traffic 0% · 전용 tag 주소. 전환은 검증 뒤 별도 step 이 한다.
        ROLLOUT_ARGS=()
        if [ "${{ inputs.rollout_mode }}" = "verified" ]; then
          ROLLOUT_ARGS=(--no-traffic "--tag=sha-${GITHUB_SHA:0:12}")
        fi

        echo "🚀 Deploying to Cloud Run... (rollout_mode=${{ inputs.rollout_mode || 'legacy' }})"

        # ============================================================
        # WO-O4O-API-DATABASE-READINESS-AND-COLD-START-TRAFFIC-GATE-FINAL-CLOSURE-V1
        #   옛 주석("GRACEFUL_STARTUP=true: Server starts immediately, DB connects async")은 더 이상
        #   사실이 아니다. 서버는 DB 연결 후에만 listen 하며, Cloud SQL 소켓이 늦게 뜨는 경우는
        #   앱의 DB 연결 예산(5회 × 15s + 백오프, 최대 약 105s < startup probe 240s)이 흡수한다.
        #   GRACEFUL_STARTUP 은 프로덕션에서 무시되므로 env 에서 제거했다(dead configuration).
        # ============================================================
        # WO-O4O-PRIVACY-DATA-RETENTION-ENFORCEMENT-V1 (Phase 2, 사용자 승인 2026-09-17)
        #   PRIVACY_RETENTION_MODE=apply : 개인정보 보유기간 집행 job(jobs/privacy-retention.job)의 실삭제 모드.
        #   기간의 정본은 docs/baseline/O4O-PRIVACY-DATA-RETENTION-POLICY-V1.md — 여기서는 mode 만 정한다.
        #   kill-switch 는 코드 기본 계약(PRIVACY_RETENTION_ENABLED='false' 일 때만 skip) 그대로이며 여기 추가하지 않는다.
        # ============================================================

        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image="${FULL_IMAGE}" \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --platform=managed \
          --allow-unauthenticated \
          --ingress=internal-and-cloud-load-balancing \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --concurrency=80 \
          --timeout=300 \
          --set-env-vars="NODE_ENV=production" \
          --set-env-vars="EMAIL_SERVICE_ENABLED=true" \
          --set-env-vars="SMTP_HOST=smtp.gmail.com" \
          --set-env-vars="SMTP_PORT=587" \
          --set-env-vars="SMTP_SECURE=false" \
          --set-env-vars="SMTP_USER=${{ secrets.SMTP_USER }}" \
          --set-env-vars="SMTP_PASS=${{ secrets.SMTP_PASS }}" \
          --set-env-vars="EMAIL_FROM_NAME=O4O Platform" \
          --set-env-vars="COOKIE_DOMAIN=.neture.co.kr" \
          --set-env-vars="DB_HOST=/cloudsql/netureyoutube:asia-northeast3:o4o-platform-db" \
          --set-env-vars="DB_PORT=5432" \
          --set-env-vars="DB_USERNAME=${{ secrets.GCP_DB_USERNAME }}" \
          --update-secrets="DB_PASSWORD=o4o-db-password:latest" \
          --set-env-vars="DB_NAME=${{ secrets.GCP_DB_NAME }}" \
          --set-env-vars="JWT_SECRET=${{ secrets.GCP_JWT_SECRET }}" \
          --set-env-vars="JWT_REFRESH_SECRET=${{ secrets.GCP_JWT_SECRET }}" \
          --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
          --set-env-vars="OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
          --set-env-vars="CAFE24_REDIRECT_URI=https://api.neture.co.kr/api/v1/admin/cafe24/callback" \
          --set-env-vars="PRIVACY_RETENTION_MODE=apply" \
          --set-env-vars="GOOGLE_ALLOWED_CLIENT_IDS=${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
          --set-env-vars="GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
          "${OPTIONAL_ENV[@]}" \
          "${ROLLOUT_ARGS[@]}" \
          --update-labels="o4o-commit-sha=${{ github.sha }}" \
          --clear-vpc-connector \
          --add-cloudsql-instances=netureyoutube:asia-northeast3:o4o-platform-db

    # legacy 모드 전용. verified 모드는 아래 세 step 이 새 revision 을 직접 확인한 뒤 전환하고 전환 후 검사한다.
    # (pin 서비스에서 이 step 은 트래픽을 받는 **옛** revision 을 본다 — CHECK-O4O-CICD-PRODUCTION-DEPLOY-CENSUS §A-7)
    - name: Verify deployment
      if: inputs.migrate_only != 'true' && inputs.rollout_mode != 'verified'
      run: |
        echo "🔍 Verifying deployment..."

        # ============================================================
        # WO-O4O-CLOUD-RUN-INGRESS-LOAD-BALANCER-ONLY-V1
        #
        # ingress=internal-and-cloud-load-balancing 적용 후 run.app 직접 URL 은
        # 외부(GitHub Actions 러너 포함)에서 접근할 수 없다. 그래서 두 축을 분리한다:
        #   1) revision readiness → control plane (gcloud describe)
        #   2) 외부 API health    → 공식 LB 도메인 (PUBLIC_API_URL)
        # 직접 URL 의 HTTP 성공을 readiness 기준으로 삼지 않는다.
        # ============================================================

        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --format="value(status.url)")

        INGRESS=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --format="value(metadata.annotations['run.googleapis.com/ingress'])")

        echo "🌐 Cloud Run URL (LB-only): ${SERVICE_URL}"
        echo "🚪 Ingress: ${INGRESS}"

        if [ "${INGRESS}" != "internal-and-cloud-load-balancing" ]; then
          echo "❌ Unexpected ingress: ${INGRESS}"
          exit 1
        fi

        # Readiness check via the official load balancer domain
        #   WO-O4O-API-DATABASE-READINESS-AND-COLD-START-TRAFFIC-GATE-FINAL-CLOSURE-V1:
        #   /health 는 liveness(프로세스 생존, 항상 200)라 배포 성공의 근거가 못 된다.
        #   /health/ready 는 서버 상태가 READY 이고 DB `SELECT 1` 이 통과할 때만 200, 아니면 503 이다.
        #   재시도는 5회 × 10s 로 상한이 있고, 최종 실패는 exit 1 로 정확히 반환한다 (continue-on-error · || true 없음).
        for i in {1..5}; do
          echo "Readiness check attempt $i (${{ env.PUBLIC_API_URL }}/health/ready)..."
          if curl -sf "${{ env.PUBLIC_API_URL }}/health/ready" > /dev/null; then
            echo "✅ Readiness check passed (READY + DB SELECT 1)"
            break
          fi
          if [ $i -eq 5 ]; then
            echo "❌ Readiness check failed after 5 attempts"
            exit 1
          fi
          sleep 10
        done

        echo ""
        echo "=========================================="
        echo "✅ API Server Deployed Successfully!"
        echo "=========================================="
        echo "🌐 Public URL: ${{ env.PUBLIC_API_URL }}"
        echo "🏥 Readiness: ${{ env.PUBLIC_API_URL }}/health/ready"
        echo "🔒 Cloud Run URL (LB-only): ${SERVICE_URL}"
        echo "📅 Time: $(date)"
        echo "📝 Commit: ${{ github.sha }}"

    # =========================================================================
    # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 Phase 4 — verified rollout (dispatch 입력 rollout_mode=verified 에서만)
    #
    #   1) 새 revision 은 traffic 0% (Deploy step 의 --no-traffic --tag)
    #   2) 새 revision 의 Ready 조건 확인 — API 는 ingress=internal-and-cloud-load-balancing 이라 tag URL 에 러너가 닿지 못한다.
    #      Ready = startup probe 통과 = DB 연결 후 listen (API fail-fast 계약). 실패 → 전환하지 않음 = 옛 revision 유지.
    #   3) 전환 — 배포 전 방식 보존 (pin → 새 revision pin · latest 추종 → --to-latest)
    #   4) 전환 후 LB /health/ready (READY + DB SELECT 1) — 실패 시 기록된 이전 revision 으로 traffic 복귀 후 job 실패.
    #   DB migration 은 되돌리지 않는다 (LEVEL 3 runbook 대상).
    # =========================================================================
    - name: Smoke new revision before traffic (verified · readiness)
      if: inputs.migrate_only != 'true' && inputs.rollout_mode == 'verified'
      run: node scripts/ci/cloud-run-rollout.mjs smoke --service ${{ env.SERVICE_NAME }} --tag "sha-${GITHUB_SHA:0:12}" --mode readiness

    - name: Switch traffic to verified revision
      if: inputs.migrate_only != 'true' && inputs.rollout_mode == 'verified'
      run: node scripts/ci/cloud-run-rollout.mjs switch --service ${{ env.SERVICE_NAME }} --tag "sha-${GITHUB_SHA:0:12}" --plan "$RUNNER_TEMP/rollout-plan.json"

    - name: Verify after switch (rollback on failure)
      if: inputs.migrate_only != 'true' && inputs.rollout_mode == 'verified'
      run: node scripts/ci/cloud-run-rollout.mjs verify --service ${{ env.SERVICE_NAME }} --url "${{ env.PUBLIC_API_URL }}/health/ready" --plan "$RUNNER_TEMP/rollout-plan.json" --attempts 5
