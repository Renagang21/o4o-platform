name: E2E — Auth Runtime Regression

# Credential-free checks for maintained user origins and Google-only 전체관리자.
# Manual dispatch only. No operator/admin password credentials or fake authenticated sessions.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 사유 (예: auth 배포 후 검증, 회귀 확인)'
        required: false
        default: '수동 검증'

concurrency:
  group: e2e-auth-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

jobs:
  e2e-auth-runtime:
    name: Auth Runtime E2E (PC/mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          # package.json volta.pnpm 과 일치시킨다
          version: '10.25.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      # Guard against reintroducing legacy operator/admin password fixtures.
      - name: Verify no password credential is consumed
        run: |
          if grep -RInE 'E2E_[A-Z]+_ADMIN_(EMAIL|PASSWORD)' e2e/auth-runtime; then
            echo "::error::E2E 스위트가 관리자 비밀번호 자격증명을 다시 소비한다"
            exit 1
          fi
          echo "✅ 관리자 비밀번호 자격증명 소비 0"

      - name: Run Auth Runtime E2E (credential-free)
        env:
          CI: 'true'
        run: pnpm exec playwright test --config=e2e/auth-runtime/playwright.config.ts

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth-runtime-${{ github.run_id }}
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
