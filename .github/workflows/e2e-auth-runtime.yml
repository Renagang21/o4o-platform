name: E2E — Auth Runtime Regression

# 3개 배포 서비스(Neture / KPA-Society / K-Cosmetics) auth runtime 검증
# 실제 운영 URL을 대상으로 하므로 과도한 자동 실행 방지:
#   - workflow_dispatch: 유일한 실행 경로 (배포 후 수동 검증)
#
# WO-O4O-GOOGLE-IDENTITY-OPERATOR-EXPLICIT-LINK-V1 (2026-09-19, 사용자 승인):
#   push 자동 트리거를 임시 제거했다. legacy password E2E 계정이 WO-2C reset 으로 사라진 뒤
#   stale E2E_*_ADMIN_* secret 으로 3서비스 반복 로그인 → 운영자 계정 loginAttempts 누적 → 30분 잠금이
#   auth 패키지 push 마다 재발했기 때문이다(09-17~18, 10회). secret 은 삭제하지 않는다.
#   Google-only 인증 기준 E2E 재정의는 WO-2F 에서 수행하며, 그때까지 수동 실행만 허용한다.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 사유 (예: auth 배포 후 검증, 회귀 확인)'
        required: false
        default: '수동 검증'

concurrency:
  group: e2e-auth-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

jobs:
  e2e-auth-runtime:
    name: Auth Runtime E2E (3 Services)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # package.json volta.pnpm 과 일치시킨다
          version: '10.25.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # WO-O4O-KPA-AUTH-RUNTIME-E2E-LOGIN-REGRESSION-ROOT-CAUSE-AND-CI-CLOSURE-V1
      #
      # 공용 E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD 계약은 폐기했다.
      # 실제 인증은 서비스별 L2 `service_credentials`(serviceKey 단위)로 판정되므로,
      # 한 서비스의 비밀번호만 바뀌어도 공용 secret 하나로는 CI 전체가 깨지고
      # 그 장애가 "코드 회귀"처럼 보인다 (2026-08-21 KPA 사례).
      #
      # 또한 미설정을 warning + skip 으로 흡수하지 않는다. 자격증명이 없으면
      # 이 workflow 는 아무것도 검증하지 못하므로 초록불을 만들면 안 된다.
      - name: Validate E2E credentials (per service)
        run: |
          MISSING=""
          check() {
            if [ -z "$2" ]; then MISSING="$MISSING $1"; fi
          }
          check E2E_KPA_ADMIN_EMAIL      "${{ secrets.E2E_KPA_ADMIN_EMAIL }}"
          check E2E_KPA_ADMIN_PASSWORD   "${{ secrets.E2E_KPA_ADMIN_PASSWORD }}"
          check E2E_KCOS_ADMIN_EMAIL     "${{ secrets.E2E_KCOS_ADMIN_EMAIL }}"
          check E2E_KCOS_ADMIN_PASSWORD  "${{ secrets.E2E_KCOS_ADMIN_PASSWORD }}"
          check E2E_NETURE_ADMIN_EMAIL   "${{ secrets.E2E_NETURE_ADMIN_EMAIL }}"
          check E2E_NETURE_ADMIN_PASSWORD "${{ secrets.E2E_NETURE_ADMIN_PASSWORD }}"

          if [ -n "$MISSING" ]; then
            echo "::error::서비스별 E2E Secret 미설정:$MISSING"
            echo ""
            echo "설정 위치: GitHub repo → Settings → Secrets and variables → Actions"
            echo "계약: serviceKey 별로 계정·비밀번호를 분리한다 (가능하면 E2E 전용 계정)."
            echo "  kpa-society  → E2E_KPA_ADMIN_EMAIL    / E2E_KPA_ADMIN_PASSWORD"
            echo "  k-cosmetics  → E2E_KCOS_ADMIN_EMAIL   / E2E_KCOS_ADMIN_PASSWORD"
            echo "  neture       → E2E_NETURE_ADMIN_EMAIL / E2E_NETURE_ADMIN_PASSWORD"
            exit 1
          fi
          echo "✅ 3개 서비스 credential 모두 설정됨"

      - name: Run Auth Runtime E2E
        env:
          E2E_KPA_ADMIN_EMAIL: ${{ secrets.E2E_KPA_ADMIN_EMAIL }}
          E2E_KPA_ADMIN_PASSWORD: ${{ secrets.E2E_KPA_ADMIN_PASSWORD }}
          E2E_KCOS_ADMIN_EMAIL: ${{ secrets.E2E_KCOS_ADMIN_EMAIL }}
          E2E_KCOS_ADMIN_PASSWORD: ${{ secrets.E2E_KCOS_ADMIN_PASSWORD }}
          E2E_NETURE_ADMIN_EMAIL: ${{ secrets.E2E_NETURE_ADMIN_EMAIL }}
          E2E_NETURE_ADMIN_PASSWORD: ${{ secrets.E2E_NETURE_ADMIN_PASSWORD }}
          CI: 'true'
        run: npx playwright test --config=e2e/auth-runtime/playwright.config.ts

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth-runtime-${{ github.run_id }}
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
