name: Deploy cooperative test service
run-name: Cooperative test ${{ inputs.sha }} (apply=${{ inputs.apply }}, frontend_only=${{ inputs.frontend_only }})
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "검증된 main HEAD SHA (API migration·배포가 먼저 완료되어야 함)"
        required: true
      operator_email:
        description: "사용자가 지정한 기존 운영자 계정 (frontend_only 이면 비워도 됨)"
        required: false
        default: ""
      member_email:
        description: "사용자가 지정한 기존 개인 조합원 계정 (frontend_only 이면 비워도 됨)"
        required: false
        default: ""
      apply:
        description: "false = 계정·연결 사전 점검만 / true = 테스트 조합 등록·앱 배포"
        type: boolean
        default: false
      frontend_only:
        description: "true = 조합 등록 점검·등록 없이 앱만 배포 (조합 데이터 변경 0)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: cooperative-production
  cancel-in-progress: false
env:
  PROJECT_ID: netureyoutube
  REGION: asia-northeast3
  RUNTIME_SA: o4o-runtime@netureyoutube.iam.gserviceaccount.com
jobs:
  deploy:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && vars.DEPLOY_FREEZE == 'false'
    # Production credentials and ref restrictions match the existing deployment jobs.
    # GCP owner must also allow this workflow in the WIF provider condition.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Mask cooperative account selectors before any step environment is logged
        if: ${{ !inputs.frontend_only }}
        run: node scripts/ci/mask-cooperative-accounts.mjs
      - name: Pin reviewed main HEAD and green CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$TARGET_SHA" = "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          node scripts/ci/ci-gate.mjs --target "$TARGET_SHA" --wait-seconds 1800 --enforce
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify frontend-only API compatibility without deploying API
        if: inputs.frontend_only
        run: |
          node --input-type=module <<'NODE'
          import { buildWorkspaceGraph } from './scripts/ci/detect-affected.mjs';
          import { DEPLOY_TARGETS, readServingSha, assessServingGap } from './scripts/ci/deploy-risk.mjs';
          const api = DEPLOY_TARGETS.find(target => target.key === 'api');
          const serving = readServingSha(api);
          const gap = assessServingGap(process.env.GITHUB_SHA, { api: serving }, buildWorkspaceGraph()).api;
          if (gap.deploy_required || !['UP_TO_DATE', 'BEHIND_NO_RUNTIME_CHANGE'].includes(gap.status)) {
            throw new Error(`Cooperative frontend requires compatible serving API: ${gap.status}`);
          }
          console.log(`Serving API compatibility verified: ${gap.status}`);
          NODE
      - name: Require same-SHA serving API and pin its immutable image
        if: ${{ !inputs.frontend_only }}
        run: |
          set -euo pipefail
          REVISION=$(gcloud run services describe o4o-core-api --region="$REGION" --project="$PROJECT_ID" --format=json | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const t=JSON.parse(s).status.traffic.filter(x=>x.percent>0);if(t.length!==1||t[0].percent!==100)process.exit(1);process.stdout.write(t[0].revisionName)})')
          gcloud run revisions describe "$REVISION" --region="$REGION" --project="$PROJECT_ID" --format=json > "$RUNNER_TEMP/coop-api-revision.json"
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/coop-api-revision.json"));if(r.metadata.labels["o4o-commit-sha"]!==process.env.GITHUB_SHA||!r.status.imageDigest)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,"API_IMAGE="+r.status.imageDigest+"\n")'
      - name: Provision only the approved cooperative test fixture
        # frontend_only skips the fixture entirely: no cooperative/membership/operator rows are read or written.
        if: ${{ !inputs.frontend_only }}
        env:
          APPLY: ${{ inputs.apply }}
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          COOP_TEST_OPERATOR_EMAIL: ${{ inputs.operator_email }}
          COOP_TEST_MEMBER_EMAIL: ${{ inputs.member_email }}
        run: |
          set -euo pipefail
          test -n "$COOP_TEST_OPERATOR_EMAIL" && test -n "$COOP_TEST_MEMBER_EMAIL"
          ARGS='dist/provision-test-cooperative.js'
          if [ "$APPLY" = 'true' ]; then ARGS="$ARGS,--apply"; fi
          node --input-type=module -e 'import fs from "node:fs";const e=process.env;fs.writeFileSync(e.RUNNER_TEMP+"/coop-job-env.json",JSON.stringify({NODE_ENV:"production",DB_HOST:"/cloudsql/netureyoutube:asia-northeast3:o4o-platform-db",DB_PORT:"5432",DB_USERNAME:e.DB_USERNAME,DB_NAME:e.DB_NAME,COOP_TEST_OPERATOR_EMAIL:e.COOP_TEST_OPERATOR_EMAIL,COOP_TEST_MEMBER_EMAIL:e.COOP_TEST_MEMBER_EMAIL}),{mode:0o600})'
          gcloud run jobs deploy o4o-coop-test-provision --image="$API_IMAGE" --region="$REGION" --project="$PROJECT_ID" \
            --service-account="$RUNTIME_SA" --task-timeout=300 --max-retries=0 \
            --env-vars-file="$RUNNER_TEMP/coop-job-env.json" \
            --set-secrets='DB_PASSWORD=o4o-db-password:latest' --set-cloudsql-instances=netureyoutube:asia-northeast3:o4o-platform-db \
            --command=node --args="$ARGS"
          gcloud run jobs execute o4o-coop-test-provision --region="$REGION" --project="$PROJECT_ID" --wait
      - name: Build and deploy cooperative frontend
        if: inputs.apply || inputs.frontend_only
        run: |
          set -euo pipefail
          gcloud auth configure-docker gcr.io --quiet
          docker build -f services/web-pharmacy-coop/Dockerfile -t "gcr.io/$PROJECT_ID/cooperative-web:$GITHUB_SHA" .
          docker push "gcr.io/$PROJECT_ID/cooperative-web:$GITHUB_SHA"
          COMMON=(--image="gcr.io/$PROJECT_ID/cooperative-web:$GITHUB_SHA" --region="$REGION" --project="$PROJECT_ID"
            --service-account="$RUNTIME_SA" --port=8080 --memory=256Mi --cpu=1 --min-instances=0 --max-instances=5
            --tag="sha-${GITHUB_SHA:0:12}" --update-labels="o4o-commit-sha=$GITHUB_SHA")
          if gcloud run services describe cooperative-web --region="$REGION" --project="$PROJECT_ID" --format='value(metadata.name)' >/dev/null 2>&1; then
            gcloud run deploy cooperative-web "${COMMON[@]}" --no-traffic
            echo "COOP_FIRST_CREATE=false" >> "$GITHUB_ENV"
          else
            # Cloud Run cannot create a service with --no-traffic; the first revision serves at once.
            # It stays private (no public invoker) until the owner grants access, so nothing is exposed early.
            gcloud run deploy cooperative-web "${COMMON[@]}" --no-allow-unauthenticated
            echo "COOP_FIRST_CREATE=true" >> "$GITHUB_ENV"
          fi
      - name: Verify revision readiness and discover private smoke URLs
        id: coop-smoke-target
        if: inputs.apply || inputs.frontend_only
        run: |
          set -euo pipefail
          if [ "$COOP_FIRST_CREATE" = 'true' ]; then
            # The first revision of a new service necessarily serves 100%, which the shared smoke rejects by design
            # (it guards --no-traffic deploys). Verify directly: the tagged revision is the sole 100% target and Ready.
            # It is private, so it cannot be fetched anonymously here.
            gcloud run services describe cooperative-web --region="$REGION" --project="$PROJECT_ID" --format=json > "$RUNNER_TEMP/coop-web-service.json"
            REVISION=$(TAG="sha-${GITHUB_SHA:0:12}" node --input-type=module -e 'import fs from "node:fs";const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/coop-web-service.json"));const live=(s.status.traffic??[]).filter(t=>t.percent>0);const tagged=(s.status.traffic??[]).find(t=>t.tag===process.env.TAG);if(!tagged||live.length!==1||live[0].percent!==100||live[0].revisionName!==tagged.revisionName)process.exit(1);process.stdout.write(tagged.revisionName)')
            gcloud run revisions describe "$REVISION" --region="$REGION" --project="$PROJECT_ID" --format=json \
              | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const c=(JSON.parse(s).status.conditions??[]).find(x=>x.type==="Ready");if(c?.status!=="True")process.exit(1)})'
            echo "first revision $REVISION serves 100% and is Ready (private until public invoker is granted)"
          else
            node scripts/ci/cloud-run-rollout.mjs smoke --service cooperative-web --tag "sha-${GITHUB_SHA:0:12}" --mode readiness
          fi
          # Private services require an ID token; never grant public invoker for smoke.
          gcloud run services describe cooperative-web --region="$REGION" --project="$PROJECT_ID" --format=json > "$RUNNER_TEMP/coop-smoke-service.json"
          SERVICE_URL=$(node -e 'const s=require(process.env.RUNNER_TEMP+"/coop-smoke-service.json");if(!s.status.url)process.exit(1);process.stdout.write(s.status.url)')
          TAG_URL=$(TAG="sha-${GITHUB_SHA:0:12}" node -e 'const s=require(process.env.RUNNER_TEMP+"/coop-smoke-service.json");const t=(s.status.traffic??[]).find(t=>t.tag===process.env.TAG);if(!t?.url)process.exit(1);process.stdout.write(t.url)')
          printf 'service_url=%s\ntag_url=%s\n' "$SERVICE_URL" "$TAG_URL" >> "$GITHUB_OUTPUT"
      - name: Authenticate private revision smoke
        id: coop-smoke-auth
        if: inputs.apply || inputs.frontend_only
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.coop-smoke-target.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify private frontend and switch traffic
        if: inputs.apply || inputs.frontend_only
        env:
          ID_TOKEN: ${{ steps.coop-smoke-auth.outputs.id_token }}
          TAG_URL: ${{ steps.coop-smoke-target.outputs.tag_url }}
        run: |
          set -euo pipefail
          test -n "$ID_TOKEN" && test -n "$TAG_URL"
          for PATH_TO_CHECK in / /test /login; do
            # The audience remains the service URL when the request targets a tag URL.
            curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 \
              --header "Authorization: Bearer $ID_TOKEN" \
              "$TAG_URL$PATH_TO_CHECK" --output "$RUNNER_TEMP/coop-smoke.html"
            grep -Eiq '<(!doctype html|html)([[:space:]>])' "$RUNNER_TEMP/coop-smoke.html"
          done
          unset ID_TOKEN
          gcloud run services update-traffic cooperative-web --region="$REGION" --project="$PROJECT_ID" --to-tags="sha-${GITHUB_SHA:0:12}=100"
          gcloud run services describe cooperative-web --region="$REGION" --project="$PROJECT_ID" --format=json > "$RUNNER_TEMP/coop-after-switch.json"
          TAG="sha-${GITHUB_SHA:0:12}" node -e 'const s=require(process.env.RUNNER_TEMP+"/coop-after-switch.json");const t=(s.status.traffic??[]).find(t=>t.tag===process.env.TAG);const live=(s.status.traffic??[]).filter(t=>t.percent>0);if(!t||live.length!==1||live[0].percent!==100||live[0].revisionName!==t.revisionName)process.exit(1);console.log("Cooperative traffic verified: reviewed revision receives 100%")'
      # Public invoker IAM, DNS, HTTPS certificate and load-balancer host routing are owner-managed.
      # This workflow never grants IAM or claims the public domain is ready merely because Cloud Run deployed.
