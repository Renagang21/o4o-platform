name: Deploy Admin Dashboard (Cloud Run)

# Deploy Admin Dashboard to Cloud Run
# Migrated from AWS Lightsail SSH to GCP Cloud Run (2025-12-29)

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: false

# WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
#
# trigger 는 **넓게**, 실행은 **좁게**.
#   - `on.paths` 에서 `packages/**` 를 지우지 않는다. 지우면 Admin 의존성 package 변경이
#     조용히 배포되지 않는 false negative 가 된다.
#   - 대신 `detect` 잡이 Admin 의 실제 transitive dependency closure 를 계산해
#     무관한 package 변경이면 install · build · Docker · Cloud Run 을 전부 건너뛴다.
#     (실측: `packages/hospital-pharmacy-core` 만 바뀐 변경이 Admin 을 3분 01초 재배포)
#   - root manifest / lockfile / setup-build-env 는 Admin build 결과를 실제로 바꾸는데도
#     trigger 에 없어 배포되지 않았다(false negative). census 근거로 추가한다.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/admin-dashboard/**'
      - 'packages/**'
      # root 의존성 · 설치 · 빌드 환경 — Admin 산출물에 직접 영향을 준다.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/actions/setup-build-env/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (affected 판정을 무시하고 배포)'
        required: false
        default: 'false'
      base_sha:
        description: '판정 기준 base SHA (비우면 안전 fallback = 배포)'
        required: false
        default: ''
      head_sha:
        description: '판정 기준 head SHA (비우면 현재 SHA)'
        required: false
        default: ''

env:
  PROJECT_ID: netureyoutube
  REGION: asia-northeast3
  REPOSITORY_NAME: o4o-api

jobs:
  # 판정 전용 경량 잡 — checkout + node 만 쓴다. pnpm install · GCP 인증 없음.
  # 판정기는 `scripts/ci/detect-affected.mjs` 로 CI Pipeline 과 **같은 단일 지점**이다.
  # base SHA 이상 · force push · shallow history · 매핑 불가 경로는 모두
  # `admin_affected=true` 로 fallback 한다 (배포 누락보다 1회 더 배포).
  detect:
    name: Detect admin impact
    runs-on: ubuntu-latest
    outputs:
      admin_affected: ${{ steps.scope.outputs.admin_affected }}
      fallback: ${{ steps.scope.outputs.fallback }}

    steps:
    - uses: actions/checkout@v6
      with:
        # multi-commit push batch(`event.before..sha`) 를 통째로 보기 위해 필요하다.
        fetch-depth: 0

    - name: Classify changed scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.inputs.base_sha || github.event.before }}
        HEAD_SHA: ${{ github.event.inputs.head_sha || github.sha }}
      run: node scripts/ci/detect-affected.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: [detect]
    # Admin 과 무관한 변경에서는 install / build / Docker push / Cloud Run deploy 가
    # 한 줄도 실행되지 않는다. 수동 강제 배포는 force_deploy 로 계속 가능하다.
    if: needs.detect.outputs.admin_affected == 'true' || github.event.inputs.force_deploy == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Determine deployment target
      id: config
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "✅ Deploying to PRODUCTION"
          echo "service_name=o4o-admin-dashboard" >> $GITHUB_OUTPUT
          echo "image_name=admin-dashboard" >> $GITHUB_OUTPUT
          echo "api_url=https://api.neture.co.kr/api" >> $GITHUB_OUTPUT
          echo "app_origin=https://admin.neture.co.kr" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          echo "⚠️ Deploying to DEVELOPMENT"
          echo "service_name=o4o-admin-dashboard-dev" >> $GITHUB_OUTPUT
          echo "image_name=admin-dashboard-dev" >> $GITHUB_OUTPUT
          echo "api_url=https://api.neture.co.kr/api" >> $GITHUB_OUTPUT
          echo "app_origin=https://dev-admin.neture.co.kr" >> $GITHUB_OUTPUT
        fi

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: '22.18.0'
        # Admin deploy does not need every workspace package. Build the exact transitive
        # workspace dependency closure below instead of the repository-wide build:packages chain.
        build-packages: 'false'

    - name: Build admin workspace dependencies
      run: |
        echo "🔨 Building Admin Dashboard workspace dependencies..."
        pnpm --filter '@o4o/admin-dashboard^...' run build
        echo "✅ Admin Dashboard dependency closure built successfully"

    - name: Build admin dashboard
      run: |
        echo "🔨 Building admin dashboard..."
        cd apps/admin-dashboard

        # Run prebuild to generate version.json
        pnpm run prebuild

        # Extract branch name
        BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

        # Build with production settings
        NODE_ENV=production \
        NODE_OPTIONS='--max-old-space-size=4096' \
        VITE_API_URL=${{ steps.config.outputs.api_url }} \
        VITE_PUBLIC_APP_ORIGIN=${{ steps.config.outputs.app_origin }} \
        VITE_GIT_BRANCH="$BRANCH_NAME" \
        pnpm run build:prod

        # Ensure version.json is in dist/
        if [ ! -f dist/version.json ] && [ -f public/version.json ]; then
          echo "📋 Copying version.json to dist..."
          cp public/version.json dist/version.json
        fi

        echo "📋 Build output:"
        ls -lh dist/

        echo "📄 Version info:"
        cat dist/version.json

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    - name: Build and Push Docker image
      run: |
        cd apps/admin-dashboard

        IMAGE_TAG="${{ github.sha }}"
        FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ steps.config.outputs.image_name }}:${IMAGE_TAG}"
        LATEST_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ steps.config.outputs.image_name }}:latest"

        echo "🐳 Building Docker image..."

        # Create production Dockerfile for pre-built assets
        cat > Dockerfile.cloudrun << 'EOF'
        FROM nginx:alpine

        # Copy pre-built assets
        COPY dist /usr/share/nginx/html

        # Nginx config for SPA routing
        RUN echo 'server { \
            listen 8080; \
            server_name _; \
            root /usr/share/nginx/html; \
            index index.html; \
            gzip on; \
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml; \
            location / { \
                try_files $uri $uri/ /index.html; \
            } \
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ { \
                expires 1y; \
                add_header Cache-Control "public, immutable"; \
            } \
        }' > /etc/nginx/conf.d/default.conf

        EXPOSE 8080
        CMD ["nginx", "-g", "daemon off;"]
        EOF

        docker build \
          --platform linux/amd64 \
          --tag "${FULL_IMAGE}" \
          --tag "${LATEST_IMAGE}" \
          --file Dockerfile.cloudrun \
          .

        echo "📤 Pushing to Artifact Registry..."
        docker push "${FULL_IMAGE}"
        docker push "${LATEST_IMAGE}"

        echo "✅ Image pushed: ${FULL_IMAGE}"
        echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

    - name: Deploy to Cloud Run
      run: |
        FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ steps.config.outputs.image_name }}:${{ env.IMAGE_TAG }}"

        echo "🚀 Deploying to Cloud Run..."
        gcloud run deploy ${{ steps.config.outputs.service_name }} \
          --image="${FULL_IMAGE}" \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=5 \
          --concurrency=80 \
          --timeout=60

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."

        SERVICE_URL=$(gcloud run services describe ${{ steps.config.outputs.service_name }} \
          --region=${{ env.REGION }} \
          --project=${{ env.PROJECT_ID }} \
          --format="value(status.url)")

        echo "🌐 Service URL: ${SERVICE_URL}"

        # Health check
        for i in {1..3}; do
          echo "Health check attempt $i..."
          if curl -sf "${SERVICE_URL}/" > /dev/null; then
            echo "✅ Health check passed!"
            break
          fi
          if [ $i -eq 3 ]; then
            echo "⚠️ Health check did not succeed, but deployment completed"
          fi
          sleep 5
        done

        echo ""
        echo "=========================================="
        echo "✅ Admin Dashboard Deployed Successfully!"
        echo "=========================================="
        echo "🌐 Cloud Run URL: ${SERVICE_URL}"
        echo "📅 Time: $(date)"
        echo "📝 Commit: ${{ github.sha }}"
        echo ""
        echo "⚠️ Note: Custom domain mapping required for https://admin.neture.co.kr"
