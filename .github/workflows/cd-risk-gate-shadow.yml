name: Deploy Risk Gate (shadow)

# WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1 — Phase 2 · 3 shadow
#
# **이 workflow 는 배포하지 않는다.** 배포를 막거나 허용하지도 않는다. 기록만 한다.
#   - main 의 CI Pipeline 이 끝날 때마다(성공 · 실패 모두) 그 commit 을 target 으로
#     "지금 production 이 서빙 중인 SHA → target SHA" 를 서비스별로 판정한다.
#   - 결과: CI 상태 · serving SHA · 변경 파일 수 · affected 서비스 · risk_level · 사유 ·
#     향후 enforcement 에서 일어났을 결정(would-be). Job Summary + artifact(JSON, 30일).
#   - 실제 배포 결정은 여전히 DEPLOY_ENABLED 게이트 + 사람의 dispatch 다 (이번 WO 에서 cutover 하지 않는다).
#
# 쓰기 0: GCP 는 `run services/revisions describe` · `container images list-tags` 만 호출한다.
# 근거: docs/checks/CHECK-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1.md

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: '판정할 target SHA (40자 · 비우면 현재 ref)'
        required: false
        default: ''

concurrency:
  group: cd-risk-gate-shadow-${{ github.event.workflow_run.head_sha || github.event.inputs.target_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  shadow:
    name: Shadow risk verdict
    # main push 로 돈 CI 만 본다 (PR run 은 head_branch 가 main 이 아니어서 branches 필터로 이미 빠진다).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.target_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          # serving SHA(과거 배포 commit)부터 target 까지의 diff 가 필요하다.
          fetch-depth: 0
          # 운영 데이터 manifest(≈1.25GB)는 판정에 쓰지 않는다. sparse 지정 시 blob:none 부분 fetch.
          sparse-checkout: |
            /*
            !/apps/api-server/src/scripts/data/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: CI gate (shadow — 기록만)
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GitHub API 가 막 끝난 run 을 잠깐 0건으로 돌려줄 수 있다(2026-09-30 실측) — 기록 정확도를 위해 짧게 재조회.
        run: node scripts/ci/ci-gate.mjs --target "$TARGET_SHA" --missing-wait-seconds 120 --interval-seconds 20

      - name: Authenticate to Google Cloud (read-only 조회용)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: netureyoutube
          skip_install: true

      - name: Serving SHA → target SHA risk verdict (shadow)
        run: |
          node scripts/ci/deploy-risk.mjs \
            --target "$TARGET_SHA" \
            --serving-from-gcloud \
            --ci-green "${{ steps.ci.outputs.ci_green }}" \
            --freeze "${{ vars.DEPLOY_FREEZE == 'true' }}" \
            --deploy-enabled "${{ vars.DEPLOY_ENABLED == 'true' }}" \
            --json "$RUNNER_TEMP/deploy-risk-shadow.json"

      - name: Upload shadow record
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: deploy-risk-shadow-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/deploy-risk-shadow.json
          retention-days: 30
          if-no-files-found: ignore
