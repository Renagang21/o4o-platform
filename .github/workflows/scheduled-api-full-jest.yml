name: Scheduled API Full Jest

# All discovered suites remain blocking. The plan pins one main SHA and execution policy;
# the three runners preserve serial Jest execution and the aggregate checks exact coverage.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: 'Controlled comparison: disable both build/Jest caches without changing test scope'
        type: choice
        options: [default, disabled]
        default: default

concurrency:
  group: scheduled-api-full-jest
  cancel-in-progress: false
permissions:
  contents: read
env:
  NODE_VERSION: '22.23.4'
  CI_BUILD_CACHE_DISABLED: ${{ vars.CI_BUILD_CACHE_DISABLED }}
jobs:
  plan:
    name: Discover full Jest scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      strategy: ${{ steps.plan.outputs.strategy }}
      cache_mode: ${{ steps.plan.outputs.cache_mode }}
      build_cache_disabled: ${{ steps.plan.outputs.build_cache_disabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          strict-lockfile: 'true'
          build-packages: 'false'
      - name: Discover all tests and verify the three partitions
        id: plan
        env:
          O4O_JEST_SHARD_STRATEGY: ${{ vars.O4O_JEST_SHARD_STRATEGY }}
          CACHE_MODE: ${{ inputs.cache_mode || 'default' }}
        run: node scripts/ci/scheduled-jest.mjs plan --cache-mode "$CACHE_MODE" --output reports/plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: scheduled-jest-plan-${{ github.run_id }}
          path: reports/plan.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error
  full-jest:
    name: API Server Jest (scheduled ${{ matrix.shard }}/3)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_BUILD_CACHE_DISABLED: ${{ needs.plan.outputs.build_cache_disabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          strict-lockfile: 'true'
          build-packages: 'false'
      - name: Build api-server workspace dependencies
        uses: ./.github/actions/api-dependency-build
      - uses: actions/download-artifact@v8
        with:
          name: scheduled-jest-plan-${{ github.run_id }}
          path: plan
      - name: Run the full assigned shard and record memory/runtime evidence
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/scheduled-jest.mjs run --plan plan/plan.json --shard "$SHARD" --output reports
      - name: Preserve results even after failure or OOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-jest-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: reports/
          overwrite: true
          retention-days: 7
          if-no-files-found: error
  aggregate:
    name: Scheduled full Jest result
    if: always()
    needs: [plan, full-jest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: scheduled-jest-*-${{ github.run_id }}
          path: artifacts
      - name: Reconcile every discovered suite and every required job
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MATRIX_RESULT: ${{ needs.full-jest.result }}
        run: node scripts/ci/scheduled-jest.mjs aggregate --artifacts artifacts
