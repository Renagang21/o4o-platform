name: PR Overlap Notice

# AGENTS.md §4-1(e) 「겹치는 PR 표시」 · §4-3 lane(R1) 보조 — 같은 파일 · 같은 lane 을 바꾸는 열린 PR 을 댓글 하나로 알린다.
# 병합 gate 가 아니다(CI Gate needs 에 넣지 않는다). 판정 · 댓글 규칙은 scripts/ci/pr-overlap.mjs 상단 주석.
# 드래프트 동안은 돌지 않고 Ready 전환 · Ready 이후 push 때 돈다(Size Labeler 와 같은 정책).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap-notice:
    name: Notify overlapping open PRs
    # fork PR 의 GITHUB_TOKEN 은 읽기 전용이라 댓글을 쓸 수 없다.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.fork != true }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX == 'self-hosted' && github.event.repository.private == true && github.event.pull_request.head.repo.fork != true && '["self-hosted","Linux","X64","o4o-ci-linux"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/ci/pr-overlap.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Find overlapping open PRs and update the notice comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/pr-overlap.mjs
