name: PharmacyHub QR Cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read/validate; apply = existing operation; operator-census = standalone read-only assignments'
        type: choice
        options: [plan, apply, operator-census, demo-participation-plan, demo-participation-apply]
        default: plan
      demo_census:
        description: "Read-only canonical Demo/store relationship census; no QR operation"
        type: boolean
        default: false
      demo_accounts:
        description: 'Standalone canonical Demo credential/staff reconciliation; plan first, apply with exact digest'
        type: boolean
        default: false
      accounts_digest:
        description: 'Exact read-only Demo account plan digest; required for apply'
        type: string
        required: false
      retirement_inventory:
        description: "Read-only PH resource/schema/scoped-row census; no redirect or deletion"
        type: boolean
        default: false
      ph_admin_purge:
        description: "Standalone fixed-census PH administrative data cleanup in Cloud Run; excludes commerce/media"
        type: boolean
        default: false
      ph_development_purge:
        description: "Standalone fixed PH order/payment/offer/content development rows; media/GCS preserved"
        type: boolean
        default: false
      ph_media_purge:
        description: "Standalone PH-only media and exact GCS objects; requires reference/generation verification"
        type: boolean
        default: false
      certificate_retirement:
        description: "Standalone fixed PH certificate/entries/DNS authorization retirement; preserve shared map/LB"
        type: boolean
        default: false
      domain_detachment:
        description: "Standalone PH host/matcher removal from URL map; preserve other domains and shared LB"
        type: boolean
        default: false
      resource_retirement:
        description: 'Standalone PH backend/NEG/Cloud Run retirement after verified redirects; no DB writes'
        type: boolean
        default: false
      retire_host:
        description: 'Retire all PH host routes; remove PH backend references, preserve path/query to Neture'
        type: boolean
        default: false
      demo_relink:
        description: 'Canonical Store Demo ownership relink; plan first, apply with matching digest'
        type: boolean
        default: false
      demo_cleanup:
        description: 'Delete explicitly reviewed obsolete test stores; preserve canonical store and all identities'
        type: boolean
        default: false
      copy_cleanup:
        description: 'Reviewed hidden workflow-verification CMS copy only; no general asset deletion'
        type: boolean
        default: false
      copy_snapshot:
        description: 'Reviewed verification snapshot ID SHA256 fingerprint'
        type: string
        required: false
      copy_organization:
        description: 'Owning canonical test store ID SHA256 fingerprint'
        type: string
        required: false
      copy_marker:
        description: 'Verification marker SHA256 fingerprint from private creation record'
        type: string
        required: false
      copy_digest:
        description: 'Exact before-image digest from standalone read-only copy plan'
        type: string
        required: false
      cleanup_keep:
        description: 'Original canonical store ID SHA256 fingerprint to retain'
        type: string
        required: false
      cleanup_targets:
        description: 'Reviewed obsolete store ID SHA256 fingerprints, comma-separated'
        type: string
        required: false
      cleanup_digest:
        description: 'Matching before-image digest from read-only deletion plan'
        type: string
        required: false
      relink_targets:
        description: 'Reviewed SHA256 store ID fingerprints, comma-separated; omit only for discovery'
        type: string
        required: false
      relink_digest:
        description: 'Exact digest from the read-only store relink plan; required for apply'
        type: string
        required: false
      probe_paths:
        description: 'plan/apply: QR paths or blank inventory; operator-census: SHA256 of normalized target email (no raw email)'
        type: string
        required: false

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write

concurrency:
  group: pharmacyhub-global-url-map
  cancel-in-progress: false

jobs:
  cutover:
    # Production inventory requires main; writes also require an explicit unfrozen state.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CUTOVER_MODE: ${{ inputs.mode == 'demo-participation-plan' && 'plan' || inputs.mode == 'demo-participation-apply' && 'apply' || inputs.mode }}
      DEMO_PARTICIPATION_FLAG: ${{ startsWith(inputs.mode, 'demo-participation-') }}
      DEMO_PARTICIPATION_DIGEST: ${{ inputs.accounts_digest }}
      PH_ADMIN_PURGE: ${{ inputs.ph_admin_purge }}
      PH_DEVELOPMENT_PURGE: ${{ inputs.ph_development_purge }}
      PH_MEDIA_PURGE: ${{ inputs.ph_media_purge }}
      CERTIFICATE_RETIREMENT: ${{ inputs.certificate_retirement }}
      DOMAIN_DETACHMENT: ${{ inputs.domain_detachment }}
      RETIREMENT_INVENTORY: ${{ inputs.retirement_inventory }}
      RESOURCE_RETIREMENT: ${{ inputs.resource_retirement }}
      RETIRE_PH_HOST: ${{ inputs.retire_host }}
      DEMO_CENSUS_FLAG: ${{ inputs.demo_census }}
      DEMO_ACCOUNTS_FLAG: ${{ inputs.demo_accounts }}
      OPERATOR_CENSUS_FLAG: ${{ inputs.mode == 'operator-census' }}
      OPERATOR_IDENTITY_SHA256: ${{ inputs.mode == 'operator-census' && inputs.probe_paths || '' }}
      DEMO_RELINK_FLAG: ${{ inputs.demo_relink }}
      DEMO_CLEANUP_FLAG: ${{ inputs.demo_cleanup }}
      COPY_CLEANUP_FLAG: ${{ inputs.copy_cleanup }}
      QR_PROBE_PATHS: ${{ inputs.probe_paths }}
      DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
      WORKFLOW_ACTOR: ${{ github.triggering_actor }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Enforce production write gate
        run: |
          echo "CUTOVER_OUTPUT=$RUNNER_TEMP/pharmacyhub-qr-cutover" >> "$GITHUB_ENV"
          echo "PROBE_OUTPUT=$RUNNER_TEMP/pharmacyhub-qr-probes.txt" >> "$GITHUB_ENV"
          echo "CUTOVER_DEADLINE_MS=$(( $(date +%s) * 1000 + 29 * 60 * 1000 ))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Production inventory requires main.'
            exit 1
          fi
          if [ "${OPERATOR_CENSUS_FLAG:-false}" = 'true' ]; then
            if [ "$CUTOVER_MODE" != 'operator-census' ] || [ "$WORKFLOW_ACTOR" != "$REPOSITORY_OWNER" ] || [ "$QR_PROBE_PATHS" != "${OPERATOR_IDENTITY_SHA256:-}" ]; then
              echo 'Operator census requires standalone owner read-only plan.'
              exit 1
            fi
            for flag in "$PH_MEDIA_PURGE" "$PH_DEVELOPMENT_PURGE" "$PH_ADMIN_PURGE" "$CERTIFICATE_RETIREMENT" "$DOMAIN_DETACHMENT" "$RETIREMENT_INVENTORY" "$RESOURCE_RETIREMENT" "$RETIRE_PH_HOST" "$DEMO_CENSUS_FLAG" "$DEMO_RELINK_FLAG" "$DEMO_CLEANUP_FLAG" "$COPY_CLEANUP_FLAG" "$DEMO_ACCOUNTS_FLAG"; do
              if [ "$flag" = 'true' ]; then
                echo 'Operator census cannot be combined with another operation.'
                exit 1
              fi
            done
            if ! [[ "${OPERATOR_IDENTITY_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]; then
              echo 'Operator census requires a valid identity fingerprint.'
              exit 1
            fi
          elif [ -n "${OPERATOR_IDENTITY_SHA256:-}" ]; then
            echo 'Operator identity fingerprint requires the census option.'
            exit 1
          fi
          if [ "$DEMO_PARTICIPATION_FLAG" = 'true' ]; then
            if [ "$DEMO_ACCOUNTS_FLAG" != 'true' ] || [ -n "$QR_PROBE_PATHS" ]; then
              echo 'Owner participation requires standalone Demo account operation.'; exit 1
            fi
            case "$CUTOVER_MODE" in plan|apply) ;; *) echo 'Unknown participation mode.'; exit 1 ;; esac
            if [ "$CUTOVER_MODE" = 'apply' ] && ! [[ "$DEMO_PARTICIPATION_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
              echo 'Owner participation apply requires an exact plan digest.'; exit 1
            fi
          fi
          ph_count=0
          for flag in "$PH_MEDIA_PURGE" "$PH_DEVELOPMENT_PURGE" "$PH_ADMIN_PURGE" "$CERTIFICATE_RETIREMENT" "$DOMAIN_DETACHMENT"; do
            if [ "$flag" = 'true' ]; then ph_count=$((ph_count + 1)); fi
          done
          if [ "$ph_count" -gt 1 ]; then
            echo 'PH maintenance operations must be standalone.'; exit 1
          fi
          if [ "$ph_count" -gt 0 ]; then
            case "$CUTOVER_MODE" in plan|apply) ;; *) echo 'Unknown PH cleanup mode.'; exit 1 ;; esac
            if [ "$WORKFLOW_ACTOR" != "$REPOSITORY_OWNER" ] || [ "$RETIREMENT_INVENTORY" = 'true' ] || [ "$RESOURCE_RETIREMENT" = 'true' ] || [ "$RETIRE_PH_HOST" = 'true' ] || [ "$DEMO_CENSUS_FLAG" = 'true' ] || [ "$DEMO_RELINK_FLAG" = 'true' ] || [ "$DEMO_CLEANUP_FLAG" = 'true' ] || [ "$COPY_CLEANUP_FLAG" = 'true' ] || [ "$DEMO_ACCOUNTS_FLAG" = 'true' ] || [ -n "$QR_PROBE_PATHS" ]; then
              echo 'PH administrative cleanup requires standalone owner operation.'
              exit 1
            fi
          fi
          demo_count=0
          for flag in "$DEMO_CENSUS_FLAG" "$DEMO_RELINK_FLAG" "$DEMO_CLEANUP_FLAG" "$COPY_CLEANUP_FLAG" "$DEMO_ACCOUNTS_FLAG"; do
            if [ "$flag" = 'true' ]; then demo_count=$((demo_count + 1)); fi
          done
          if [ "$RETIRE_PH_HOST" = 'true' ] && [ "$demo_count" -gt 0 ]; then
            echo 'Host retirement cannot be combined with Demo operations.'
            exit 1
          fi
          if [ "$demo_count" -gt 1 ]; then
            echo 'Choose only one Demo operation.'
            exit 1
          fi
          if [ "$demo_count" -gt 0 ] && [ "$WORKFLOW_ACTOR" != "$REPOSITORY_OWNER" ]; then
            echo 'Demo operations require the repository owner.'
            exit 1
          fi
          if [ "$RETIREMENT_INVENTORY" = 'true' ]; then
            if [ "$CUTOVER_MODE" != 'plan' ] || [ "$RETIRE_PH_HOST" = 'true' ] || [ "$demo_count" -gt 0 ]; then
              echo 'Retirement inventory requires standalone read-only plan.'
              exit 1
            fi
          fi
          if [ "$RESOURCE_RETIREMENT" = 'true' ]; then
            if [ "$RETIREMENT_INVENTORY" = 'true' ] || [ "$RETIRE_PH_HOST" = 'true' ] || [ "$demo_count" -gt 0 ] || [ "$WORKFLOW_ACTOR" != "$REPOSITORY_OWNER" ]; then
              echo 'PH resource retirement requires a standalone owner operation.'
              exit 1
            fi
          fi
          if [ "$DEMO_CENSUS_FLAG" = 'true' ] && [ "$CUTOVER_MODE" != 'plan' ]; then
            echo 'Demo census only supports read-only plan.'
            exit 1
          fi
          if [ "$CUTOVER_MODE" = 'apply' ]; then
            if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$DEPLOY_FREEZE" != 'false' ]; then
              echo 'Apply requires main and DEPLOY_FREEZE=false.'
              exit 1
            fi
          fi
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env
        with:
          node-version: '22.18.0'
          build-packages: 'false'
          strict-lockfile: 'true'
      - name: Test cutover safety
        run: node --test scripts/deployment/service-operator-census.test.mjs scripts/deployment/service-operator-operation-gate.test.mjs scripts/deployment/pharmacy-hub-media-purge.test.mjs scripts/deployment/pharmacy-hub-development-purge.test.mjs scripts/deployment/pharmacy-hub-domain-detachment.test.mjs scripts/deployment/pharmacy-hub-certificate-retirement.test.mjs scripts/deployment/pharmacy-hub-retirement-references.test.mjs scripts/deployment/demo-account-operation-gate.test.mjs scripts/deployment/demo-owner-participation-gate.test.mjs scripts/deployment/pharmacy-hub-administrative-purge.test.mjs scripts/deployment/pharmacy-hub-administrative-purge-job.test.mjs scripts/deployment/pharmacy-hub-domain-inventory.test.mjs scripts/deployment/pharmacy-hub-resource-retirement.test.mjs scripts/deployment/pharmacy-hub-retirement-inventory.test.mjs scripts/deployment/pharmacy-hub-qr-redirect.test.mjs scripts/deployment/pharmacy-hub-qr-cutover.test.mjs scripts/deployment/pharmacy-hub-qr-probes.test.mjs scripts/deployment/demo-store-census.test.mjs scripts/deployment/demo-store-relink.test.mjs scripts/deployment/demo-store-cleanup.test.mjs scripts/deployment/store-verification-copy-cleanup.test.mjs
      - name: Require successful main CI for participation writes
        if: inputs.demo_accounts == true && startsWith(inputs.mode, 'demo-participation-') && env.CUTOVER_MODE == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "CI Gate" and .conclusion == "success")] | length > 0' > "$RUNNER_TEMP/owner-demo-ci-gate"
          test "$(cat "$RUNNER_TEMP/owner-demo-ci-gate")" = 'true'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: netureyoutube
          skip_install: true
      - name: Plan or apply fixed PH administrative cleanup in Cloud Run
        if: inputs.ph_admin_purge == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-administrative-purge-job.mjs
      - name: Plan or apply fixed PH development data cleanup in Cloud Run
        if: inputs.ph_development_purge == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-development-purge-job.mjs
      - name: Plan or apply PH-only media and GCS cleanup in Cloud Run
        if: inputs.ph_media_purge == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-media-purge-job.mjs
      - name: Plan or apply dedicated PH certificate retirement
        if: inputs.certificate_retirement == true
        env:
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-certificate-retirement.mjs
      - name: Plan or apply PH URL map domain detachment
        if: inputs.domain_detachment == true
        env:
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-domain-detachment.mjs
      - name: Save domain detachment request and verification evidence
        if: always() && inputs.domain_detachment == true
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyhub-domain-detachment-${{ github.run_id }}
          path: ${{ runner.temp }}/pharmacyhub-qr-cutover/
          retention-days: 7
      - name: Start authenticated Cloud SQL proxy for read-only inventory
        if: inputs.ph_media_purge != true && inputs.ph_development_purge != true && inputs.ph_admin_purge != true && inputs.certificate_retirement != true && inputs.domain_detachment != true && (inputs.mode == 'operator-census' || inputs.retirement_inventory == true || inputs.demo_census == true || inputs.demo_relink == true || inputs.demo_cleanup == true || inputs.copy_cleanup == true || inputs.demo_accounts == true || (inputs.probe_paths == '' && !(inputs.retire_host == true && inputs.mode == 'plan')))
        run: |
          docker run -d --rm --user "$(id -u):$(id -g)" --name pharmacyhub-qr-sql-proxy --network host \
            --mount "type=bind,src=$GOOGLE_APPLICATION_CREDENTIALS,dst=/credentials.json,readonly" \
            gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3 \
            --credentials-file=/credentials.json --address=127.0.0.1 --port=55432 \
            netureyoutube:asia-northeast3:o4o-platform-db
          node --input-type=module -e '
            import net from "node:net";
            for (let attempt = 0; attempt < 30; attempt++) {
              const ready = await new Promise(resolve => {
                const socket = net.connect(55432, "127.0.0.1");
                socket.setTimeout(1000);
                socket.on("connect", () => { socket.destroy(); resolve(true); });
                socket.on("error", () => { socket.destroy(); resolve(false); });
                socket.on("timeout", () => { socket.destroy(); resolve(false); });
              });
              if (ready) process.exit(0);
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            process.exit(1);
          '
      - name: Collect existing active public paths without database writes
        if: inputs.ph_media_purge != true && inputs.ph_development_purge != true && inputs.ph_admin_purge != true && inputs.certificate_retirement != true && inputs.domain_detachment != true && inputs.retirement_inventory != true && inputs.mode != 'operator-census' && inputs.demo_census != true && inputs.demo_relink != true && inputs.demo_cleanup != true && inputs.copy_cleanup != true && inputs.demo_accounts != true && inputs.probe_paths == '' && !(inputs.retire_host == true && inputs.mode == 'plan')
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
        run: node scripts/deployment/pharmacy-hub-qr-probes.mjs
      - name: Read-only PharmacyHub retirement resource and database census
        if: inputs.retirement_inventory == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
        run: node scripts/deployment/pharmacy-hub-retirement-inventory.mjs
      - name: Read-only canonical Demo/store census
        if: inputs.demo_census == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
        run: node scripts/deployment/demo-store-census.mjs
      - name: Build existing service scope mapper for operator census
        if: inputs.mode == 'operator-census'
        run: pnpm --filter @o4o/security-core build
      - name: Read-only service operator assignment census
        if: inputs.mode == 'operator-census'
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          OPERATOR_IDENTITY_SHA256: ${{ inputs.probe_paths }}
        run: pnpm --filter @o4o/api-server exec tsx src/scripts/service-operator-census.ts
      - name: Build canonical public Demo config
        if: inputs.demo_accounts == true
        run: pnpm --filter @o4o/auth-utils build
      - name: Plan or apply canonical Demo account reconciliation
        if: inputs.demo_accounts == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          DEMO_ACCOUNTS_MODE: ${{ env.CUTOVER_MODE }}
          DEMO_ACCOUNTS_PARTICIPATION: ${{ env.DEMO_PARTICIPATION_FLAG }}
          DEMO_ACCOUNTS_DIGEST: ${{ inputs.accounts_digest }}
          DEMO_ACCOUNTS_OUTPUT: ${{ runner.temp }}/demo-account-reconciliation.json
        run: pnpm exec tsx apps/api-server/src/scripts/demo-account-reconcile.ts
      - name: Save sanitized Demo account reconciliation result
        if: always() && inputs.demo_accounts == true
        uses: actions/upload-artifact@v4
        with:
          name: demo-accounts-${{ github.run_id }}
          path: ${{ runner.temp }}/demo-account-reconciliation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Plan or apply canonical Demo store relink
        if: inputs.demo_relink == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          DEMO_RELINK_MODE: ${{ inputs.mode }}
          DEMO_RELINK_DIGEST: ${{ inputs.relink_digest }}
          DEMO_RELINK_TARGETS: ${{ inputs.relink_targets }}
        run: node scripts/deployment/demo-store-relink.mjs
      - name: Plan or apply obsolete test store cleanup
        if: inputs.demo_cleanup == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          DEMO_CLEANUP_MODE: ${{ inputs.mode }}
          DEMO_CLEANUP_KEEP: ${{ inputs.cleanup_keep }}
          DEMO_CLEANUP_TARGETS: ${{ inputs.cleanup_targets }}
          DEMO_CLEANUP_DIGEST: ${{ inputs.cleanup_digest }}
        run: node scripts/deployment/demo-store-cleanup.mjs
      - name: Plan or apply one reviewed workflow-verification copy cleanup
        if: inputs.copy_cleanup == true
        env:
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          COPY_CLEANUP_MODE: ${{ inputs.mode }}
          COPY_CLEANUP_TARGET: ${{ inputs.copy_snapshot }}
          COPY_CLEANUP_ORGANIZATION: ${{ inputs.copy_organization }}
          COPY_CLEANUP_MARKER: ${{ inputs.copy_marker }}
          COPY_CLEANUP_DIGEST: ${{ inputs.copy_digest }}
        run: node scripts/deployment/store-verification-copy-cleanup.mjs
      - name: Inventory, validate, optionally apply and verify
        if: inputs.ph_media_purge != true && inputs.ph_development_purge != true && inputs.ph_admin_purge != true && inputs.certificate_retirement != true && inputs.domain_detachment != true && inputs.resource_retirement != true && inputs.retirement_inventory != true && inputs.mode != 'operator-census' && inputs.demo_census != true && inputs.demo_relink != true && inputs.demo_cleanup != true && inputs.copy_cleanup != true && inputs.demo_accounts != true
        run: node scripts/deployment/pharmacy-hub-qr-cutover.mjs
      - name: Plan or apply fixed PharmacyHub infrastructure retirement
        if: inputs.resource_retirement == true
        env:
          PRODUCTION_GATE_TOKEN: ${{ github.token }}
        run: node scripts/deployment/pharmacy-hub-resource-retirement.mjs
      - name: Save backup and verification evidence
        if: always() && inputs.ph_media_purge != true && inputs.ph_development_purge != true && inputs.ph_admin_purge != true && inputs.certificate_retirement != true && inputs.domain_detachment != true && inputs.resource_retirement != true && inputs.retirement_inventory != true && inputs.mode != 'operator-census' && inputs.demo_census != true && inputs.demo_relink != true && inputs.demo_cleanup != true && inputs.copy_cleanup != true && inputs.demo_accounts != true
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyhub-url-map-${{ github.run_id }}
          path: ${{ runner.temp }}/pharmacyhub-qr-cutover/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop inventory proxy and remove public-path inventory
        if: always()
        run: |
          docker rm -f pharmacyhub-qr-sql-proxy >/dev/null 2>&1 || true
          rm -f "$PROBE_OUTPUT"
