name: PharmacyHub QR Cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read/validate only; apply = redirect and HTTP verification'
        type: choice
        options: [plan, apply]
        default: plan
      probe_paths:
        description: 'apply: four active relative paths, one per line (qr, tablet, multilingual-products, foreign-visitor/affiliate); preserve query parameters'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: pharmacyhub-global-url-map
  cancel-in-progress: false

jobs:
  cutover:
    # Read-only plans may run before merge; production writes require main and an explicit unfrozen state.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUTOVER_MODE: ${{ inputs.mode }}
      QR_PROBE_PATHS: ${{ inputs.probe_paths }}
      CUTOVER_OUTPUT: ${{ runner.temp }}/pharmacyhub-qr-cutover
      DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
    steps:
      - name: Enforce production write gate
        run: |
          if [ "$CUTOVER_MODE" = 'apply' ]; then
            if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$DEPLOY_FREEZE" != 'false' ]; then
              echo 'Apply requires main and DEPLOY_FREEZE=false.'
              exit 1
            fi
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
      - name: Test cutover safety
        run: node --test scripts/deployment/pharmacy-hub-qr-redirect.test.mjs scripts/deployment/pharmacy-hub-qr-cutover.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: netureyoutube
          skip_install: true
      - name: Inventory, validate, optionally apply and verify
        run: node scripts/deployment/pharmacy-hub-qr-cutover.mjs
      - name: Save backup and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyhub-url-map-${{ github.run_id }}
          path: ${{ runner.temp }}/pharmacyhub-qr-cutover/*.json
          if-no-files-found: ignore
          retention-days: 7
