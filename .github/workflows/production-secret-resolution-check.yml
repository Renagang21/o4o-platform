name: Production Secret Resolution Check

# WO-O4O-PRODUCTION-SECRET-ENVIRONMENT-MIGRATION-AND-COLLABORATOR-SAFETY-CLOSURE-V1
#   production credential 이 어느 scope 에서 resolve 되는지 **값을 출력하지 않고** 검증한다. 배포 · GCP · DB 접근 0.
#
#   repository-scope  : environment 없음 → repository secret 만 보인다 (collaborator branch workflow 와 같은 시야)
#   environment-scope : environment: production → environment secret 우선, 없으면 repository secret 으로 fallback
#
#   판정 (이름 census `gh secret list --env production` 과 함께 읽는다)
#     이전 중   : environment PRESENT · repository PRESENT · 값 MATCH  → 등록값이 기존 값과 같다(오타 0) → 사본 삭제 가능
#                 값 DIFF → environment 에 등록한 값이 기존과 다르다 → 삭제 금지 · 재등록
#     이전 후   : environment PRESENT · repository ABSENT → environment 에서만 resolve · repository scope 0 (collaborator 경로 닫힘)
#
#   값 비교는 각 job 안에서 sha256 앞 6자 fingerprint 만 만들어 job output 으로 넘긴다. 원문 · 전체 digest 는 출력하지 않는다.
#   (fingerprint 는 오타 검출용 24bit 요약이다 — credential 을 복원할 수 없다.)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-secret-resolution-check
  cancel-in-progress: false

jobs:
  repository-scope:
    name: Repository scope (environment 없음)
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fingerprints: ${{ steps.fp.outputs.fingerprints }}
    steps:
      - name: Fingerprint repository-scope values
        id: fp
        env:
          GCP_DB_NAME: ${{ secrets.GCP_DB_NAME }}
          GCP_DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          GCP_JWT_SECRET: ${{ secrets.GCP_JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e '
            const crypto = require("crypto");
            const names = ["GCP_DB_NAME","GCP_DB_USERNAME","GCP_JWT_SECRET","SMTP_USER","SMTP_PASS","GEMINI_API_KEY","OPENAI_API_KEY"];
            const out = {};
            for (const n of names) {
              const v = process.env[n] || "";
              out[n] = v ? crypto.createHash("sha256").update(v).digest("hex").slice(0, 6) : "";
              console.log(`${n}: ${v ? "PRESENT" : "ABSENT"}`);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `fingerprints=${JSON.stringify(out)}\n`);
          '

  environment-scope:
    name: production Environment scope
    needs: repository-scope
    if: github.triggering_actor == github.repository_owner
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve in production Environment and compare
        env:
          REPO_FP: ${{ needs.repository-scope.outputs.fingerprints }}
          GCP_DB_NAME: ${{ secrets.GCP_DB_NAME }}
          GCP_DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          GCP_JWT_SECRET: ${{ secrets.GCP_JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e '
            const crypto = require("crypto");
            const repo = JSON.parse(process.env.REPO_FP || "{}");
            const names = ["GCP_DB_NAME","GCP_DB_USERNAME","GCP_JWT_SECRET","SMTP_USER","SMTP_PASS","GEMINI_API_KEY","OPENAI_API_KEY"];
            const rows = ["| secret | production job | repository scope | 값 |", "|---|---|---|---|"];
            let missing = 0;
            for (const n of names) {
              const v = process.env[n] || "";
              const fp = v ? crypto.createHash("sha256").update(v).digest("hex").slice(0, 6) : "";
              const r = repo[n] || "";
              const cmp = !fp || !r ? "-" : fp === r ? "MATCH" : "DIFF";
              if (!fp) missing += 1;
              rows.push(`| ${n} | ${fp ? "PRESENT" : "MISSING"} | ${r ? "PRESENT" : "ABSENT"} | ${cmp} |`);
            }
            const text = ["### Production secret resolution", "", ...rows, "", missing ? `❌ production job 에서 resolve 안 됨 ${missing}개` : "✅ production job 에서 7개 모두 resolve"].join("\n");
            console.log(text);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + "\n");
            if (missing) process.exit(1);
          '
