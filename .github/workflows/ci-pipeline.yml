name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
    # affected 판정을 **실제 GitHub Actions 에서** 재현하기 위한 입력.
    # 비우면 기존 동작(판정 불가 → full CI)이다.
    inputs:
      base_sha:
        description: '판정 기준 base SHA (비우면 안전 fallback = full CI)'
        required: false
        default: ''
      head_sha:
        description: '판정 기준 head SHA (비우면 현재 SHA)'
        required: false
        default: ''
      # WO-O4O-API-JEST-AFFECTED-TEST-EXECUTION-PHASE0-SHADOW-V1 §13
      # affected selector 를 무시하고 full 로 되돌리는 **유일한** 수동 축.
      full_jest:
        description: 'API Jest affected selector 를 무시하고 full 강제 (true)'
        required: false
        default: ''

# WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1 §17
# 이전 정책(`cancel-in-progress: true`)에서는 **뒤따르는 문서/CHECK commit 이
# 앞의 코드 full CI 를 취소**했다(실측: 619c51a4f · c5f33791a 의 CI Pipeline cancelled).
# main/develop push 의 검증은 끝까지 보존하고, PR 은 새 revision 이 오면 이전 검사가
# obsolete 이므로 취소를 유지한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.18.0'

jobs:
  # 0. Affected scope 판정
  #
  # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
  #   Admin-only 변경(실측: 소스 1 파일 + 문서)에서도 API Server 전체 Jest(약 9분)가
  #   critical path 였다. 판정은 `scripts/ci/detect-affected.mjs` 단일 지점이며
  #   deploy-admin.yml 도 같은 스크립트를 쓴다 — workflow 두 곳에 glob 을 손으로
  #   유지하지 않는다.
  #
  #   판정기는 **의심스러우면 전부 실행**한다. base SHA 이상 · force push ·
  #   shallow history · 매핑 불가 경로 · root manifest · CI 인프라 변경은 모두
  #   global fallback 이라 아래 full CI 경로가 그대로 돈다.
  #   `fetch-depth: 0` 은 multi-commit push batch(`event.before..sha`) 를 통째로
  #   보기 위한 것이다 — `HEAD~1` 비교는 앞쪽 commit 의 변경을 놓친다.
  detect:
    name: Detect affected scope
    runs-on: ubuntu-latest
    outputs:
      admin_affected: ${{ steps.scope.outputs.admin_affected }}
      admin_only: ${{ steps.scope.outputs.admin_only }}
      api_affected: ${{ steps.scope.outputs.api_affected }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      docs_fast_eligible: ${{ steps.scope.outputs.docs_fast_eligible }}
      global_or_unknown: ${{ steps.scope.outputs.global_or_unknown }}
      fallback: ${{ steps.scope.outputs.fallback }}
      web_build_dirs: ${{ steps.scope.outputs.web_build_dirs }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Classify changed scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        HEAD_SHA: ${{ github.event.inputs.head_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      run: node scripts/ci/detect-affected.mjs

  # 1. Code Quality Checks
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: [detect]
    # Admin-only 변경은 아래 admin-fast-* 두 잡이, 문서 Markdown 추가·수정만인 변경은
    # docs-fast-validate 가 대체한다. 그 외에는 전부 여기로 온다.
    if: needs.detect.outputs.admin_only != 'true' && needs.detect.outputs.docs_fast_eligible != 'true'

    steps:
    - uses: actions/checkout@v6
      with:
        # WO-O4O-CI-SPARSE-CHECKOUT-DATA-EXCLUSION-V1: 운영 데이터 manifest
        # (apps/api-server/src/scripts/data, ≈1.25GB · json/jsonl/md 뿐, 코드 0)를 받지 않는다.
        # tsc · ESLint(ts/tsx 만) · guard · test 어느 것도 이 경로를 읽지 않는다. sparse = blob:none 부분 fetch.
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1: 검증 경로에서는 lockfile drift 를 실패로 만든다.
        strict-lockfile: 'true'

    # WO-O4O-TYPES-AUTO-BUILD-GUARD-V1
    # setup-build-env가 이미 pnpm run build:packages를 실행하지만,
    # types/dist가 stale인 채로 type-check가 도는 회귀를 다시 방지하기 위한 명시 가드.
    - name: Build shared types (explicit guard)
      run: pnpm --filter=@o4o/types run build

    - name: Verify types dist freshness
      run: |
        test -f packages/types/dist/index.d.ts || (echo "❌ packages/types/dist/index.d.ts missing" && exit 1)
        test -f packages/types/dist/forum.d.ts || (echo "❌ packages/types/dist/forum.d.ts missing" && exit 1)
        echo "✅ packages/types/dist freshness verified"

    # WO-O4O-CI-FRONTEND-TYPECHECK-PARALLELIZATION-V1
    # 워크스페이스별 tsc(산출물 없음, 서로 독립)를 4개씩 동시에 돌린다 (runner 4 vCPU).
    # 검사 대상 · 명령 · 실패 판정은 직렬과 같고 실행 순서만 바뀐다. 미설정 시 로컬 기본값은 직렬.
    - name: Run TypeScript check (Frontend only)
      env:
        O4O_TYPECHECK_CONCURRENCY: '4'
      run: pnpm run type-check:frontend

    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1: 실제로 green 이므로 blocking 으로 전환.
    # (이전에는 `|| echo` 로 어떤 실패도 흡수했다.)
    - name: Run TypeScript check (App Store packages)
      run: pnpm run typecheck:app-store-packages

    # setup-build-env가 이미 root build:packages를 실행하고, 그 체인에는
    # build:api-deps (`pnpm --filter "@o4o/api-server^..." run build`)가 포함된다.
    # 따라서 같은 quality-check runner에서 API dependency를 다시 빌드하지 않는다.
    # API type-check 자체는 그대로 blocking으로 유지한다.
    - name: Run TypeScript check (api-server)
      run: pnpm --filter @o4o/api-server run type-check

    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1
    #
    # lint 는 아직 **완전 blocking 이 아니다**. 기존 오류 baseline 이 남아 있고(수치 정본은
    # scripts/lint-ratchet.mjs 의 ERROR_BASELINE),
    # 이를 0 으로 만드는 것(대규모 lint 수정)은 이 WO 의 범위가 아니다.
    # 대신 continue-on-error(= 어떤 회귀도 통과) 를 **회귀 차단 ratchet** 으로 바꾼다:
    # 오류 수가 baseline 을 넘으면 실패한다. 즉 신규 오류는 이제 CI 를 막는다.
    #
    # 검사 범위·rule·baseline 갱신 규칙·제거 조건은 모두 scripts/lint-ratchet.mjs 상단 주석 참조.
    - name: Run ESLint (regression ratchet)
      run: node scripts/lint-ratchet.mjs

    # WO-O4O-ADMIN-PARTNEROPS-REGISTRY-PRODUCTDB-AUTH-AND-LINT-GATE-FINAL-CLOSURE-V1 §7
    #
    # admin-dashboard 의 lint 스크립트는 `|| true` 로 끝나 **어떤 결과든 성공**이었고,
    # 위 저장소 ratchet 은 오류만 보고 warning 은 전혀 막지 않았다.
    # `|| true` 를 제거하고 warning 기준선 ratchet(--max-warnings 500)을 건 스크립트를
    # 이 워크스페이스에만 blocking 으로 건다.
    #   - 신규 error 1건 → 즉시 실패 (ESLint 는 오류가 있으면 max-warnings 와 무관하게 exit 1)
    #   - warning 이 기준선 500 을 넘으면 실패
    # 기준선 500 은 실측값이다(545 파일 / 0 errors / 500 warnings —
    # no-unused-vars 447 · react-hooks/exhaustive-deps 53). rule 완화·범위 축소는 하지 않는다.
    # 검사 범위를 `src` 로 넘기는 이유: 이전 `src/**/*.{ts,tsx}` 는 shell 이 확장하면
    # globstar 미적용으로 100 파일(34 warnings)만 검사되어 환경마다 결과가 달랐다.
    # 다른 워크스페이스는 이 단계의 영향을 받지 않는다.
    - name: Run ESLint (admin-dashboard warning ratchet)
      run: pnpm --filter @o4o/admin-dashboard run lint
    
    # WO-O4O-SECURITY-ROUTE-STATIC-GUARD-CI-V1
    # 2026-08-08 사고(/__debug__/** 무인증 노출) 재발 방지. blocking.
    #   R1 GET handler 안의 DB write · R2 권한 하드코딩 · R3 debug/test route 무가드 등록
    # 규칙 본문과 allowlist 는 scripts/check-unsafe-routes.mjs 상단 주석 참조.
    - name: Guard unsafe operational routes
      run: node scripts/check-unsafe-routes.mjs

    # WO-O4O-TYPEORM-ENTITY-REGISTRY-INTEGRITY-GUARD-AND-CI-ADOPTION-V1
    # 2026-08-25 사고(AiEngine/AiQueryPolicy/AiQueryLog 미등록 → /api/ai/admin/** 전면 500) 재발 방지. blocking.
    #   apps/api-server/src/database/entities.ts = runtime entity registry SSOT
    #   정의 ↔ registry 불일치(미등록 · 중복 · stale import · 배열 누락)를 정적으로 차단한다.
    # DB 연결도 secret 도 필요 없는 순수 정적 검사다. 규칙 본문은 scripts/check-typeorm-entities.mjs 상단 주석 참조.
    - name: Guard TypeORM entity registry integrity
      run: node scripts/check-typeorm-entities.mjs

    # WO-O4O-CANONICAL-DATABASE-BOOTSTRAP-AND-INCREMENTAL-MIGRATION-SEPARATION-V1
    # 빈 DB bootstrap(canonical snapshot + o4o_schema_baselines) 과 기존 운영 DB incremental migration 을 분리한다. blocking.
    #   historical 644 migration 파일명/class/name 동결 · incremental manifest 명명(13자리 epoch, 순서 증가, 중복 0)
    #   snapshot schema-only · runner/classifier 금지 패턴(IF NOT EXISTS, DROP CASCADE, synchronize) · 진입점(migrate.ts, connection.ts, package.json, deploy job)
    # DB 연결도 secret 도 필요 없는 순수 정적 검사다. 규칙 본문은 scripts/db/check-migration-contract.mjs 상단 주석 참조.
    #   migration identity(class · declared name · runtime name)는 TypeScript AST(scripts/db/migration-identity.mjs) 단일 parser — 정규식 오탐 금지.
    #   parser fixture + 실제 migration 전수 교차검증은 node --test. --write-historical --maintenance 는 CI 에서 실행 금지(스크립트가 거부).
    - name: Guard canonical bootstrap / incremental migration contract
      run: |
        node scripts/db/check-migration-contract.mjs
        node --test scripts/db/__tests__/migration-identity.test.mjs
        node --test scripts/db/__tests__/setup-local-db-credential-log.test.mjs

    # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
    # 검사 내용은 무수정으로 scripts/ci/check-console-log.sh 로 옮겼다.
    # Admin-only fast path 가 같은 게이트를 `apps/admin-dashboard/` 범위로 재사용한다 —
    # 같은 grep 을 YAML 두 곳에 복사해 두면 한쪽만 고쳐지는 drift 가 생긴다.
    - name: Check for console.log statements
      run: bash scripts/ci/check-console-log.sh apps/

    # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
    # affected scope 판정기(`scripts/ci/detect-affected.mjs`) 회귀 시험. blocking.
    # Admin closure 가 graph 에서 나오는지 · 무관 package 가 Admin 을 깨우지 않는지 ·
    # 판정 불가 입력이 전부 full CI 로 fallback 하는지 · multi-commit push batch 를
    # 놓치지 않는지를 고정한다. 의존성 · DB · secret 0 (Node 22 내장 runner).
    # `scripts/**` 변경은 판정기가 global 로 취급하므로 이 단계는 항상 이 잡에서 돈다.
    # WO-O4O-CICD-SAFE-AUTODEPLOY-AND-RISK-GATE-V1: 배포 위험 판정 · CI gate · revision rollout · optional env
    # 회귀 시험을 같은 runner 로 blocking 연결한다 (의존성 · 네트워크 · GCP 0 — gcloud/HTTP 는 주입 대체).
    - name: Run tests (CI affected-scope detector node:test)
      run: >-
        node --test
        scripts/ci/__tests__/detect-affected.test.mjs
        scripts/ci/__tests__/deploy-risk.test.mjs
        scripts/ci/__tests__/ci-gate.test.mjs
        scripts/ci/__tests__/cloud-run-rollout.test.mjs
        scripts/ci/__tests__/cloud-run-env.test.mjs
        scripts/ci/__tests__/deploy-workflow-gates.test.mjs
        scripts/ci/__tests__/deploy-workflow-diff.test.mjs
        scripts/ci/__tests__/deploy-orchestrate.test.mjs

    # WO-O4O-LOCAL-DATA-TOOL-BRIDGE-CLOSURE-V1 §22
    # Local Work Agent 는 런타임 의존성 0(package.json 없음)이라 jest 대상이 아니다.
    # 로컬 SQLite 계약(node:sqlite DatabaseSync, key/setting allowlist, 임의 SQL·파일 부재)을
    # Node 내장 test runner 로 blocking 검증한다. Node 22 내장이라 설치·DB·secret 불필요.
    # Node 22.18.0 에서 `node --test <dir>` 는 실패하므로 파일을 명시한다(실측 확인).
    # WO-O4O-BROWSER-DOM-CONTROL-V0 §54: Chrome Extension / Native Bridge 계약 사본 대조와 DOM relay ·
    # host 라우팅 · content-script 소스 잠금을 같은 runner 로 blocking 검증한다(의존성 0, 파일 명시).
    - name: Run tests (o4o-local-agent node:test)
      run: node --test tools/o4o-local-agent/test/local-db.test.mjs tools/o4o-local-agent/test/native-bridge.test.mjs tools/o4o-local-agent/test/browser-dom.test.mjs

    - name: Run tests (admin-dashboard Vitest, serial to prevent OOM)
      run: cd apps/admin-dashboard && npx vitest run --passWithNoTests --pool=forks --poolOptions.forks.maxForks=1

    - name: Run tests (multi-tenant Vitest)
      run: cd apps/api-server/tests/multi-tenant && npx vitest run --passWithNoTests

    # WO-O4O-UI-VITEST-CI-ADOPTION-AND-PLATFORMONLY-MENU-GUARD-REGRESSION-V1
    # packages/ui 의 vitest 는 config 만 있고 CI 에 연결돼 있지 않아 로컬 전용이었다.
    # 공통 operator UI(4서비스 공유)의 회귀를 CI 에서 잡는다. blocking.
    #   - filterMenuByRole 메뉴 가시성 계약 (adminOnly / platformOnly / 2-인자 하위호환)
    #   - UserDetailPage 비밀번호 모달 serviceKey 선택
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom/@testing-library 를 그대로 쓴다.
    - name: Run tests (packages/ui Vitest)
      run: npx vitest run --config packages/ui/vitest.config.mjs

    # WO-O4O-PACKAGE-LEVEL-VITEST-CI-ADOPTION-FULL-CENSUS-AND-CLOSURE-V1
    # vitest.config.mjs 만 있고 workflow step 이 없어 로컬 전용이던 package-level 테스트
    # 6개(18 파일 · 248 tests) 를 blocking 으로 연결한다. 실패 패키지를 즉시 식별하기 위해
    # 개별 step 으로 둔다. 모든 config 가 passWithNoTests: false 라 무실행 통과가 불가능하다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom/@testing-library 를 그대로 쓴다.
    #   auth-utils       비밀번호 정책 · 오류 메시지 (17)
    #   auth-react       라우트 가드 · 역할 선택 · 서비스 인증 (44)
    #   auth-context     account display · admin role display · authorization separation (7)
    #   store-ui-core    My Store parity 계약 (18)
    #   operator-core-ui community/content-hub 콘솔 · resources lifecycle (53)
    #   shared-space-ui  forum write shell · community nav · guide 계약 (109)
    #
    # WO-O4O-IDENTITY-ACCOUNT-DISPLAY-AND-DOCUMENT-ALIGNMENT-V1 (2026-09-24, 사용자 승인):
    #   auth-context 가 이번 WO 에서 config/test 를 갖게 되어 같은 정책에 한 패키지를 추가한다.
    #   표시/인가 분리와 role 배열 permutation 불변을 고정하는 계약이라 로컬 전용으로 두지 않는다.

    - name: Run tests (auth-utils Vitest)
      run: npx vitest run --config packages/auth-utils/vitest.config.mjs

    - name: Run tests (auth-react Vitest)
      run: npx vitest run --config packages/auth-react/vitest.config.mjs

    # ⚠️ 위 5개 형제 step 과 달리 `npx` 가 아니라 `pnpm exec` 를 쓴다.
    #   SonarCloud 가 **새로 추가된 줄**에만 적용하는 보안 규칙 때문이다:
    #     githubactions:S6505 — npx 는 on-demand 설치 + lifecycle script 실행이 가능하다
    #     githubactions:S8543 — 정확한 패키지 버전을 고정하라
    #   `pnpm exec` 는 **이미 설치된 로컬 바이너리만 실행**하므로 on-demand 설치 경로가 없다.
    #   기존 5개 step 은 이 WO 의 변경 대상이 아니라 그대로 두었다(같은 형태로 정렬하는 것은 별건).
    - name: Run tests (auth-context Vitest)
      run: pnpm exec vitest run --config packages/auth-context/vitest.config.mjs

    - name: Run tests (store-ui-core Vitest)
      run: npx vitest run --config packages/store-ui-core/vitest.config.mjs

    - name: Run tests (operator-core-ui Vitest)
      run: npx vitest run --config packages/operator-core-ui/vitest.config.mjs

    - name: Run tests (shared-space-ui Vitest)
      run: npx vitest run --config packages/shared-space-ui/vitest.config.mjs

    # WO-O4O-PACKAGE-JEST-CI-ADOPTION-FULL-CENSUS-AND-CLOSURE-V1
    # package-local jest.config.cjs 만 있고 workflow step 이 없어 로컬 전용이던
    # package-level Jest 3개(6 파일 · 96 tests) 를 blocking 으로 연결한다.
    # 실패 패키지를 즉시 식별하기 위해 개별 step 으로 둔다.
    # --passWithNoTests 를 쓰지 않으므로 test discovery 가 비면 exit 1 이다(실측 확인).
    # DB · secret 불필요. 루트에 설치된 jest/ts-jest 를 그대로 쓴다.
    #   asset-copy-core    권한 체크 · 스냅샷 · 크로스서비스 격리 (4 파일 · 64)
    #   account-ui         사용자 표시명 공통화 계약 (1 파일 · 20)
    #   appearance-system  버튼/브레드크럼/스크롤탑 CSS 생성 (1 파일 · 12)

    - name: Run tests (asset-copy-core Jest)
      run: cd packages/asset-copy-core && npx jest --config jest.config.cjs

    - name: Run tests (account-ui Jest)
      run: cd packages/account-ui && npx jest --config jest.config.cjs

    - name: Run tests (appearance-system Jest)
      run: cd packages/appearance-system && NODE_OPTIONS=--experimental-vm-modules npx jest --config jest.config.cjs

    # WO-O4O-KPA-INTEREST-PRODUCT-WORKTABLE-TO-CANONICAL-CART-ADOPTION-V1
    # 관심상품 작업대 행 → canonical store_cart_items payload 및 "주문 가능" 판정 계약
    # (offerId 동등 비교만 · 이름/SKU heuristic 0 · event_offer/seller_recruitment 축 분리 ·
    #  표시용 가격 · organizationId 미전송)을 CI 에서 고정한다. blocking.
    # KPA 에도 테스트 실행 경로가 없었다 — 이 축은 잘못되면 미승인 offer 나 이벤트오퍼 축이
    # 조용히 B2B 주문 경로로 새어 들어간다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom 을 그대로 쓴다.
    - name: Run tests (web-kpa-society Vitest)
      run: npx vitest run --config services/web-kpa-society/vitest.config.mjs

    # WO-O4O-WINDOWS-APP-WINDOW-CONTROL-V0 §5 (선행 작업)
    # services/web-neture 의 Local Work Agent 연결 카드 회귀 테스트는
    # vitest.config.mjs 만 있고 workflow step 이 없어 로컬 전용이었다.
    # LNA 미허용 / agent 미실행 / 정상 연결을 구분하는 안내·재시도 UX 는
    # 조용히 깨지는 축이라 blocking 으로 연결한다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom 을 그대로 쓴다.
    - name: Run tests (web-neture Vitest)
      run: npx vitest run --config services/web-neture/vitest.config.mjs

    # WO-O4O-SERVICE-IDENTITY-AND-OPERATOR-SCOPE-V1
    # services/web-kpa-branch 에는 테스트 실행 경로가 없었다. 분회 개설 신청의 예약어 주소
    # (backend branch-slug-policy · App.tsx 고정 route 와의 정합) · 심사/신청 API 경로 ·
    # 서비스 관리자 화면 게이트를 고정한다. 예약어가 어긋나면 분회 주소가 고정 화면을 가린다. blocking.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom 을 그대로 쓴다.
    - name: Run tests (web-kpa-branch Vitest)
      run: pnpm exec vitest run --config services/web-kpa-branch/vitest.config.mjs

  # 2. API Jest regression gate
  # The suite remains fully blocking and serial (--maxWorkers=1) to preserve the
  # existing OOM protection. Moving it to its own runner only changes wall-clock
  # scheduling: it can execute in parallel with the other quality checks.
  #
  # WO-O4O-CI-API-JEST-SHARD-PARALLELIZATION-V1
  # 전체 suite 를 3 runner 에 **분할(shard)** 해 동시에 돌린다. 선별(affected)이 아니다 —
  # `--shard=i/N` 은 전체 test 목록을 N 등분해 i 번째를 돌리므로 N 개 shard 의 합집합이
  # 곧 전체다. 각 shard 안은 계속 --maxWorkers=1 직렬이라 OOM 보호도 그대로다.
  # fail-fast: false — 한 shard 의 실패가 다른 shard 를 취소해 실패 suite 목록을
  # 가리지 않게 한다(Phase 0 shadow false-negative 대조에 전체 실패 목록이 필요하다).
  api-tests:
    name: API Server Jest (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [detect]
    # Admin-only 변경에서는 전체 suite 대신 admin-fast-guards 가
    # **Admin 소스를 읽는 정적 guard spec** 만 선별해 돌린다(범위 축소가 아니라 선별).
    # docs fast 도 같은 원리다 — docs-fast-validate 가 **그 문서를 읽는 test** 만 선별한다.
    if: needs.detect.outputs.admin_only != 'true' && needs.detect.outputs.docs_fast_eligible != 'true'
    strategy:
      fail-fast: false
      matrix:
        # shard 수를 바꾸면 아래 `--shard=...` 의 분모와 이 목록을 함께 바꾼다
        # (detect-affected.test.mjs J17 이 1..N 연속성을 검사한다).
        shard: [1, 2, 3]

    steps:
    # shard 1 만 shadow selector 를 돌리므로 full history 가 필요하다.
    # WO-O4O-CI-SPARSE-CHECKOUT-DATA-EXCLUSION-V1: shard 1 은 **기존 그대로** 둔다 —
    # blob:none 이면 selector 의 `git diff` rename 판정이 blob 을 1개씩 지연 fetch 할 수 있고,
    # Phase 0 shadow 관측 조건을 바꾸지 않기 위해서다.
    - uses: actions/checkout@v6
      if: matrix.shard == 1
      with:
        # detect · docs-fast · admin-fast 와 같은 기준이다.
        # shallow checkout 이면 base SHA object 가 없어 아래 shadow selector 가
        # 항상 "변경 파일 수집 실패 → full" 로만 떨어져 관측 데이터가 쌓이지 않는다.
        fetch-depth: 0

    # shard 2..N 은 history 가 필요 없다 — shallow + 운영 데이터 manifest 제외.
    - uses: actions/checkout@v6
      if: matrix.shard != 1
      with:
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        build-packages: 'false'

    - name: Build api-server workspace dependencies
      run: pnpm --filter '@o4o/api-server^...' run build

    # WO-O4O-API-JEST-AFFECTED-TEST-EXECUTION-PHASE0-SHADOW-V1 §14 · §15
    #
    # **Phase 0 은 shadow 다.** 아래 selector 는 "돌았어야 할 suite 목록" 만 계산하고,
    # 실제 Jest 실행 범위는 **건드리지 않는다**(바로 아래 step 은 그대로 전체 실행).
    # full 이 실패하면 "그 실패 suite 가 shadow 선택 안에 있었는가" 를 artifact 로
    # 대조할 수 있고, 그 대조에서 false-negative 0 이 확인돼야 Phase 1 로 간다.
    # selector 자체의 실패가 Jest gate 를 깨뜨리면 안 되므로 continue-on-error 다.
    # selector 는 shard 와 무관한 run 단위 계산이므로 shard 1 에서만 한 번 계산·업로드한다
    # (shard 마다 올리면 같은 artifact 이름이 충돌한다).
    - name: Calculate API Jest affected set (shadow)
      id: api-jest-shadow
      if: matrix.shard == 1
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        HEAD_SHA: ${{ github.sha }}
        # §13 manual override — 축은 하나만 둔다 (workflow_dispatch 입력).
        FULL_JEST: ${{ github.event.inputs.full_jest }}
      run: |
        mkdir -p shadow
        node scripts/ci/detect-affected.mjs --mode=api-jest | tee shadow/api-jest-shadow.json
        node -e "
          const r = require('./shadow/api-jest-shadow.json');
          const ratio = r.fullSuiteCount ? (r.selectedSuiteCount / r.fullSuiteCount * 100).toFixed(1) : 'n/a';
          console.log('--- API Jest affected (SHADOW — 실행에는 영향 없음) ---');
          console.log('mode                :', r.mode);
          console.log('reason              :', r.reason);
          console.log('changed files       :', r.changedFiles.length);
          console.log('components          :', JSON.stringify(r.components));
          console.log('selected / full     :', r.selectedSuiteCount, '/', r.fullSuiteCount, '(' + ratio + '%)');
          for (const p of r.specs) console.log('  +', p);
        "

    - name: Upload API Jest shadow selection
      if: always() && matrix.shard == 1
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: api-jest-shadow-${{ github.run_id }}-${{ github.run_attempt }}
        path: shadow/api-jest-shadow.json
        retention-days: 30
        if-no-files-found: ignore

    # Phase 0 에서는 selector 결과와 무관하게 **항상 전체**를 돌린다.
    # 이 명령의 **선별 범위**는 Phase 1 승인 전까지 바뀌지 않는다.
    # `--shard` 는 범위가 아니라 분할이다 — 3 shard 의 합집합이 전체 suite 다.
    - name: Run tests (api-server Jest, serial to prevent OOM)
      run: cd apps/api-server && npx jest --maxWorkers=1 --shard=${{ matrix.shard }}/3

  # 3. Build all applications
  #
  # WO-O4O-CI-BUILD-JOB-PARALLELIZATION-V1
  # build 는 quality-check · api-tests 의 산출물을 쓰지 않는다(각자 별도 runner 에서
  # 독립 install + dependency closure build). 과거 `needs: [quality-check, api-tests]` 는
  # 검증 게이트가 아니라 순서만 강제해 critical path 에 build 시간을 직렬로 더했다.
  # 세 잡은 모두 blocking 이며 run 결과는 셋 중 하나라도 실패하면 실패다 — 병렬화로 약해지는 게이트는 없다.
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.admin_only != 'true' && needs.detect.outputs.docs_fast_eligible != 'true'

    # build matrix 대상은 배포되는 앱만 유지한다.
    # WO-O4O-MAIN-SITE-FULL-SOURCE-DELETION-V1 에서 은퇴 앱이 소스째 삭제되어
    # 기존 matrix 제외 근거 주석도 함께 제거했다.
    strategy:
      matrix:
        app: [admin-dashboard]
    
    steps:
    - uses: actions/checkout@v6
      with:
        # WO-O4O-CI-SPARSE-CHECKOUT-DATA-EXCLUSION-V1: 운영 데이터 manifest
        # (apps/api-server/src/scripts/data, ≈1.25GB · json/jsonl/md 뿐, 코드 0)를 받지 않는다.
        # tsc · ESLint(ts/tsx 만) · guard · test 어느 것도 이 경로를 읽지 않는다. sparse = blob:none 부분 fetch.
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        # 검증 경로에서는 lockfile drift 를 실패로 만든다. 패키지 빌드는 아래에서
        # Admin Dashboard 의 실제 transitive dependency closure 만 수행한다.
        strict-lockfile: 'true'
        build-packages: 'false'

    - name: Build admin workspace dependencies
      run: |
        echo "🔨 Building Admin Dashboard workspace dependencies..."
        pnpm --filter '@o4o/admin-dashboard^...' run build
        echo "✅ Admin Dashboard dependency closure built successfully"

    # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
    # 이 잡은 위에서 이미 frozen install + Admin dependency closure build 를 끝냈다.
    # 표식이 없던 기존 경로에서는 이 스크립트가 **build:packages 전체 + install 을
    # 다시** 실행했다 (같은 runner 안의 중복). 표식을 넘겨 재실행을 막는다 —
    # 스크립트의 standalone 동작(로컬 · 수동)은 그대로다.
    - name: Build ${{ matrix.app }}
      env:
        O4O_PACKAGES_PREBUILT: '1'
      run: bash scripts/ci-build-app.sh ${{ matrix.app }}

    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1
    # 이 continue-on-error 는 **의도적으로 유지**한다.
    # 검증이 아니라 산출물 업로드이며(빌드는 이미 위에서 성공), 업로드 실패는
    # 코드 결함이 아니라 인프라 이슈다. 즉 결함을 숨기지 않는다.
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ${{ matrix.app }}-dist
        path: |
          apps/${{ matrix.app }}/dist
          apps/${{ matrix.app }}/build
        retention-days: 7

  # 3-b. Web production build (affected)
  #
  # WO-O4O-CICD-UNIFIED-DELIVERY-PIPELINE-V1 P4 — "CI green ≠ 배포 가능" 해소의 최소안.
  #   Web 서비스의 production 산출물은 각 Dockerfile 의 `npx vite build` 에서만 만들어졌다 — CI 는 tsc 까지만 봐서
  #   vite build 실패(번들 · 자산 · 플러그인 · import 해석)가 **배포 job 에서 처음** 드러났다.
  #   여기서 Dockerfile 과 같은 명령(`npx vite build`)을 **배포 판정과 같은 축**(detect-affected 의 web 배포 영향)으로
  #   affected 서비스만 돌린다. CI 의 build 잡(admin ≈2.5분)처럼 critical path(Code Quality ≈10분) 옆에서 병렬이다.
  #   산출물은 버리고 판정만 한다 — 같은 artifact 를 승격하는 것은 WO-O4O-CICD-ARTIFACT-PROMOTION-V1 범위다.
  #   build-arg(VITE_*)는 주입하지 않는다 — vite 는 미지정 env 를 undefined 로 inline 하며 빌드 성패에 영향이 없다.
  web-build:
    name: Web production build (affected)
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      needs.detect.outputs.admin_only != 'true' && needs.detect.outputs.docs_fast_eligible != 'true' &&
      needs.detect.outputs.web_build_dirs != '' && needs.detect.outputs.web_build_dirs != '[]'
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        build-packages: 'false'

    - name: Build affected web services (dependency closure → vite build)
      env:
        WEB_BUILD_DIRS: ${{ needs.detect.outputs.web_build_dirs }}
      run: |
        set -euo pipefail
        mapfile -t DIRS < <(node -e 'for (const d of JSON.parse(process.env.WEB_BUILD_DIRS)) console.log(d)')
        FILTERS=()
        for d in "${DIRS[@]}"; do
          name=$(node -p "require('./$d/package.json').name")
          FILTERS+=(--filter "${name}^...")
        done
        echo "🔨 dependency closure: ${FILTERS[*]}"
        pnpm "${FILTERS[@]}" run build
        for d in "${DIRS[@]}"; do
          echo "::group::vite build ${d}"
          start=$(date +%s)
          (cd "$d" && npx vite build --outDir "$RUNNER_TEMP/web-build/$(basename "$d")" --emptyOutDir)
          echo "::endgroup::"
          echo "| ${d} | ✅ $(( $(date +%s) - start ))s |" >> "$RUNNER_TEMP/web-build.md"
        done
        { echo "### Web production build (affected)"; echo ""; echo "| service | vite build |"; echo "|---|---|"; cat "$RUNNER_TEMP/web-build.md"; } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # 4. Docs-only fast path
  #
  # WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1
  #
  # 문서 Markdown **추가·수정만** 있는 push 에서 실행된다(판정: detect).
  # 실측 기준선: docs-only commit 63c36e11e 에서도 CI 14분 09초 + CodeQL 7분 32초가 돌았다.
  #
  # 무엇을 **줄이지 않았는지** 명시한다:
  #   - 변경 문서를 **실제로 읽는** api-server test 는 전부 선별해 그대로 돌린다
  #     (`--mode=docs-specs`. 전수 조사 §9 결과: 기록물 보존 guard · 정본 존재 단언 ·
  #      nested 위치의 test 까지 재귀 탐색)
  #   - 판정기 자체의 회귀 시험(node:test)은 여기서도 blocking 으로 돈다
  #   - 문서 **삭제 · 이동**, docs 안의 **데이터 자산(JSON/CSV/YAML)**, 코드 혼합은
  #     이 경로로 오지 않는다 — 전부 위의 기존 full/affected 경로다
  #
  # 건너뛰는 것은 Markdown 문서 추가·수정이 **닿을 수 없는** 축뿐이다:
  #   type-check · ESLint · entity/migration/route guard · 각 package Vitest/Jest ·
  #   API 전체 Jest · Admin production build.
  docs-fast-validate:
    name: Docs Fast — docs consumer tests
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.docs_fast_eligible == 'true'

    steps:
    - uses: actions/checkout@v6
      with:
        # detect 와 같은 기준으로 push batch 전체를 본다.
        fetch-depth: 0

    # 저장소 전체 build:packages 도 Admin/API build 도 하지 않는다.
    # 선별된 test 는 ts-jest 가 소스를 직접 변환하며(모듈 매핑은 jest.config.cjs 의
    # moduleNameMapper 가 src 로 건다), 나머지는 순수 fs 정적 guard 다.
    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        build-packages: 'false'

    # docs 축 판정 자체의 회귀(Case D1~D10)를 여기서도 막는다.
    - name: Run tests (CI affected-scope detector node:test)
      run: node --test scripts/ci/__tests__/detect-affected.test.mjs

    - name: Select docs consumer tests
      id: select
      env:
        BASE_SHA: ${{ github.event.inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        HEAD_SHA: ${{ github.event.inputs.head_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      run: |
        VERDICT=$(node scripts/ci/detect-affected.mjs | awk -F': *' '/^docs_fast_eligible/{print $2}')
        SPECS=$(node scripts/ci/detect-affected.mjs --mode=docs-specs)
        echo "docs_fast_eligible(재확인): ${VERDICT}"
        echo "선별된 docs consumer test: ${SPECS:-<없음>}"
        echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
        echo "specs=${SPECS}" >> "$GITHUB_OUTPUT"

    # 이 잡 안에서 판정이 재현되지 않으면(=detect 와 결론이 다르면) 선별을 믿지 않고
    # 전체 suite 로 되돌린다. 빈 선별 자체는 정상이다 — 그 문서를 읽는 test 가 없다는 뜻이다.
    - name: Run docs consumer tests (api-server Jest)
      env:
        VERDICT: ${{ steps.select.outputs.verdict }}
        SPECS: ${{ steps.select.outputs.specs }}
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        if [ "$VERDICT" != "true" ]; then
          echo "⚠️ 이 잡에서 docs fast 판정이 재현되지 않았습니다 — 안전하게 전체 suite 를 실행합니다"
          pnpm --filter '@o4o/api-server^...' run build
          cd apps/api-server && npx jest --maxWorkers=1
        elif [ -z "${SPECS// /}" ]; then
          echo "✅ 변경 문서를 읽는 test 가 없습니다 (선별 0건)"
        else
          cd apps/api-server && npx jest --maxWorkers=1 $SPECS
        fi

  # ===========================================================================
  # 4. Admin-only fast path
  #
  # WO-O4O-ADMIN-CI-CD-AFFECTED-SCOPE-AND-DUPLICATE-WORK-REDUCTION-V1
  #
  # 코드 변경이 `apps/admin-dashboard/**` 에만 있고 나머지가 문서 추가·수정뿐일 때만
  # 실행된다(판정: detect). 아래 두 잡은 **병렬**이며 quality-check / api-tests /
  # build 를 대체한다.
  #
  # 무엇을 **줄이지 않았는지** 명시한다:
  #   - Admin 의 type-check · ESLint · Vitest · production build 는 전부 유지
  #   - ESLint 범위는 오히려 넓어졌다: 기존 `admin-dashboard` 의 lint script 는
  #     `src` 만 봤고, 여기서는 워크스페이스 전체(`apps/admin-dashboard`)를 본다.
  #     error 1건이면 즉시 실패, warning 기준선은 기존과 같은 500 이다.
  #   - console.log 게이트는 같은 스크립트를 Admin 범위로 실행
  #   - **Admin 소스를 raw text 로 읽는 api-server 정적 guard spec** 은
  #     admin-fast-guards 가 선별해 그대로 돌린다 (은퇴 패턴 재유입 차단 유지)
  #
  # 건너뛰는 것은 Admin-only 변경이 **닿을 수 없는** 축뿐이다:
  #   api-server type-check / entity · migration · route guard / multi-tenant ·
  #   KPA · Neture · Admin closure 밖 package 테스트 / local-agent node:test.
  admin-fast-validate:
    name: Admin Fast — validate & build
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.admin_only == 'true'

    steps:
    - uses: actions/checkout@v6
      with:
        # WO-O4O-CI-SPARSE-CHECKOUT-DATA-EXCLUSION-V1: 운영 데이터 manifest
        # (apps/api-server/src/scripts/data, ≈1.25GB · json/jsonl/md 뿐, 코드 0)를 받지 않는다.
        # tsc · ESLint(ts/tsx 만) · guard · test 어느 것도 이 경로를 읽지 않는다. sparse = blob:none 부분 fetch.
        sparse-checkout: |
          /*
          !/apps/api-server/src/scripts/data/
        sparse-checkout-cone-mode: false

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        # 저장소 전체 build:packages 대신 아래에서 Admin closure 만 빌드한다.
        build-packages: 'false'

    - name: Build admin workspace dependencies
      run: |
        echo "🔨 Building Admin Dashboard workspace dependencies..."
        pnpm --filter '@o4o/admin-dashboard^...' run build
        echo "✅ Admin Dashboard dependency closure built successfully"

    # WO-O4O-TYPES-AUTO-BUILD-GUARD-V1 과 동일한 stale dist 가드.
    - name: Verify types dist freshness
      run: |
        test -f packages/types/dist/index.d.ts || (echo "❌ packages/types/dist/index.d.ts missing" && exit 1)
        test -f packages/types/dist/forum.d.ts || (echo "❌ packages/types/dist/forum.d.ts missing" && exit 1)
        echo "✅ packages/types/dist freshness verified"

    - name: Run TypeScript check (admin-dashboard)
      run: pnpm --filter @o4o/admin-dashboard run type-check

    # 기존 `@o4o/admin-dashboard` lint script 와 동일한 config · 동일한 warning
    # 기준선(500)이며 검사 범위만 `src` → 워크스페이스 전체로 넓혔다.
    # ESLint 는 error 가 1건이라도 있으면 --max-warnings 와 무관하게 exit 1 이다.
    - name: Run ESLint (admin workspace, error 0 + warning ratchet)
      run: npx eslint apps/admin-dashboard --report-unused-disable-directives --max-warnings 500

    - name: Check for console.log statements (admin-dashboard)
      run: bash scripts/ci/check-console-log.sh apps/admin-dashboard/

    - name: Run tests (admin-dashboard Vitest, serial to prevent OOM)
      run: cd apps/admin-dashboard && npx vitest run --passWithNoTests --pool=forks --poolOptions.forks.maxForks=1

    # install 1회 · dependency closure build 1회 · Admin build 1회.
    # 표식이 없으면 스크립트가 build:packages 전체와 install 을 다시 돌린다.
    - name: Build admin-dashboard
      env:
        O4O_PACKAGES_PREBUILT: '1'
      run: bash scripts/ci-build-app.sh admin-dashboard

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: admin-dashboard-dist
        path: |
          apps/admin-dashboard/dist
          apps/admin-dashboard/build
        retention-days: 7

  # api-server 의 정적 guard spec 중 **이번 변경 경로를 raw text 로 읽는 것**만 선별해
  # 돌린다. 이 spec 들은 import 가 아니라 `fs.readFileSync('apps/admin-dashboard/...')`
  # 로 남의 워크스페이스 소스를 훑어 은퇴 패턴 재유입을 막는다 —
  # jest `--findRelatedTests` 는 모듈 그래프만 보므로 이 축을 전부 놓친다.
  # 선별이 비면(판정 실패) 전체 suite 로 되돌린다.
  admin-fast-guards:
    name: Admin Fast — repo static guards
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.admin_only == 'true'

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        build-packages: 'false'

    - name: Select api-server static guard specs
      id: select
      env:
        BASE_SHA: ${{ github.event.inputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        HEAD_SHA: ${{ github.event.inputs.head_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      run: |
        SPECS=$(node scripts/ci/detect-affected.mjs --mode=guard-specs)
        echo "선별된 spec: ${SPECS:-<없음 — 전체 suite 로 fallback>}"
        echo "specs=${SPECS}" >> "$GITHUB_OUTPUT"

    # 실행 모델은 기존 API Jest 게이트와 동일하다 (--maxWorkers=1, OOM 보호 유지).
    - name: Run api-server static guard specs
      env:
        SPECS: ${{ steps.select.outputs.specs }}
        NODE_OPTIONS: --max-old-space-size=6144
      run: |
        if [ -z "${SPECS// /}" ]; then
          echo "⚠️ spec 선별 실패 — 안전하게 전체 suite 를 실행합니다"
          pnpm --filter '@o4o/api-server^...' run build
          cd apps/api-server && npx jest --maxWorkers=1
        else
          cd apps/api-server && npx jest --maxWorkers=1 $SPECS
        fi

  # Docs 민감정보 guard — WO-O4O-DOCS-SECURITY-SEPARATION-AND-INTAKE-RULES-V1
  #
  #   저장소가 Public 이므로 docs 의 개인 메일 · 휴대전화 · 공인 IP 를 막는다. 규칙 본문은
  #   scripts/check-doc-sensitive.mjs 상단 주석. affected scope 와 무관하게 **항상** 실행한다 —
  #   docs fast · admin fast · full 어느 경로로 가도 같은 검사를 받는다. 의존성 설치 없이 node 내장 모듈과 git 만 쓴다.
  docs-sensitive-guard:
    name: Docs sensitive info guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          /docs/
          /scripts/check-doc-sensitive.mjs
        sparse-checkout-cone-mode: false
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Guard docs sensitive info
      run: node scripts/check-doc-sensitive.mjs

  # 최종 CI Gate — WO-O4O-CI-CANONICAL-FINAL-GATE-AND-REQUIRED-CHECK-READINESS-V1
  #
  #   위 job 들은 affected scope 에 따라 서로 배타적으로 skip 되고, matrix job 은 표시 이름이 바뀐다.
  #   그래서 PR 마다 항상 같은 이름으로 생기는 check 가 없었다. 이 job 이 그 하나다(required status check 대상).
  #   새 검사를 하지 않고 결과만 모은다: success · skipped = 통과, failure · cancelled = 실패.
  #   "실행돼야 했는데 skip" 판정은 detect(detect-affected.mjs) 책임이다 — 여기서 다시 판정하지 않는다.
  #
  #   `if: always()` 여야 한다. `!cancelled()` 로 두면 run 취소 시 gate 가 skipped 가 되고,
  #   GitHub 는 skipped required check 를 통과로 본다 → CI 없이 merge 가능해진다.
  #   job 을 추가하면 needs 에도 추가한다.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [detect, quality-check, api-tests, build, web-build, docs-fast-validate, admin-fast-validate, admin-fast-guards, docs-sensitive-guard]
    if: always()
    timeout-minutes: 5
    steps:
    - name: Upstream CI job results
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: echo "$NEEDS"
    # 판정은 외부 도구 없이 expression 하나로 한다 — 도구 부재로 판정이 비면 통과(fail-open)가 되기 때문.
    - name: Fail when any upstream CI job failed or was cancelled
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "::error::CI Gate FAIL — failure 또는 cancelled 인 upstream job 이 있다 (위 결과 참조)"
        exit 1
    - name: CI Gate PASS
      run: echo "모든 upstream CI job 이 success 또는 skipped"