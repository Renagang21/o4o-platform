name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.18.0'

jobs:
  # 1. Code Quality Checks
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1: 검증 경로에서는 lockfile drift 를 실패로 만든다.
        strict-lockfile: 'true'

    # WO-O4O-TYPES-AUTO-BUILD-GUARD-V1
    # setup-build-env가 이미 pnpm run build:packages를 실행하지만,
    # types/dist가 stale인 채로 type-check가 도는 회귀를 다시 방지하기 위한 명시 가드.
    - name: Build shared types (explicit guard)
      run: pnpm --filter=@o4o/types run build

    - name: Verify types dist freshness
      run: |
        test -f packages/types/dist/index.d.ts || (echo "❌ packages/types/dist/index.d.ts missing" && exit 1)
        test -f packages/types/dist/forum.d.ts || (echo "❌ packages/types/dist/forum.d.ts missing" && exit 1)
        echo "✅ packages/types/dist freshness verified"

    - name: Run TypeScript check (Frontend only)
      run: pnpm run type-check:frontend

    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1: 실제로 green 이므로 blocking 으로 전환.
    # (이전에는 `|| echo` 로 어떤 실패도 흡수했다.)
    - name: Run TypeScript check (App Store packages)
      run: pnpm run typecheck:app-store-packages

    # setup-build-env가 이미 root build:packages를 실행하고, 그 체인에는
    # build:api-deps (`pnpm --filter "@o4o/api-server^..." run build`)가 포함된다.
    # 따라서 같은 quality-check runner에서 API dependency를 다시 빌드하지 않는다.
    # API type-check 자체는 그대로 blocking으로 유지한다.
    - name: Run TypeScript check (api-server)
      run: pnpm --filter @o4o/api-server run type-check

    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1
    #
    # lint 는 아직 **완전 blocking 이 아니다**. 기존 오류 baseline 102건이 남아 있고,
    # 이를 0 으로 만드는 것(대규모 lint 수정)은 이 WO 의 범위가 아니다.
    # 대신 continue-on-error(= 어떤 회귀도 통과) 를 **회귀 차단 ratchet** 으로 바꾼다:
    # 오류 수가 baseline 을 넘으면 실패한다. 즉 신규 오류는 이제 CI 를 막는다.
    #
    # 검사 범위·rule·baseline 갱신 규칙·제거 조건은 모두 scripts/lint-ratchet.mjs 상단 주석 참조.
    - name: Run ESLint (regression ratchet)
      run: node scripts/lint-ratchet.mjs

    # WO-O4O-ADMIN-PARTNEROPS-REGISTRY-PRODUCTDB-AUTH-AND-LINT-GATE-FINAL-CLOSURE-V1 §7
    #
    # admin-dashboard 의 lint 스크립트는 `|| true` 로 끝나 **어떤 결과든 성공**이었고,
    # 위 저장소 ratchet 은 오류만 보고 warning 은 전혀 막지 않았다.
    # `|| true` 를 제거하고 warning 기준선 ratchet(--max-warnings 500)을 건 스크립트를
    # 이 워크스페이스에만 blocking 으로 건다.
    #   - 신규 error 1건 → 즉시 실패 (ESLint 는 오류가 있으면 max-warnings 와 무관하게 exit 1)
    #   - warning 이 기준선 500 을 넘으면 실패
    # 기준선 500 은 실측값이다(545 파일 / 0 errors / 500 warnings —
    # no-unused-vars 447 · react-hooks/exhaustive-deps 53). rule 완화·범위 축소는 하지 않는다.
    # 검사 범위를 `src` 로 넘기는 이유: 이전 `src/**/*.{ts,tsx}` 는 shell 이 확장하면
    # globstar 미적용으로 100 파일(34 warnings)만 검사되어 환경마다 결과가 달랐다.
    # 다른 워크스페이스는 이 단계의 영향을 받지 않는다.
    - name: Run ESLint (admin-dashboard warning ratchet)
      run: pnpm --filter @o4o/admin-dashboard run lint
    
    # WO-O4O-SECURITY-ROUTE-STATIC-GUARD-CI-V1
    # 2026-08-08 사고(/__debug__/** 무인증 노출) 재발 방지. blocking.
    #   R1 GET handler 안의 DB write · R2 권한 하드코딩 · R3 debug/test route 무가드 등록
    # 규칙 본문과 allowlist 는 scripts/check-unsafe-routes.mjs 상단 주석 참조.
    - name: Guard unsafe operational routes
      run: node scripts/check-unsafe-routes.mjs

    # WO-O4O-TYPEORM-ENTITY-REGISTRY-INTEGRITY-GUARD-AND-CI-ADOPTION-V1
    # 2026-08-25 사고(AiEngine/AiQueryPolicy/AiQueryLog 미등록 → /api/ai/admin/** 전면 500) 재발 방지. blocking.
    #   apps/api-server/src/database/entities.ts = runtime entity registry SSOT
    #   정의 ↔ registry 불일치(미등록 · 중복 · stale import · 배열 누락)를 정적으로 차단한다.
    # DB 연결도 secret 도 필요 없는 순수 정적 검사다. 규칙 본문은 scripts/check-typeorm-entities.mjs 상단 주석 참조.
    - name: Guard TypeORM entity registry integrity
      run: node scripts/check-typeorm-entities.mjs

    - name: Check for console.log statements
      run: |
        # Find all console.log statements, excluding comments, test files, CLI scripts, config files, migrations, and logger utilities
        # Also exclude main.tsx/main.ts files (entry points with startup logs)
        CONSOLE_LOGS=$(grep -r "console\.log" apps/ --include="*.ts" --include="*.tsx" \
          --exclude-dir=node_modules --exclude-dir=dist \
          --exclude-dir=test --exclude-dir=e2e \
          --exclude-dir=scripts \
          --exclude-dir=cli \
          --exclude-dir=vscode-extension \
          --exclude="*test*" --exclude="*spec*" \
          --exclude="vite.config.ts" --exclude="*.config.ts" \
          --exclude="logger.ts" --exclude="*logger*.ts" \
          --exclude="cli.ts" \
          --exclude="*-job.ts" \
          --exclude="main.tsx" \
          --exclude="main.ts" \
          --exclude="migrate.ts" \
          | grep -v "//.*console\.log" \
          | grep -v "^\s*//" \
          | grep -v "\*.*console\.log" \
          | grep -v "database/migrations/" || true)

        if [ -n "$CONSOLE_LOGS" ]; then
          echo "❌ Found console.log statements in production code:"
          echo "$CONSOLE_LOGS"
          exit 1
        else
          echo "✅ No console.log statements found in production code"
        fi

    # WO-O4O-LOCAL-DATA-TOOL-BRIDGE-CLOSURE-V1 §22
    # Local Work Agent 는 런타임 의존성 0(package.json 없음)이라 jest 대상이 아니다.
    # 로컬 SQLite 계약(node:sqlite DatabaseSync, key/setting allowlist, 임의 SQL·파일 부재)을
    # Node 내장 test runner 로 blocking 검증한다. Node 22 내장이라 설치·DB·secret 불필요.
    # Node 22.18.0 에서 `node --test <dir>` 는 실패하므로 파일을 명시한다(실측 확인).
    # WO-O4O-BROWSER-DOM-CONTROL-V0 §54: Chrome Extension / Native Bridge 계약 사본 대조와 DOM relay ·
    # host 라우팅 · content-script 소스 잠금을 같은 runner 로 blocking 검증한다(의존성 0, 파일 명시).
    - name: Run tests (o4o-local-agent node:test)
      run: node --test tools/o4o-local-agent/test/local-db.test.mjs tools/o4o-local-agent/test/native-bridge.test.mjs tools/o4o-local-agent/test/browser-dom.test.mjs

    - name: Run tests (admin-dashboard Vitest, serial to prevent OOM)
      run: cd apps/admin-dashboard && npx vitest run --passWithNoTests --pool=forks --poolOptions.forks.maxForks=1

    - name: Run tests (multi-tenant Vitest)
      run: cd apps/api-server/tests/multi-tenant && npx vitest run --passWithNoTests

    # WO-O4O-UI-VITEST-CI-ADOPTION-AND-PLATFORMONLY-MENU-GUARD-REGRESSION-V1
    # packages/ui 의 vitest 는 config 만 있고 CI 에 연결돼 있지 않아 로컬 전용이었다.
    # 공통 operator UI(4서비스 공유)의 회귀를 CI 에서 잡는다. blocking.
    #   - filterMenuByRole 메뉴 가시성 계약 (adminOnly / platformOnly / 2-인자 하위호환)
    #   - UserDetailPage 비밀번호 모달 serviceKey 선택
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom/@testing-library 를 그대로 쓴다.
    - name: Run tests (packages/ui Vitest)
      run: npx vitest run --config packages/ui/vitest.config.mjs

    # WO-O4O-PACKAGE-LEVEL-VITEST-CI-ADOPTION-FULL-CENSUS-AND-CLOSURE-V1
    # vitest.config.mjs 만 있고 workflow step 이 없어 로컬 전용이던 package-level 테스트
    # 5개(17 파일 · 241 tests) 를 blocking 으로 연결한다. 실패 패키지를 즉시 식별하기 위해
    # 개별 step 으로 둔다. 모든 config 가 passWithNoTests: false 라 무실행 통과가 불가능하다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom/@testing-library 를 그대로 쓴다.
    #   auth-utils       비밀번호 정책 · 오류 메시지 (17)
    #   auth-react       라우트 가드 · 역할 선택 · 서비스 인증 (44)
    #   store-ui-core    My Store parity 계약 (18)
    #   operator-core-ui community/content-hub 콘솔 · resources lifecycle (53)
    #   shared-space-ui  forum write shell · community nav · guide 계약 (109)

    - name: Run tests (auth-utils Vitest)
      run: npx vitest run --config packages/auth-utils/vitest.config.mjs

    - name: Run tests (auth-react Vitest)
      run: npx vitest run --config packages/auth-react/vitest.config.mjs

    - name: Run tests (store-ui-core Vitest)
      run: npx vitest run --config packages/store-ui-core/vitest.config.mjs

    - name: Run tests (operator-core-ui Vitest)
      run: npx vitest run --config packages/operator-core-ui/vitest.config.mjs

    - name: Run tests (shared-space-ui Vitest)
      run: npx vitest run --config packages/shared-space-ui/vitest.config.mjs

    # WO-O4O-PACKAGE-JEST-CI-ADOPTION-FULL-CENSUS-AND-CLOSURE-V1
    # package-local jest.config.cjs 만 있고 workflow step 이 없어 로컬 전용이던
    # package-level Jest 3개(6 파일 · 96 tests) 를 blocking 으로 연결한다.
    # 실패 패키지를 즉시 식별하기 위해 개별 step 으로 둔다.
    # --passWithNoTests 를 쓰지 않으므로 test discovery 가 비면 exit 1 이다(실측 확인).
    # DB · secret 불필요. 루트에 설치된 jest/ts-jest 를 그대로 쓴다.
    #   asset-copy-core    권한 체크 · 스냅샷 · 크로스서비스 격리 (4 파일 · 64)
    #   account-ui         사용자 표시명 공통화 계약 (1 파일 · 20)
    #   appearance-system  버튼/브레드크럼/스크롤탑 CSS 생성 (1 파일 · 12)

    - name: Run tests (asset-copy-core Jest)
      run: cd packages/asset-copy-core && npx jest --config jest.config.cjs

    - name: Run tests (account-ui Jest)
      run: cd packages/account-ui && npx jest --config jest.config.cjs

    - name: Run tests (appearance-system Jest)
      run: cd packages/appearance-system && NODE_OPTIONS=--experimental-vm-modules npx jest --config jest.config.cjs

    # WO-O4O-KPA-INTEREST-PRODUCT-WORKTABLE-TO-CANONICAL-CART-ADOPTION-V1
    # 관심상품 작업대 행 → canonical store_cart_items payload 및 "주문 가능" 판정 계약
    # (offerId 동등 비교만 · 이름/SKU heuristic 0 · event_offer/seller_recruitment 축 분리 ·
    #  표시용 가격 · organizationId 미전송)을 CI 에서 고정한다. blocking.
    # KPA 에도 테스트 실행 경로가 없었다 — 이 축은 잘못되면 미승인 offer 나 이벤트오퍼 축이
    # 조용히 B2B 주문 경로로 새어 들어간다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom 을 그대로 쓴다.
    - name: Run tests (web-kpa-society Vitest)
      run: npx vitest run --config services/web-kpa-society/vitest.config.mjs

    # WO-O4O-WINDOWS-APP-WINDOW-CONTROL-V0 §5 (선행 작업)
    # services/web-neture 의 Local Work Agent 연결 카드 회귀 테스트는
    # vitest.config.mjs 만 있고 workflow step 이 없어 로컬 전용이었다.
    # LNA 미허용 / agent 미실행 / 정상 연결을 구분하는 안내·재시도 UX 는
    # 조용히 깨지는 축이라 blocking 으로 연결한다.
    # DB · secret 불필요. 루트에 설치된 vitest/jsdom 을 그대로 쓴다.
    - name: Run tests (web-neture Vitest)
      run: npx vitest run --config services/web-neture/vitest.config.mjs

  # 2. API Jest regression gate
  # The suite remains fully blocking and serial (--maxWorkers=1) to preserve the
  # existing OOM protection. Moving it to its own runner only changes wall-clock
  # scheduling: it can execute in parallel with the other quality checks.
  api-tests:
    name: API Server Jest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        strict-lockfile: 'true'
        build-packages: 'false'

    - name: Build api-server workspace dependencies
      run: pnpm --filter '@o4o/api-server^...' run build

    - name: Run tests (api-server Jest, serial to prevent OOM)
      run: cd apps/api-server && npx jest --maxWorkers=1

  # 3. Build all applications
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [quality-check, api-tests]
    
    # build matrix 대상은 배포되는 앱만 유지한다.
    # WO-O4O-MAIN-SITE-FULL-SOURCE-DELETION-V1 에서 은퇴 앱이 소스째 삭제되어
    # 기존 matrix 제외 근거 주석도 함께 제거했다.
    strategy:
      matrix:
        app: [admin-dashboard]
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup build environment
      uses: ./.github/actions/setup-build-env
      with:
        node-version: ${{ env.NODE_VERSION }}
        # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1: 검증 경로에서는 lockfile drift 를 실패로 만든다.
        strict-lockfile: 'true'

    - name: Verify package builds
      run: |
        echo "🔍 Verifying all build:packages dist directories..."
        MISSING_DIST=0

        # All packages built by build:packages (must stay in sync)
        for pkg in types auth-utils capabilities appearance-system auth-client utils ui auth-context block-renderer content-editor slide-app organization-core forum-core pharmacy-ai-insight ai-prompts lms-client account-ui; do
          if [ ! -d "packages/$pkg/dist" ]; then
            echo "❌ packages/$pkg/dist not found!"
            MISSING_DIST=1
          else
            echo "✅ packages/$pkg/dist exists"
          fi
        done

        if [ $MISSING_DIST -eq 1 ]; then
          echo "❌ Some dist directories are missing. Cannot proceed."
          exit 1
        fi

        echo "✅ All build:packages outputs verified ($(echo types capabilities appearance-system auth-client utils ui auth-context block-renderer content-editor slide-app organization-core forum-core pharmacy-ai-insight lms-client account-ui | wc -w) packages)"

    - name: Build ${{ matrix.app }}
      run: bash scripts/ci-build-app.sh ${{ matrix.app }}
    
    # WO-O4O-CI-BLOCKING-GATE-FINALIZATION-V1
    # 이 continue-on-error 는 **의도적으로 유지**한다.
    # 검증이 아니라 산출물 업로드이며(빌드는 이미 위에서 성공), 업로드 실패는
    # 코드 결함이 아니라 인프라 이슈다. 즉 결함을 숨기지 않는다.
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: ${{ matrix.app }}-dist
        path: |
          apps/${{ matrix.app }}/dist
          apps/${{ matrix.app }}/build
        retention-days: 7