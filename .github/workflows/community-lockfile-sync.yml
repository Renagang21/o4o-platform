name: Community branch lockfile sync

on:
  push:
    branches:
      - work/commonization-community

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/commonization-community

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: pnpm

      - name: Refresh selected workspace lockfile importer
        run: pnpm install --lockfile-only --ignore-scripts --filter pharmacy-hub-web...

      - name: Remove one-shot workflow and commit lockfile
        run: |
          rm .github/workflows/community-lockfile-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/community-lockfile-sync.yml
          git diff --cached --exit-code && exit 0
          git commit -m "chore(pharmacy-hub): sync forum workspace lockfile"
          git push origin HEAD:work/commonization-community
