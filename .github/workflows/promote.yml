name: Promote

# WO-O4O-CICD-UNIFIED-DELIVERY-PIPELINE-V1 §13 · §14 — LEVEL_3 · 첫 verified rollout 의 **승인 1회**.
#
#   사람이 하는 일:  gh workflow run promote.yml -f sha=<40자 SHA>
#                   (Delivery 의 commit status `production` 이 HOLD 일 때 그 description 에 이 명령이 그대로 적힌다)
#   사람이 다시 입력하지 않는 것: 서비스 목록 · 태그 · rollout mode · serving SHA · migration 여부 — 전부 SHA 에서 다시 계산한다.
#
#   안전 조건 (delivery.yml classify · deploy-orchestrate.mjs decidePromote):
#     - CI Pipeline 이 그 SHA 에서 green · DEPLOY_FREEZE == 'false'
#     - SHA == main HEAD == 이 run 의 workflow SHA — 승인 범위(serving → SHA)를 정확히 고정한다.
#       HEAD 가 움직였으면 거절 → 최신 SHA 로 다시 승인 (뒤에 쌓인 commit 이 승인 없이 섞이지 않는다)
#     - serving SHA 를 모르는 서비스는 승인으로도 배포하지 않는다 (break-glass = 각 deploy workflow 수동 실행)
#     - 배포 경로 = Delivery 와 동일 (reusable deploy · API 먼저 · verified rollout · rollback · migration Job 선행)
#
#   선택 입력: services (쉼표 — 그 서비스만) · dry_run ('true' = 판정만, 배포 0)

run-name: Promote ${{ inputs.sha }}${{ inputs.dry_run == 'true' && ' (dry-run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '승격할 commit SHA (40자 · main HEAD 와 같아야 한다)'
        required: true
      services:
        description: '(선택) 쉼표 목록 — 그 서비스만 승격. 비우면 승격 가능한 전부'
        required: false
        default: ''
      dry_run:
        description: "'true' = 판정만 (배포 0)"
        required: false
        default: 'false'
      force:
        description: "'true' = 같은 SHA 가 이미 승격됐거나 진행 중이어도 실행 (롤백 뒤 재배포 등)"
        required: false
        default: 'false'

concurrency:
  group: promote-production
  cancel-in-progress: false

# 쓰기 권한은 배포 호출 job(promote)에만 준다 — Same-SHA guard 는 읽기만 한다(SonarCloud githubactions:S8233).
permissions:
  contents: read
  actions: read

jobs:
  # WO-O4O-PROMOTE-SAME-SHA-GUARD-V1 — 같은 SHA 의 Promote(dry-run 제외)가 이미 성공했거나 진행 · 대기 중이면
  # 배포 호출을 건너뛴다(IR §9-4: 207회 중 50회가 직전과 같은 SHA). 판정은 Actions API 의 Promote run 목록만 쓴다.
  # 실패 · 취소된 이전 run 은 재시도를 허용한다. 확인할 수 없으면 막지 않는다(`scripts/ci/promote-dedupe.mjs`).
  # 이 job 자체가 실패 · 누락돼도(output 비어 있음) 아래 promote 는 그대로 실행된다 — 중복 방지가 승격을 막지 않는다.
  dedupe:
    name: Same-SHA guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci/promote-dedupe.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Skip when the same SHA was already promoted or is in flight
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTE_SHA: ${{ inputs.sha }}
          PROMOTE_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTE_FORCE: ${{ inputs.force }}
        run: node scripts/ci/promote-dedupe.mjs

  promote:
    name: Promote
    needs: [dedupe]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    # delivery.yml(reusable)이 필요로 하는 권한 — 종전 workflow 단위 권한과 같은 집합이다.
    permissions:
      contents: read
      actions: read     # ci-gate (CI run 조회)
      statuses: write   # commit status `production`
      id-token: write   # GCP 인증 = WIF
    uses: ./.github/workflows/delivery.yml
    with:
      mode: promote
      target_sha: ${{ inputs.sha }}
      services: ${{ inputs.services }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
