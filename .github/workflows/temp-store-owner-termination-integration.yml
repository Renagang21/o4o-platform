name: TEMP Store Owner Termination Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api-server/src/services/store-owner-termination.service.ts'
      - 'apps/api-server/src/__tests__/store-owner-termination.integration.spec.ts'
      - '.github/workflows/temp-store-owner-termination-integration.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      O4O_ISOLATED_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env
        with:
          node-version: '22.18.0'
      - name: Build API workspace dependencies
        run: |
          pnpm --filter '@o4o/types' run build
          pnpm --filter '@o4o/utils' run build
      - name: Run WO regression suites
        run: |
          pnpm --filter '@o4o/api-server' exec jest             src/__tests__/store-owner-backcompat-servicekey.spec.ts             src/__tests__/store-owner-membership-gate.spec.ts             src/__tests__/store-owner-service-scoped-org.spec.ts             src/__tests__/kpa-me-context-store-owner-contract.spec.ts             src/services/approval/__tests__/MembershipApprovalService.bareRoleContract.test.ts             src/services/approval/__tests__/MembershipApprovalService.rejection.test.ts             src/__tests__/store-owner-termination.service.spec.ts             --runInBand
      - name: Run isolated lifecycle fixture
        run: pnpm --filter '@o4o/api-server' exec jest src/__tests__/store-owner-termination.integration.spec.ts --runInBand
