name: Store Owner Demo Participation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only plan first; apply requires the exact plan digest'
        type: choice
        options: [plan, apply]
        default: plan
      digest:
        description: 'Exact before-image digest from the read-only plan'
        type: string
        required: false

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write

# Same maintenance lock as the existing canonical Demo operations.
concurrency:
  group: pharmacyhub-global-url-map
  cancel-in-progress: false

jobs:
  participation:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DEMO_ACCOUNTS_MODE: ${{ inputs.mode }}
      DEMO_ACCOUNTS_DIGEST: ${{ inputs.digest }}
      DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
      WORKFLOW_ACTOR: ${{ github.triggering_actor }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Enforce scoped production operation gate
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$WORKFLOW_ACTOR" != "$REPOSITORY_OWNER" ]; then
            echo 'Demo participation requires the repository owner on main.'; exit 1
          fi
          case "$DEMO_ACCOUNTS_MODE" in plan|apply) ;; *) echo 'Unknown operation mode.'; exit 1 ;; esac
          if [ "$DEMO_ACCOUNTS_MODE" = 'apply' ]; then
            if [ "$DEPLOY_FREEZE" != 'false' ] || ! [[ "$DEMO_ACCOUNTS_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
              echo 'Apply requires an unfrozen deployment and exact plan digest.'; exit 1
            fi
          fi
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env
        with:
          node-version: '22.18.0'
          build-packages: 'false'
          strict-lockfile: 'true'
      - name: Verify production operation gates
        run: node --test scripts/deployment/demo-owner-participation-gate.test.mjs
      - name: Require successful main CI for writes
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "CI Gate" and .conclusion == "success")] | length > 0' > "$RUNNER_TEMP/owner-demo-ci-gate"
          test "$(cat "$RUNNER_TEMP/owner-demo-ci-gate")" = 'true'
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/117791934476/locations/global/workloadIdentityPools/github-actions/providers/o4o-platform
          service_account: github-actions@netureyoutube.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: netureyoutube
          skip_install: true
      - name: Start existing authenticated SQL proxy
        run: |
          docker run -d --rm --user "$(id -u):$(id -g)" --name owner-demo-sql-proxy --network host \
            --mount "type=bind,src=$GOOGLE_APPLICATION_CREDENTIALS,dst=/credentials.json,readonly" \
            gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3 \
            --credentials-file=/credentials.json --address=127.0.0.1 --port=55432 \
            netureyoutube:asia-northeast3:o4o-platform-db
          node --input-type=module -e '
            import net from "node:net";
            for (let attempt=0; attempt<30; attempt++) {
              const ready=await new Promise(resolve=>{
                const socket=net.connect(55432,"127.0.0.1");socket.setTimeout(1000);
                socket.on("connect",()=>{socket.destroy();resolve(true);});
                socket.on("error",()=>{socket.destroy();resolve(false);});
                socket.on("timeout",()=>{socket.destroy();resolve(false);});
              });
              if(ready)process.exit(0);
              await new Promise(resolve=>setTimeout(resolve,1000));
            }
            process.exit(1);'
      - name: Build canonical public Demo config
        run: pnpm --filter @o4o/auth-utils build
      - name: Plan or apply approved Store Owner participation
        env:
          DEMO_ACCOUNTS_PARTICIPATION: 'true'
          DB_USERNAME: ${{ secrets.GCP_DB_USERNAME }}
          DB_NAME: ${{ secrets.GCP_DB_NAME }}
          DEMO_ACCOUNTS_OUTPUT: ${{ runner.temp }}/demo-owner-participation.json
        run: pnpm exec tsx apps/api-server/src/scripts/demo-account-reconcile.ts
      - name: Save sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-owner-participation-${{ github.run_id }}
          path: ${{ runner.temp }}/demo-owner-participation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop owned proxy
        if: always()
        run: docker stop owner-demo-sql-proxy >/dev/null 2>&1 || true
