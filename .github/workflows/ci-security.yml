name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths:
            - 'apps/api-server/src'
          paths-ignore:
            - '**/node_modules'
            - '**/dist'
            - '**/build'
            - '**/*.test.ts'
            - '**/*.spec.ts'
            - '**/*.test.tsx'
            - '**/*.spec.tsx'
            - '**/tests'
            - '**/test'
            - '**/__tests__'
            - '**/coverage'
            - '**/.next'
            - '**/.nuxt'
            - '**/scripts'
            - '**/*.config.js'
            - '**/*.config.ts'
            - '**/*.config.cjs'
            - '**/*.config.mjs'
            - '**/blocks'
            - '**/components'
            - '**/pages'

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        ram: 6000
        threads: 2
        output: codeql-sarif

    - name: TEMP print CodeQL findings for PR222
      if: always()
      shell: bash
      run: |
        python - <<'PY'
        import glob,json
        for p in glob.glob('codeql-sarif/*.sarif'):
            d=json.load(open(p,encoding='utf-8'))
            for run in d.get('runs',[]):
                rules={r.get('id'):r for r in run.get('tool',{}).get('driver',{}).get('rules',[])}
                for x in run.get('results',[]):
                    loc=((x.get('locations') or [{}])[0].get('physicalLocation') or {})
                    art=(loc.get('artifactLocation') or {}).get('uri')
                    reg=loc.get('region') or {}
                    rid=x.get('ruleId')
                    msg=(x.get('message') or {}).get('text')
                    props=rules.get(rid,{}).get('properties') or {}
                    print(json.dumps({'ruleId':rid,'securitySeverity':props.get('security-severity'),'message':msg,'file':art,'line':reg.get('startLine')},ensure_ascii=False))
        PY