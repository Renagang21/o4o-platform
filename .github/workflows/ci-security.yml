name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'
  # WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1 §16
  # 수동 실행은 판정과 무관하게 항상 full Analyze 다 (아래 analyze.if).
  workflow_dispatch:

# WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1 §17 · §18
# CI Pipeline 과 같은 원칙이다 — main/develop push 의 보안 분석은 뒤따르는 push 가
# 취소하지 않고, PR 은 새 revision 이 오면 이전 검사가 obsolete 이므로 취소한다.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1 §15
  #
  # docs-only push 에서도 전체 CodeQL Analyze(실측 7분 32초)가 돌았다.
  # 분석 대상은 `apps/api-server/src` 뿐이므로 Markdown 문서 추가·수정만인 commit 에서는
  # **분석 대상 소스가 한 줄도 바뀌지 않는다.**
  #
  # workflow 자체를 `paths-ignore` 로 없애지 않는 이유: required check / 상태 보고가
  # 통째로 사라진다. 대신 **가벼운 detect 잡은 항상 돌고 Analyze 만 조건부로 skip** 한다.
  # 판정은 CI Pipeline 과 동일한 SSOT(`scripts/ci/detect-affected.mjs`)다.
  detect:
    name: Detect affected scope
    runs-on: ubuntu-latest
    outputs:
      docs_fast_eligible: ${{ steps.scope.outputs.docs_fast_eligible }}

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # base SHA 이상 · force push · shallow history · 매핑 불가 경로는 전부
    # docs_fast_eligible=false 로 떨어진다 → Analyze 가 그대로 돈다.
    - name: Classify changed scope
      id: scope
      env:
        BASE_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}
        HEAD_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
      run: node scripts/ci/detect-affected.mjs

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [detect]
    # WO-O4O-DOCS-ONLY-CI-SECURITY-FAST-PATH-AND-PUSH-CONCURRENCY-PRESERVATION-V1 §16
    # schedule 은 변경 영향과 무관한 정기 보안 전수 검사다 — 판정 결과와 관계없이 항상 돈다.
    # workflow_dispatch(수동 실행)도 full Analyze 가 안전한 기본값이다.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.detect.outputs.docs_fast_eligible != 'true'
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        config: |
          paths:
            - 'apps/api-server/src'
          paths-ignore:
            - '**/node_modules'
            - '**/dist'
            - '**/build'
            - '**/*.test.ts'
            - '**/*.spec.ts'
            - '**/*.test.tsx'
            - '**/*.spec.tsx'
            - '**/tests'
            - '**/test'
            - '**/__tests__'
            - '**/coverage'
            - '**/.next'
            - '**/.nuxt'
            - '**/scripts'
            - '**/*.config.js'
            - '**/*.config.ts'
            - '**/*.config.cjs'
            - '**/*.config.mjs'
            - '**/blocks'
            - '**/components'
            - '**/pages'

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        ram: 6000
        threads: 2