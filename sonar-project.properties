sonar.projectKey=Renagang21_o4o-platform
sonar.organization=renagang21

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=o4o-platform
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=apps/admin-dashboard/src,apps/api-server/src,packages/auth-client/src,packages/auth-context/src,packages/types/src,packages/ui/src,packages/utils/src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,**/test-*.ts

# Declarative fingerprint data must retain literal object entries (migration guard C22).
# Exclude only this registry from copy detection; retain source/security analysis and C22 validation.
sonar.cpd.exclusions=apps/api-server/src/database/incremental/expected-schema-states.ts

# Test files
sonar.tests=apps/admin-dashboard/src/test

# Coverage reports
sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info

# TypeScript/JavaScript specific
sonar.typescript.tsconfigPaths=apps/admin-dashboard/tsconfig.json,apps/api-server/tsconfig.json
