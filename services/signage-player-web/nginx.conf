server {
    # WO-O4O-SIGNAGE-PLAYER-WEB-DEPLOYMENT-ADOPTION-AND-PRODUCTION-SMOKE-V1
    # Cloud Run 은 컨테이너의 $PORT(기본 8080) 로만 트래픽을 보낸다.
    # deploy-web-services.yml 의 다른 web service 와 동일하게 --port=8080 을 쓰므로
    # 여기도 8080 이어야 한다 (기존 80 은 Cloud Run 에서 기동 실패).
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Cache static assets
    #
    # NOTE: nginx 의 add_header 는 상속되지 않고 location 단위로 대체된다.
    # 이 location 에 add_header 가 있으므로 server level 보안 헤더를 여기서 다시 선언한다.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # 최소 보안 헤더.
    # 본 WO §24 에 따라 CSP / X-Frame-Options 는 도입하지 않는다:
    #  - CSP 는 remote media/video(HLS·이미지·iframe 블록) 를 깨뜨릴 위험이 있고
    #  - X-Frame-Options 는 admin-dashboard 의 player preview iframe 을 깨뜨린다.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
}
